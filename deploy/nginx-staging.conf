# =============================================================================
#  nginx-staging.conf — isolated STAGING vhost (staging.* → app on :8003)
# =============================================================================
#  Install: copy to /etc/nginx/sites-available/staging, symlink into
#  sites-enabled, `nginx -t && systemctl reload nginx`.
#  Gated by HTTP basic auth (/etc/nginx/.staging_htpasswd) + noindex so staging
#  is never publicly browsable or search-indexed. staging.* is a transport alias:
#  the apex Host is presented to the app for routing; the app's own absolute
#  links come from SERVER_URL (=staging domain) in the staging biz.env.
#  TLS (443) is added by certbot --nginx AFTER the staging DNS records resolve.
# =============================================================================
map $host $staging_upstream_host {
    staging.nidaanpartner.com  nidaanpartner.com;
    staging.sarathi-ai.com     sarathi-ai.com;
    default                    $host;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.nidaanpartner.com staging.sarathi-ai.com;

    # Isolated logs: staging's gated basic-auth 401s must NEVER reach the shared
    # access.log that fail2ban watches, or a tester's login prompt would ban them.
    access_log /var/log/nginx/staging_access.log;
    error_log  /var/log/nginx/staging_error.log warn;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    server_tokens off;
    client_max_body_size 50M;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /health { proxy_pass http://127.0.0.1:8003; proxy_set_header Host $staging_upstream_host; }

    location /ws/agent {
        auth_basic "Sarathi Staging"; auth_basic_user_file /etc/nginx/.staging_htpasswd;
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $staging_upstream_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    location / {
        auth_basic "Sarathi Staging"; auth_basic_user_file /etc/nginx/.staging_htpasswd;
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $staging_upstream_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
