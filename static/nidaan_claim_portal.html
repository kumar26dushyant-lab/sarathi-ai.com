<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Claim">

<title>My Claim · NidaanPartner</title>
<style>
    .docrow{display:flex;align-items:center;gap:.5rem;margin:.3rem 0}
    .docrow .doc{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .docx{background:none;border:1px solid rgba(220,38,38,.35);color:#dc2626;border-radius:6px;
      padding:.2rem .55rem;font-size:.74rem;font-weight:700;cursor:pointer;font-family:inherit;
      white-space:nowrap;line-height:1.3}

    .docx:disabled{opacity:.5;cursor:not-allowed}
  :root{ --brand:#0b5c4f; --brand-2:#0d7a68; --bg:#f4f7f6; --card:#ffffff; --ink:#12211d;
         --muted:#5b6b66; --line:#e2ebe8; --good:#0d7a68; --warn:#b4560a; --accent:#0d7a68; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; line-height:1.55; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 1rem 3rem; }
  header{ background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#fff; padding:1.1rem 1rem calc(1.4rem + env(safe-area-inset-top)); }
  header .inner{ max-width:560px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:.5rem; }
  .brand{ font-weight:800; font-size:1.02rem; letter-spacing:.2px; }
  .brand small{ display:block; font-weight:500; font-size:.7rem; opacity:.85; }
  .lang{ background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); color:#fff; border-radius:20px; padding:.3rem .7rem; font-size:.78rem; font-weight:600; cursor:pointer; }
  .greet{ margin-top:.8rem; font-size:1.15rem; font-weight:800; }
  .greet small{ display:block; font-weight:500; font-size:.82rem; opacity:.92; margin-top:.15rem; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:1.05rem 1.05rem; margin-top:1rem; box-shadow:0 1px 3px rgba(10,40,32,.05); }
  .card h2{ margin:0 0 .5rem; font-size:.82rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
  .status-pill{ display:inline-block; background:#e7f4f0; color:var(--brand); font-weight:700; border-radius:20px; padding:.4rem .9rem; font-size:.95rem; }
  .row{ display:flex; justify-content:space-between; gap:.8rem; padding:.5rem 0; border-bottom:1px dashed var(--line); font-size:.95rem; }
  .row:last-child{ border-bottom:0; }
  .row .lbl{ color:var(--muted); }
  .row .val{ font-weight:700; text-align:right; }
  .row.total{ border-top:2px solid var(--line); border-bottom:0; margin-top:.2rem; padding-top:.6rem; }
  .row.total .val{ color:var(--brand); font-size:1.05rem; }
  .note{ font-size:.82rem; color:var(--muted); margin-top:.5rem; }
  .terms{ max-height:150px; overflow-y:auto; background:#f8fbfa; border:1px solid var(--line); border-radius:10px; padding:.7rem .8rem; font-size:.85rem; color:#33433e; margin-top:.7rem; }
  .btn{ display:block; width:100%; border:0; border-radius:12px; padding:.95rem; font-size:1rem; font-weight:800; cursor:pointer; margin-top:.9rem; }
  .btn-primary{ background:var(--brand); color:#fff; }
  .btn-primary:disabled{ opacity:.55; }
  .accepted{ background:#e7f4f0; border:1px solid #bfe3d9; color:var(--brand); border-radius:12px; padding:.85rem; text-align:center; font-weight:700; margin-top:.9rem; }
  label.chk{ display:flex; gap:.55rem; align-items:flex-start; margin-top:.8rem; font-size:.88rem; cursor:pointer; }
  label.chk input{ margin-top:.2rem; width:18px; height:18px; flex:0 0 auto; }
  .reassure{ text-align:center; color:var(--muted); font-size:.85rem; margin-top:1.4rem; padding:0 .5rem; }
  .loading,.err{ text-align:center; padding:3rem 1rem; color:var(--muted); }
  .err b{ color:var(--ink); }
  .illust-tag{ font-size:.72rem; color:var(--warn); font-weight:700; margin-top:.4rem; }
  .tl{ margin-top:.3rem; }
  .tl-row{ display:flex; gap:.7rem; align-items:flex-start; padding:.35rem 0; }
  .tl-dot{ width:11px; height:11px; border-radius:50%; background:var(--brand); margin-top:.35rem; flex:0 0 auto; box-shadow:0 0 0 3px #e7f4f0; }
  .tl-lbl{ font-weight:700; font-size:.92rem; }
  .tl-at{ font-size:.76rem; color:var(--muted); }
  .doc{ display:block; background:#f8fbfa; border:1px solid var(--line); border-radius:9px; padding:.55rem .7rem; margin-bottom:.4rem; text-decoration:none; color:var(--brand); font-weight:600; font-size:.88rem; }
  /* A file picked but not yet handed over, and the two boxes that say which state you are in.
     Colour is not the only signal - each one carries words - because these are read on a cheap
     phone in bad light. */
  .pendtag{font-size:.72rem;font-weight:700;color:#92400e;background:#fef3c7;
    border:1px solid #f59e0b;border-radius:999px;padding:.1rem .5rem;margin-left:.4rem}

    padding:.6rem .7rem;font-size:.9rem;line-height:1.5;margin:.2rem 0 .6rem}

function t(k){ return (T[LANG]||T.en)[k] || T.en[k] || k; }
var TOKEN = "", DATA = null;

function getToken(){
  var h = (location.hash||"").replace(/^#/,"");
  var m = /(?:^|&)t=([^&]+)/.exec(h);
  if(m) return decodeURIComponent(m[1]);
  var q = new URLSearchParams(location.search);
  return q.get("token") || "";
}
function inr(n){ try{ return "₹" + Math.round(n).toLocaleString("en-IN"); }catch(e){ return "₹"+Math.round(n); } }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function toggleLang(){
  LANG = (LANG==="en") ? "hi" : "en";
  localStorage.setItem("claim_lang", LANG);
  document.getElementById("langBtn").textContent = (LANG==="en") ? "हिंदी" : "English";
  document.documentElement.lang = LANG;
  if(DATA) render();
}

// The link gets you as far as "is this you?"; a code sent to the number or email already on the
// claim is what actually opens it. SESSION is what every call below uses - the link itself no
// longer opens anything, which is the whole point (founder, 16 Sep).
var SESSION = "";
function getSession(){
  var h = (location.hash||"").replace(/^#/,"");
  var m = /(?:^|&)s=([^&]+)/.exec(h);            // staff preview links carry #s=
  if(m) return decodeURIComponent(m[1]);
  try{ return sessionStorage.getItem("claim_session_" + TOKEN) || ""; }catch(e){ return ""; }
}
function keepSession(tok){
  SESSION = tok;
  try{ sessionStorage.setItem("claim_session_" + TOKEN, tok); }catch(e){}
}
function auth(){ return { "Authorization":"Bearer " + (SESSION || TOKEN) }; }

async function load(){
  TOKEN = getToken();
  document.getElementById("langBtn").textContent = (LANG==="en") ? "हिंदी" : "English";
  SESSION = getSession();
  if(!TOKEN && !SESSION){ return showErr(); }
  if(SESSION){
    try{
      var rs = await fetch("/nidaan/claim/api/me", { headers:{ "Authorization":"Bearer "+SESSION } });
      if(rs.ok){ DATA = await rs.json(); return render(); }
    }catch(e){}
    SESSION = "";                                  // expired - ask them to confirm again
    try{ sessionStorage.removeItem("claim_session_" + TOKEN); }catch(e){}
    if(!TOKEN) return showErr();
  }
  return askWhoYouAre();
}

async function askWhoYouAre(){
  var where = null;
  try{
    var r = await fetch("/nidaan/claim/api/verify/where", { headers: auth() });
    if(!r.ok) return showErr();
    where = await r.json();
  }catch(e){ return showErr(); }
  var ch = where.channels || [];
  document.getElementById("greetWrap").innerHTML =
    '<h1>' + esc(t("greet")) + (where.name ? " " + esc(where.name) : "") + '</h1>';
  document.getElementById("reassure").textContent = "";
  if(!ch.length){
    document.getElementById("content").innerHTML =
      '<div class="card"><h2>' + esc(t("vTitle")) + '</h2><p>' + esc(t("vNoWay")) + '</p></div>';
    return;
  }
  // An option that cannot deliver is worse than no option: WhatsApp only carries a code once the
  // person has written to us, so when it cannot, say so instead of letting them press it and
  // spend one of their codes on a message that never arrives.
  var btns = ch.map(function(c){
    var ready = (c.ready !== false);
    return '<button class="btn" style="width:100%;margin-bottom:.5rem'
      + (ready ? '' : ';opacity:.55') + '"'
      + (ready ? ' onclick="sendCode(\'' + c.kind + '\')"' : ' disabled')
      + '>' + esc(c.kind === "whatsapp" ? t("vWhats") : t("vEmail"))
      + ' <span style="opacity:.75">' + esc(c.masked) + '</span></button>'
      + (ready ? '' : '<div style="font-size:.8rem;color:#64748b;margin:-.3rem 0 .6rem">'
          + esc(t("vWaShut")) + '</div>');
  }).join("");
  document.getElementById("content").innerHTML =
      '<div class="card">'
    +   '<h2>🔒 ' + esc(t("vTitle")) + '</h2>'
    +   '<p style="font-size:.92rem;line-height:1.5">' + esc(t("vWhy")) + '</p>'
    +   '<div id="vPick" style="margin-top:.8rem">' + btns + '</div>'
    +   '<div id="vCode" style="display:none;margin-top:.8rem">'
    +     '<p id="vSentTo" style="font-size:.9rem"></p>'
    +     '<input id="vInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" '
    +       'placeholder="• • • • • •" '
    +       'style="width:100%;font-size:1.5rem;letter-spacing:.35em;text-align:center;padding:.6rem;'
    +       'border-radius:10px;border:1px solid #cbd5e1;margin:.3rem 0 .6rem">'
    +     '<button class="btn" style="width:100%" onclick="checkCode()">' + esc(t("vOpen")) + '</button>'
    +     '<button class="btn ghost" style="width:100%;margin-top:.4rem" onclick="askWhoYouAre()">'
    +       esc(t("vAgain")) + '</button>'
    +   '</div>'
    +   '<p id="vMsg" style="font-size:.88rem;color:#b91c1c;min-height:1.2em"></p>'
    +   '<p style="font-size:.82rem;color:#64748b">' + esc(t("vNever")) + '</p>'
    + '</div>';
}

async function sendCode(kind){
  var msg = document.getElementById("vMsg");
  msg.style.color = "#64748b"; msg.textContent = t("vSending");
  try{
    var r = await fetch("/nidaan/claim/api/verify/start", { method:"POST",
      headers:{ "Authorization":"Bearer "+TOKEN, "Content-Type":"application/json" },
      body: JSON.stringify({ channel: kind, lang: LANG }) });
    var d = await r.json().catch(function(){ return {}; });
    if(!r.ok){ msg.style.color = "#b91c1c"; msg.textContent = d.detail || "Could not send the code."; return; }
    msg.textContent = "";
    document.getElementById("vPick").style.display = "none";
    document.getElementById("vCode").style.display = "";
    document.getElementById("vSentTo").textContent = t("vSent") + " " + (d.masked||"");
    var i = document.getElementById("vInput"); if(i) i.focus();
  }catch(e){ msg.style.color = "#b91c1c"; msg.textContent = "Could not send the code."; }
}

async function checkCode(){
  var msg = document.getElementById("vMsg");
  var code = ((document.getElementById("vInput")||{}).value || "").trim();
  msg.style.color = "#64748b"; msg.textContent = t("sending");
  try{
    var r = await fetch("/nidaan/claim/api/verify/check", { method:"POST",
      headers:{ "Authorization":"Bearer "+TOKEN, "Content-Type":"application/json" },
      body: JSON.stringify({ code: code }) });
    var d = await r.json().catch(function(){ return {}; });
    if(!r.ok){ msg.style.color = "#b91c1c"; msg.textContent = d.detail || "That code is not right."; return; }
    keepSession(d.session);
    msg.textContent = "";
    var me = await fetch("/nidaan/claim/api/me", { headers: auth() });
    if(!me.ok) return showErr();
    DATA = await me.json();
    render();
  }catch(e){ msg.style.color = "#b91c1c"; msg.textContent = "Could not check that code."; }
}
function showErr(){
  document.getElementById("greetWrap").innerHTML = "";
  document.getElementById("content").innerHTML =
    '<div class="err"><p style="font-size:2rem">🔒</p><p><b>'+esc(t("expired"))+'</b></p></div>';
  document.getElementById("reassure").textContent = "";
}

function render(){
  var c = DATA.claim, con = DATA.consent, il = con.illustration;
  document.getElementById("greetWrap").innerHTML =
    '<div class="greet">'+esc(t("greet"))+', '+esc(c.insured_name||"")+' 👋<small>'+esc(t("sub"))+'</small></div>'+
    '<div style="background:rgba(255,255,255,.15);border-radius:10px;padding:.55rem .7rem;margin-top:.7rem;font-size:.82rem;line-height:1.5">'+esc(t("safe"))+'</div>';

  var profileCard =
    '<div class="card"><h2>'+esc(t("profileTitle"))+'</h2>'+
      '<div class="row"><span class="lbl">'+esc(t("pName"))+'</span><span class="val">'+esc(c.insured_name||'—')+'</span></div>'+
      (c.insured_phone?'<div class="row"><span class="lbl">'+esc(t("pPhone"))+'</span><span class="val">'+esc(c.insured_phone)+'</span></div>':'')+
      (c.insured_email?'<div class="row"><span class="lbl">'+esc(t("pEmail"))+'</span><span class="val" style="font-size:.82rem">'+esc(c.insured_email)+'</span></div>':'')+
    '</div>';

  var statusCard =
    '<div class="card"><h2>'+esc(t("statusTitle"))+'</h2>'+
      '<span class="status-pill">'+esc(c.status_label||"")+'</span>'+
      '<div class="row" style="margin-top:.7rem"><span class="lbl">'+esc(t("claimRef"))+'</span><span class="val">#'+c.claim_id+' · '+esc(c.claim_type||"")+'</span></div>'+
      (c.disputed_amount ? '<div class="row"><span class="lbl">'+esc(t("disputed"))+'</span><span class="val">'+inr(c.disputed_amount)+'</span></div>' : '')+
    '</div>';

  // Fee AUTHORIZATION is shown ONLY once the claim is at L2 (reviewed GO). Before that the complainant
  // sees nothing about fees.
  var feeCard = "";
  if(con.is_l2 && con.accepted){
    var d = con.accepted_at ? String(con.accepted_at).slice(0,10) : "";
    feeCard = '<div class="card"><h2>'+esc(t("feeTitle"))+'</h2>'+
      '<div class="accepted">'+esc(t("accepted"))+(d?(' <br><small>'+esc(t("on"))+' '+esc(d)+'</small>'):'')+'</div></div>';
  } else if(con.is_l2){
    var gstRow = con.gst_enabled ? '<div class="row"><span class="lbl">'+esc(t("gst"))+' ('+con.gst_pct+'%)</span><span class="val">'+inr(il.gst_amount)+'</span></div>' : '';
    feeCard = '<div class="card"><h2>'+esc(t("feeTitle"))+'</h2>'+
      '<div style="background:#e7f4f0;border:1px solid #bfe3d9;border-radius:10px;padding:.6rem .7rem;font-size:.86rem;color:#0b5c4f;margin-bottom:.6rem">'+esc(t("noPayNow"))+'</div>'+
      '<p class="note">'+esc(t("feeIntro"))+'</p>'+
      '<div style="margin-top:.6rem">'+
        '<div class="row"><span class="lbl">'+esc(t("recovered"))+'</span><span class="val">'+inr(il.recovered_amount)+'</span></div>'+
        '<div class="row"><span class="lbl">'+esc(t("ourFee"))+' ('+con.fee_pct+'%)</span><span class="val">'+inr(il.fee_amount)+'</span></div>'+
        gstRow+
        '<div class="row total"><span class="lbl">'+esc(t("totalFee"))+'</span><span class="val">'+inr(il.total_our_fee)+'</span></div>'+
        '<div class="row"><span class="lbl">'+esc(t("netYou"))+'</span><span class="val" style="color:var(--good)">'+inr(il.net_to_claimant)+'</span></div>'+
      '</div>'+
      '<div class="illust-tag">'+esc(t("illust"))+'</div>'+
      '<div style="font-weight:700;margin-top:.9rem;font-size:.82rem;color:var(--muted)">'+esc(t("terms"))+'</div>'+
      '<div class="terms">'+esc((LANG==="hi" && con.terms_html_hi) ? con.terms_html_hi : (con.terms_html||""))+'</div>'+
      '<label class="chk"><input type="checkbox" id="agree" onchange="document.getElementById(\'acceptBtn\').disabled=!this.checked"> <span>'+esc(t("agree"))+'</span></label>'+
      '<button class="btn btn-primary" id="acceptBtn" disabled onclick="accept(this)">'+esc(t("accept"))+'</button>'+
    '</div>';
  }

  // Progress timeline (friendly, internal-note-free)
  var tl = DATA.timeline || [];
  var tlCard = "";
  if(tl.length){
    var items = tl.slice().reverse().map(function(s){
      return '<div class="tl-row"><span class="tl-dot"></span><div><div class="tl-lbl">'+esc(s.label)+'</div>'+
             (s.at?'<div class="tl-at">'+esc(String(s.at).slice(0,10))+'</div>':'')+'</div></div>';
    }).join('');
    tlCard = '<div class="card"><h2>'+esc(t("timelineTitle"))+'</h2><div class="tl">'+items+'</div></div>';
  }

  // Documents (complainant's own uploads) + upload
  var docs = DATA.documents || [];
  // A file that has been picked but not yet handed over says so, right on its own row. Without
  // that, "did it work?" has no answer on the screen and people press things again.
  var pending = 0;
  var docList = docs.length
    ? docs.map(function(d){
        var waiting = !d.submitted_at;
        if (waiting) pending++;
        return '<div class="docrow">'
          + '<a class="doc" href="'+esc(d.url)+'" target="_blank" rel="noopener">📄 '+esc(d.name)+'</a>'
          + (waiting ? '<span class="pendtag">'+esc(t("notSentYet"))+'</span>' : '')
          + '<button type="button" class="docx" onclick="removeDoc('+Number(d.doc_id)+',this)">'
          + esc(t("remove"))+'</button></div>';
      }).join('')
    : '<div class="note">'+esc(t("noDocs"))+'</div>';
  var docsCard = '<div class="card"><h2>'+esc(t("docsTitle"))+'</h2>'+
    '<p class="note">'+esc(t("docsHint"))+'</p>'+
    '<div id="docList" style="margin:.6rem 0">'+docList+'</div>'+
    (pending
      ? '<div class="pendbox">'+esc(t("pendingNote"))+'</div>'
      : (docs.length ? '<div class="donebox"><b>'+esc(t("submittedTitle"))+'</b><br>'
                       + esc(t("submittedNote"))+'</div>' : ''))+
    '<input type="file" id="docFiles" multiple accept=".pdf,.jpg,.jpeg,.png,.webp" style="display:none" onchange="uploadDocs(this)">'+
    '<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.2rem">'+
    '<button class="btn" id="uploadBtn" onclick="document.getElementById(\'docFiles\').click()">'+esc(t("upload"))+'</button>'+
    (pending ? '<button class="btn btn-primary" id="submitBtn" onclick="submitDocs()">'
               + esc(t("submitDocs"))+'</button>' : '')+
    '</div></div>';

  document.getElementById("content").innerHTML = profileCard + statusCard + feeCard + tlCard + docsCard;
  document.getElementById("reassure").textContent = t("reassure");
  maybeShowUpdate(tl);
}

// Attaching the wrong file is ordinary. Leaving it on the claim is not: the wrong paper
// reaching an insurer is a real problem, so the complainant can take it off themselves.
async function removeDoc(docId, btn){
  if(!confirm(t("confirmRemove"))) return;
  var old = btn.textContent;
  btn.disabled = true; btn.textContent = t("removing");
  try{
    var r = await fetch("/nidaan/claim/api/documents/"+docId, {
      method:"DELETE", headers: auth() });
    if(r.ok){
      var me = await fetch("/nidaan/claim/api/me",{headers: auth()});
      DATA = await me.json(); render();
      return;
    }
  }catch(e){}
  btn.disabled = false; btn.textContent = old;
  alert(t("removeFailed"));
}

// "These are the ones." Asks first, because the whole point is to give somebody the moment to
// check before their papers reach us.
async function submitDocs(){
  var btn = document.getElementById("submitBtn");
  if(!confirm(t("confirmSubmit"))) return;
  var old = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = t("submitting"); }
  try{
    var r = await fetch("/nidaan/claim/api/documents/submit", { method:"POST", headers: auth() });
    if(r.ok){
      var d = await r.json().catch(function(){ return {}; });
      var me = await fetch("/nidaan/claim/api/me",{headers: auth()});
      DATA = await me.json(); render();
      // Said out loud as well as shown, because the screen has just scrolled.
      alert(d.submitted ? t("submittedTitle") + "\n\n" + t("submittedNote")
                        : t("nothingToSubmit"));
      return;
    }
  }catch(e){}
  if(btn){ btn.disabled = false; btn.textContent = old; }
  alert(t("submitFailed"));
}

async function uploadDocs(input){
  if(!input.files || !input.files.length) return;
  var btn = document.getElementById("uploadBtn");
  btn.disabled = true; btn.textContent = t("uploading");
  var fd = new FormData();
  for(var i=0;i<input.files.length;i++){ fd.append("files", input.files[i]); }
  try{
    var r = await fetch("/nidaan/claim/api/documents/upload", { method:"POST", headers: auth(), body:fd });
    if(r.ok){ var me = await fetch("/nidaan/claim/api/me",{headers: auth()}); DATA = await me.json(); render(); }
    else { btn.disabled=false; btn.textContent=t("upload"); }
  }catch(e){ btn.disabled=false; btn.textContent=t("upload"); }
}

// Heavy "new update" popup — shows the latest status if it changed since last visit.
function maybeShowUpdate(tl){
  if(!tl || !tl.length) return;
  var latest = tl[tl.length-1];
  var key = "claim_seen_" + (DATA.claim ? DATA.claim.claim_id : "x");
  var sig = (latest.label||"") + "|" + (latest.at||"");
  if(localStorage.getItem(key) === sig) return;         // already seen this update
  localStorage.setItem(key, sig);
  var ov = document.createElement("div");
  ov.id = "updOv";
  ov.style.cssText = "position:fixed;inset:0;background:rgba(6,30,24,.55);display:flex;align-items:center;justify-content:center;padding:1.2rem;z-index:50";
  ov.innerHTML = '<div style="background:#fff;border-radius:16px;max-width:360px;width:100%;padding:1.3rem;text-align:center">'+
    '<div style="font-size:2rem">🔔</div><div style="font-weight:800;margin:.3rem 0;color:#0b5c4f">'+esc(t("updateTitle"))+'</div>'+
    '<div style="font-size:1.05rem;font-weight:700">'+esc(latest.label)+'</div>'+
    (latest.at?'<div style="color:#5b6b66;font-size:.85rem;margin-top:.2rem">'+esc(String(latest.at).slice(0,10))+'</div>':'')+
    '<button class="btn btn-primary" style="margin-top:1rem" onclick="var o=document.getElementById(\'updOv\');if(o)o.remove()">'+esc(t("ok"))+'</button></div>';
  document.body.appendChild(ov);
}

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("/nidaan/claim/sw.js", { scope:"/nidaan/claim" }).catch(function(){});
  });
}

async function accept(btn){
  btn.disabled = true; btn.textContent = t("sending");
  try{
    var r = await fetch("/nidaan/claim/api/consent", { method:"POST", headers: auth() });
    if(r.ok){ var me = await fetch("/nidaan/claim/api/me",{headers: auth()}); DATA = await me.json(); render(); }
    else { btn.disabled=false; btn.textContent=t("accept"); }
  }catch(e){ btn.disabled=false; btn.textContent=t("accept"); }
}

load();
</script>
