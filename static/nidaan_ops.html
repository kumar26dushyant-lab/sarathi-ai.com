<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html.ops-has-token #loginScreen{display:none!important}</style>
<script>
/* No-flicker gate: if a saved ops session exists, hide the login screen BEFORE
   paint so it never flashes while the token is validated. init() reveals login
   again only if that validation fails. */
try { if (localStorage.getItem('nidaan_ops_token')) document.documentElement.classList.add('ops-has-token'); } catch (e) {}
</script>
<title>Nidaan Ops — Internal Portal</title>
<link rel="stylesheet" href="/static/nidaan_design.css?v=2">
<link rel="stylesheet" href="/static/nidaan_polish.css?v=1">
<link rel="icon" href="/static/nidaan_logo.png" type="image/png">
<!-- PWA: installable staff app -->
<link rel="manifest" href="/static/nidaan-ops.webmanifest">
<meta name="theme-color" content="#060d1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nidaan Ops">
<link rel="apple-touch-icon" href="/static/nidaan_logo.png">
<script src="/static/_err.js?v=1"></script>
<script src="/static/nidaan_partner_claims.js?v=1"></script>
<script src="/static/nidaan_theme.js?v=1"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--nd-bg-base-2);color:var(--nd-text-primary);min-height:100vh;display:flex;flex-direction:column}
a{color:var(--nd-cyan-text);text-decoration:none}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1.5rem;background:var(--nd-bg-elev-blur);border-bottom:1px solid var(--nd-border);position:sticky;top:0;z-index:80;gap:.75rem}
/* App feel: when installed, keep the top bar clear of the notch/status bar and the
   content clear of the home indicator. */
@media (display-mode:standalone){
  .topbar{padding-top:calc(.7rem + env(safe-area-inset-top))}
  #appShell{padding-bottom:env(safe-area-inset-bottom)}
}
.topbar-brand{display:flex;align-items:center;gap:.55rem;font-weight:800;font-size:.95rem;color:var(--nd-text-primary)}
.topbar-brand img{height:28px;border-radius:5px}
.topbar-brand .pill{background:rgba(220,38,38,.18);color:var(--nd-danger-text);border:1px solid rgba(220,38,38,.3);border-radius:6px;font-size:.65rem;font-weight:800;padding:.15rem .45rem;letter-spacing:.04em;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:.75rem;font-size:.83rem}
.role-badge{background:rgba(6,182,212,.12);color:var(--nd-cyan-text);border:1px solid rgba(6,182,212,.25);border-radius:6px;padding:.2rem .55rem;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.btn-sm{padding:.35rem .8rem;border-radius:7px;font-size:.8rem;font-weight:600;border:none}
.btn-ghost{background:var(--nd-bg-surface-2);color:var(--nd-text-secondary);border:1px solid var(--nd-border-strong)}
.btn-ghost:hover{background:var(--nd-bg-surface-3);color:var(--nd-text-primary)}

/* ── LAYOUT ── */
.app-shell{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;flex-shrink:0;background:var(--nd-bg-surface);border-right:1px solid var(--nd-border);padding:1rem 0;display:flex;flex-direction:column;gap:.15rem;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.6rem 1.25rem;font-size:.84rem;font-weight:600;color:var(--nd-text-muted);cursor:pointer;transition:background .12s,color .12s;border-left:3px solid transparent;user-select:none}
.nav-item:hover{background:var(--nd-bg-surface-2);color:var(--nd-text-primary)}
.nav-item.active{background:rgba(6,182,212,.09);color:var(--nd-cyan-text);border-left-color:#22d3ee}
.nav-item .badge{margin-left:auto;background:rgba(220,38,38,.25);color:var(--nd-danger-text);border-radius:10px;font-size:.68rem;font-weight:700;padding:.1rem .4rem;min-width:18px;text-align:center}
.nav-divider{height:1px;background:var(--nd-bg-surface-2);margin:.5rem 1.25rem}
.main{flex:1;overflow-y:auto;padding:1.5rem 1.75rem}

/* ── SECTION HEADER ── */
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.5rem}
.section-title{font-size:1.15rem;font-weight:800;color:var(--nd-text-primary)}
.section-sub{font-size:.8rem;color:var(--nd-text-faint);margin-top:.15rem}

/* ── STAT CARDS ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--nd-bg-surface);border:1px solid var(--nd-border);border-radius:12px;padding:1.1rem 1.25rem}
.stat-card .sv{font-size:1.9rem;font-weight:800;color:var(--nd-cyan-text);line-height:1}
.stat-card .sl{font-size:.72rem;color:var(--nd-text-faint);margin-top:.3rem;text-transform:uppercase;letter-spacing:.06em}
.stat-card.warn .sv{color:var(--nd-warning-text)}
.stat-card.danger .sv{color:var(--nd-danger-text)}
.stat-card.ok .sv{color:var(--nd-success-text)}

/* ── TABLE ── */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--nd-border)}
table{width:100%;border-collapse:collapse;font-size:.83rem}
thead tr{background:var(--nd-bg-surface)}
th{padding:.7rem 1rem;text-align:left;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--nd-text-faint);white-space:nowrap;border-bottom:1px solid var(--nd-border)}
td{padding:.65rem 1rem;border-bottom:1px solid var(--nd-border);vertical-align:middle;color:var(--nd-text-secondary)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--nd-bg-surface)}

/* ── STATUS PILLS ── */
.pill-status{display:inline-block;border-radius:6px;padding:.2rem .55rem;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:capitalize}
.s-intimated{background:rgba(251,191,36,.12);color:var(--nd-warning-text);border:1px solid rgba(251,191,36,.25)}
.s-assigned{background:rgba(59,130,246,.12);color:var(--nd-info-text);border:1px solid rgba(59,130,246,.25)}
.s-in_review{background:rgba(139,92,246,.12);color:var(--nd-purple-text);border:1px solid rgba(139,92,246,.25)}
.s-in_negotiation{background:rgba(234,179,8,.12);color:#fde047;border:1px solid rgba(234,179,8,.25)}
.s-resolved_won{background:rgba(34,197,94,.12);color:var(--nd-success-text);border:1px solid rgba(34,197,94,.25)}
.s-resolved_lost{background:rgba(239,68,68,.12);color:var(--nd-danger-text);border:1px solid rgba(239,68,68,.25)}
.s-closed,.s-withdrawn{background:var(--nd-bg-surface-2);color:var(--nd-text-faint);border:1px solid var(--nd-border-strong)}
.s-active{background:rgba(34,197,94,.12);color:var(--nd-success-text);border:1px solid rgba(34,197,94,.25)}
.s-inactive,.s-suspended{background:rgba(239,68,68,.12);color:var(--nd-danger-text);border:1px solid rgba(239,68,68,.25)}
.s-pending,.s-overdue{background:rgba(251,191,36,.12);color:var(--nd-warning-text);border:1px solid rgba(251,191,36,.25)}
.s-done{background:rgba(34,197,94,.12);color:var(--nd-success-text);border:1px solid rgba(34,197,94,.25)}

/* ── BUTTONS ── */
.btn{padding:.55rem 1.1rem;border-radius:8px;font-size:.84rem;font-weight:700;border:none;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#0891b2;color:#fff}
.btn-danger{background:rgba(220,38,38,.15);color:var(--nd-danger-text);border:1px solid rgba(220,38,38,.35)}
.btn-warn{background:rgba(217,119,6,.15);color:var(--nd-warning-text);border:1px solid rgba(217,119,6,.35)}
.btn-success{background:rgba(21,128,61,.2);color:var(--nd-success-text);border:1px solid rgba(34,197,94,.3)}
.btn-icon{padding:.35rem .5rem;font-size:.82rem;border-radius:7px;background:var(--nd-bg-surface-2);color:var(--nd-text-secondary);border:1px solid var(--nd-border-strong)}
.btn-icon:hover{background:var(--nd-bg-surface-3);color:var(--nd-text-primary)}

/* ── FILTER BAR ── */
.filter-bar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.1rem;align-items:center}
.filter-bar input,.filter-bar select{background:var(--nd-bg-surface-2);border:1px solid var(--nd-border-strong);border-radius:8px;padding:.45rem .75rem;color:var(--nd-text-primary);font-size:.82rem;outline:none}
.filter-bar input::placeholder{color:var(--nd-text-disabled)}
.filter-bar select option{background:#1e293b;color:#fff}
/* Make ALL native dropdown options dark — fixes white-flash on QT modal etc.
   Browser support note: Firefox + Chromium honor this; Safari may fall back
   to system styling. Acceptable trade-off. */
select{color-scheme:dark}
select option{background-color:var(--nd-bg-base-2);color:var(--nd-text-primary)}
.filter-bar input:focus,.filter-bar select:focus{border-color:#22d3ee}

/* ── DETAIL PANEL (slide-in drawer) ── */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;justify-content:flex-end}
.drawer-bg.open{display:flex}
.drawer{background:#0c1a2e;width:100%;max-width:600px;height:100%;overflow-y:auto;box-shadow:-4px 0 40px rgba(0,0,0,.5);padding:0;display:flex;flex-direction:column}
.drawer-top{padding:1.25rem 1.5rem;border-bottom:1px solid var(--nd-border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.drawer-top h2{font-size:1.05rem;font-weight:800;color:var(--nd-text-primary)}
.drawer-body{flex:1;overflow-y:auto;padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:1.25rem}
.drawer-section{background:var(--nd-bg-surface);border:1px solid var(--nd-border);border-radius:10px;padding:1rem}
.drawer-section h4{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--nd-text-faint);margin-bottom:.75rem}
.kv{display:flex;justify-content:space-between;align-items:flex-start;padding:.3rem 0;border-bottom:1px solid var(--nd-border);font-size:.83rem;gap:.5rem}
.kv:last-child{border-bottom:none}
.kv-label{color:var(--nd-text-faint);flex-shrink:0;min-width:120px}
.kv-val{color:var(--nd-text-primary);text-align:right;word-break:break-word}

/* ── TIMELINE ── */
.tl{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:.65rem;position:relative}
.tl-item:not(:last-child)::before{content:'';position:absolute;left:9px;top:20px;width:2px;bottom:-8px;background:var(--nd-bg-surface-2)}
.tl-dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(34,211,238,.5);background:#0c1a2e;flex-shrink:0;margin-top:.15rem}
.tl-content{flex:1;padding-bottom:.85rem}
.tl-status{font-weight:700;font-size:.82rem;color:var(--nd-cyan-text);text-transform:capitalize}
.tl-meta{font-size:.72rem;color:var(--nd-text-faint);margin-top:.1rem}
.tl-note{font-size:.79rem;color:var(--nd-text-muted);margin-top:.25rem;background:var(--nd-bg-surface);border-radius:5px;padding:.3rem .5rem;border-left:2px solid rgba(34,211,238,.25)}

/* ── NOTES ── */
.note-item{background:var(--nd-bg-surface);border-radius:8px;padding:.75rem;border-left:3px solid rgba(6,182,212,.3);margin-bottom:.5rem}
.note-meta{font-size:.7rem;color:var(--nd-text-faint);margin-bottom:.3rem}
.note-text{font-size:.83rem;color:var(--nd-text-primary)}
.note-input{width:100%;background:var(--nd-bg-surface-2);border:1px solid var(--nd-border-strong);border-radius:8px;padding:.6rem .85rem;color:var(--nd-text-primary);font-size:.84rem;resize:vertical;min-height:64px;outline:none}
.note-input:focus{border-color:#22d3ee}

/* ── FOLLOWUP ── */
.fu-item{display:flex;align-items:center;justify-content:space-between;background:var(--nd-bg-surface);border-radius:8px;padding:.6rem .85rem;margin-bottom:.4rem;gap:.5rem;flex-wrap:wrap}
.fu-due{font-weight:700;font-size:.8rem;color:var(--nd-warning-text);flex-shrink:0}
.fu-due.overdue{color:var(--nd-danger-text)}
.fu-note{font-size:.8rem;color:var(--nd-text-muted);flex:1;min-width:0}
.fu-who{font-size:.72rem;color:var(--nd-text-faint)}

/* ── FORM ── */
.form-field{margin-bottom:.85rem}
.form-field label{display:block;font-size:.75rem;font-weight:700;color:var(--nd-text-faint);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.04em}
.form-input{width:100%;background:var(--nd-bg-surface-2);border:1.5px solid var(--nd-border-strong);border-radius:8px;padding:.6rem .85rem;color:var(--nd-text-primary);font-size:.88rem;outline:none;transition:border .15s}
.form-input:focus{border-color:#22d3ee}
.form-input::placeholder{color:var(--nd-text-disabled)}
select.form-input option{background:#1e293b}
.pwd-row{display:flex;gap:.5rem;align-items:center}
.pwd-row .form-input{flex:1;min-width:0}
.pwd-toggle{padding:.6rem .8rem;border-radius:8px;border:1.5px solid var(--nd-border-strong);background:var(--nd-bg-surface-2);color:var(--nd-text-primary);font-size:.82rem;font-weight:700;white-space:nowrap}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-bg.open{display:flex}
.modal{background:var(--nd-bg-base-2);border:1px solid var(--nd-border-strong);border-radius:16px;padding:1.75rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal.modal-lg{max-width:min(960px,96vw);padding:2rem}
.modal h3{font-size:1rem;font-weight:800;color:var(--nd-text-primary);margin-bottom:1.25rem}
.modal-footer{display:flex;gap:.65rem;justify-content:flex-end;margin-top:1.25rem}

/* ── REVENUE SPLIT ── */
.split-card{background:linear-gradient(135deg,rgba(6,182,212,.08),rgba(14,116,144,.06));border:1px solid rgba(6,182,212,.2);border-radius:12px;padding:1.25rem}
.split-row{display:flex;align-items:center;gap:1rem;margin-bottom:.85rem}
.split-row:last-child{margin-bottom:0}
.split-name{font-weight:800;font-size:.95rem;width:90px;flex-shrink:0}
.split-bar-bg{flex:1;height:10px;background:var(--nd-bg-surface-2);border-radius:5px;overflow:hidden}
.split-bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#0891b2,#22d3ee)}
.split-amount{font-weight:800;font-size:.95rem;color:var(--nd-cyan-text);flex-shrink:0;width:100px;text-align:right}

/* ── HEALTH ── */
.health-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.85rem;margin-bottom:1.25rem}
.health-card{background:var(--nd-bg-surface);border:1px solid var(--nd-border);border-radius:10px;padding:.9rem 1.1rem}
.health-card .hc-val{font-size:1.5rem;font-weight:800;color:var(--nd-cyan-text);line-height:1}
.health-card .hc-label{font-size:.72rem;color:var(--nd-text-faint);margin-top:.25rem}

/* ── LOGIN SCREEN ── */
.login-page{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
.login-card{background:var(--nd-bg-surface);border:1px solid var(--nd-border);border-radius:20px;padding:2.5rem 2.25rem;width:100%;max-width:400px}
.login-logo{display:flex;align-items:center;gap:.65rem;margin-bottom:1.75rem}
.login-logo img{height:40px;border-radius:8px}
.login-logo span{font-weight:800;font-size:1.15rem;color:var(--nd-text-primary)}
.login-card h2{font-size:1.3rem;font-weight:800;color:var(--nd-text-primary);margin-bottom:.35rem}
.login-card p{font-size:.85rem;color:var(--nd-text-faint);margin-bottom:1.5rem}
.msg{font-size:.82rem;padding:.5rem .75rem;border-radius:7px;margin-bottom:.75rem;display:none}
.msg.err{background:rgba(239,68,68,.12);color:var(--nd-danger-text);border:1px solid rgba(239,68,68,.25);display:block}
.msg.ok{background:rgba(34,197,94,.1);color:var(--nd-success-text);border:1px solid rgba(34,197,94,.25);display:block}

/* ── CHART (minimal bar) ── */
.chart-bar-row{display:flex;align-items:center;gap:.65rem;margin-bottom:.5rem;font-size:.8rem}
.chart-bar-label{width:80px;flex-shrink:0;color:var(--nd-text-muted);text-align:right}
.chart-bar-bg{flex:1;height:18px;background:var(--nd-bg-surface-2);border-radius:4px;overflow:hidden}
.chart-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#0e7490,#22d3ee);transition:width .4s}
.chart-bar-val{width:60px;flex-shrink:0;color:var(--nd-cyan-text);font-weight:700;text-align:left}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:3rem 1rem;color:var(--nd-text-disabled)}
.empty .ei{font-size:2.5rem;margin-bottom:.5rem}
.empty p{font-size:.88rem}

/* ── MOBILE ── */
.hamburger-btn{display:none;flex-direction:column;justify-content:center;gap:5px;cursor:pointer;border:none;background:none;padding:.35rem .4rem;border-radius:6px;margin-right:.35rem}
.hamburger-btn span{display:block;width:20px;height:2px;background:#e2e8f0;border-radius:2px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100}
.sidebar-overlay.open{display:block}

@media(max-width:768px){
  .hamburger-btn{display:flex}
  .sidebar{
    position:fixed;top:0;left:-260px;bottom:0;
    width:240px;height:100vh;
    z-index:110;
    transition:left .24s ease;
    overflow-y:auto;
    border-right:1px solid var(--nd-border-strong);
  }
  .sidebar.mobile-open{left:0}
  .main{padding:1rem .85rem}
  .topbar{padding:.6rem .85rem}
  /* Bigger tap targets on touch screens */
  .btn-sm,.nd-btn-sm{padding:.55rem 1rem;font-size:.85rem;min-height:40px}
  .nav-item{padding:.85rem 1rem;min-height:44px}
  /* Force the inline Add Task grid to single column on phones */
  [id^="newTaskForm_"] > div[style*="grid-template-columns:1fr 1fr"]{
    grid-template-columns:1fr !important
  }
  /* Account drawer hero stats become 2-col instead of 4 on narrow screens */
  #acctDrawerBody div[style*="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))"]{
    grid-template-columns:repeat(2,1fr) !important
  }
  /* Overview widget grid stacks below 600 (handled by auto-fit), this nudges
     the threaded-discussion reply input to wrap cleanly */
  [id^="replyBox_"] input{width:100% !important;display:block;margin-bottom:.3rem}
  [id^="replyBox_"] button{display:block;margin-left:0 !important;width:100%}
}
@media(max-width:480px){
  .drawer{max-width:100%}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .modal{padding:1.25rem}
  /* Account drawer fills the screen, no max-width gap */
  #acctDrawer > div{width:100% !important}
  /* Bird's-eye action buttons wrap cleanly */
  #acctDrawerBody > div:first-child > div:first-child{flex-direction:column;align-items:flex-start}
  /* Smaller table padding for cramped widths */
  .table-wrap table th,.table-wrap table td{padding:.45rem .55rem;font-size:.78rem}
}

/* ── Quick Task modal mobile polish ── */
@media(max-width:640px){
  /* Modal fills more of the viewport */
  #quickTaskModalBg > div{padding:1rem !important;max-width:100% !important}
  /* Assignee + due date stack instead of side-by-side */
  #quickTaskModalBg > div > div[style*="grid-template-columns:1fr 1fr"]{
    grid-template-columns:1fr !important
  }
  /* Quick Task button hides label on phones to save space */
  #quickTaskBtn{font-size:.78rem;padding:.45rem .7rem}
  /* Leave modal: dates stack + fills viewport */
  #leaveModalBg > div{padding:1rem !important;max-width:100% !important}
  #leaveModalBg > div > div[style*="grid-template-columns:1fr 1fr"]{
    grid-template-columns:1fr !important
  }
  /* Tasks panel header (title + action buttons) stacks so buttons don't overflow */
  #panel-tasks .section-hdr{flex-direction:column;align-items:flex-start;gap:.6rem}
  #panel-tasks .section-hdr > div:last-child{width:100%;display:flex;flex-wrap:wrap}
  /* Task Registry: comfortable tap targets, no horizontal overflow */
  #tasksRegistry select{flex:1;min-width:140px}
  #tasksRegistry #regSearch{flex:1;min-width:140px}
  #tasksRegistry .nd-card{padding:.85rem}
}

/* ── Mobile topbar: fit any screen, never scroll sideways ────────────────────
   The whole ops console must behave like a native app — every action reachable
   without horizontal scroll on any phone. On small screens we compact the top
   bar to icons + avatar; full labels return on wider screens. */
@media(max-width:640px){
  html,body{overflow-x:hidden;max-width:100%}
  .topbar{gap:.4rem;padding:.55rem .6rem}
  .topbar-right{gap:.35rem;font-size:.8rem;flex-wrap:wrap;justify-content:flex-end}
  /* icon-only action buttons (label spans hide, emoji stays) */
  .topbar-right .bc-label{display:none}
  #quickTaskBtn,#announceBtn,#broadcastBtn{padding:.4rem .55rem}
  /* profile shows just the avatar; name + role live in the profile screen */
  #staffName,#staffRoleBadge{display:none}
  #profileBtn{padding:.22rem}
  /* compact logout so it always stays on-screen */
  .topbar-right .btn-sm{padding:.4rem .6rem;min-height:36px}
}
@media(max-width:460px){
  /* free the last bit of width on the smallest phones */
  .topbar-brand .brand-text{display:none}

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let _token = null, _role = null, _staffId = null, _staffName = null, _staffEmail = null;
const NIDAAN_OWNER_EMAIL = 'dushyant@nidaanpartner.com';
let _currentPanel = 'overview';
let _claimsCache = [];

const API = (path, opts={}) => {
  const headers = {'Content-Type':'application/json'};
  if (_token) headers['Authorization'] = 'Bearer ' + _token;
  return fetch('/nidaan/ops/api' + path, {headers, ...opts});
};

// Generic headers helper used by Phase 3 & Phase 4 loaders (tasks, kanban,
// workflow settings, official numbers). Returns plain object so it composes
// with fetch({ headers: hdrs() }) and {...hdrs(), 'Content-Type': 'application/json'}.
function hdrs() {
  const h = {};
  if (_token) h['Authorization'] = 'Bearer ' + _token;
  return h;
}

// ═══════════════════════════════════════════════════════════════
//  AUTH
// ═══════════════════════════════════════════════════════════════
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pwd   = document.getElementById('loginPwd').value;
  const msg   = document.getElementById('loginMsg');
  msg.className = 'msg'; msg.textContent = '';
  if (!email || !pwd) { msg.className='msg err'; msg.textContent='Enter email and password'; return; }
  const r = await fetch('/nidaan/ops/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email, password: pwd}),
  });
  if (!r.ok) {
    const d = await r.json().catch(()=>({}));
    msg.className='msg err'; msg.textContent = _extractErr(d, 'Login failed'); return;
  }
  const data = await r.json();
  _applyLogin(data);
}

function _applyLogin(data){
  _token = data.token; _role = data.role;
  _staffId = data.staff_id; _staffName = data.name; _staffEmail = data.email || '';
  localStorage.setItem('nidaan_ops_token', _token);
  bootApp();
}

// ── Telegram one-tap login ────────────────────────────────────────────────────
let _tgPoll = null;
async function tgLogin(){
  const box = document.getElementById('tgLoginBox');
  const msg = document.getElementById('loginMsg'); if(msg){ msg.className='msg'; msg.textContent=''; }
  if(_tgPoll){ clearInterval(_tgPoll); _tgPoll=null; }
  box.style.display='block';
  box.innerHTML = 'Starting Telegram login…';
  let start;
  try{
    const r = await fetch('/nidaan/ops/api/tg-login/start', {method:'POST'});
    if(!r.ok){ const d=await r.json().catch(()=>({})); box.innerHTML = '⚠️ '+_extractErr(d,'Telegram login unavailable'); return; }
    start = await r.json();
  }catch(e){ box.innerHTML = '⚠️ Could not reach the server. Check your connection.'; return; }
  // Open the bot so the staffer can approve with one tap.
  try{ window.open(start.deep_link, '_blank'); }catch(e){}
  box.innerHTML = 'Opening Telegram… tap <b>Start</b> / <b>Login</b> in the bot, then come back here.'
    + '<br><a href="'+start.deep_link+'" target="_blank" style="color:var(--nd-cyan-text)">Open @NidaanOpsBot</a>'
    + '<div style="margin-top:.4rem;color:var(--nd-text-muted)">Waiting for confirmation…</div>';
  let waited = 0;
  _tgPoll = setInterval(async ()=>{
    waited += 2;
    if(waited > 300){ clearInterval(_tgPoll); _tgPoll=null; box.innerHTML='⌛ Login timed out. Tap “Login via Telegram” to try again.'; return; }
    try{
      const s = await fetch('/nidaan/ops/api/tg-login/status?nonce='+encodeURIComponent(start.nonce));
      if(!s.ok) return;
      const d = await s.json();
      if(d.status === 'ok'){ clearInterval(_tgPoll); _tgPoll=null; box.innerHTML='✅ Logged in!'; _applyLogin(d); }
    }catch(e){ /* keep polling */ }
  }, 2000);
}

function doLogout() {
  localStorage.removeItem('nidaan_ops_token');
  _token = _role = _staffId = _staffName = _staffEmail = null;
  document.getElementById('loginScreen').style.display = '';
  document.getElementById('appShell').style.display = 'none';
}

// ═══════════════════════════════════════════════════════════════
//  MOBILE NAV
// ═══════════════════════════════════════════════════════════════
function toggleMobileNav() {
  document.getElementById('sidebar').classList.toggle('mobile-open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
function closeMobileNav() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

// ═══════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════
async function bootApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';
  document.getElementById('staffName').textContent = _staffName;
  document.getElementById('staffRoleBadge').textContent = _role.replace(/_/g,' ');
  _loadMyProfile().then(_paintTopAvatar);
  // Quick Task shortcut — SA & sub-SA only
  if (_role === 'super_admin' || _role === 'sub_super_admin') {
    const btn = document.getElementById('quickTaskBtn');
    if (btn) btn.style.display = 'inline-block';
  }
  if (_role === 'super_admin') {
    const ab = document.getElementById('announceBtn');
    if (ab) ab.style.display = 'inline-flex';
  }
  renderImpersonationBanner();
  buildSidebar();
  // Land on Tasks by default; honour a valid #panel from the URL (back/forward,
  // bookmarks) so navigation is restorable.
  const KNOWN_PANELS = ['tasks','overview','support','claims','accounts','branches','staff','leavehistory','settings','numbers','telegram','guide','revenue','plans','content','health'];
  const hashPanel = (location.hash || '').replace('#','');
  const initial = KNOWN_PANELS.includes(hashPanel) ? hashPanel : 'tasks';
  showPanel(initial, true);
  try { history.replaceState({panel: initial}, '', '#' + initial); } catch(e){}
  // Notification bell — load + poll every 45s.
  loadBell();
  if (!_bellPoll) _bellPoll = setInterval(loadBell, 45000);
  // Phase 4: mandatory staff onboarding — save 3 official numbers
  await checkStaffOnboarding();
}

// Browser Back/Forward switches panels in-place instead of leaving the portal.
window.addEventListener('popstate', (e) => {
  if (document.getElementById('appShell').style.display === 'none') return; // not in app
  const id = (e.state && e.state.panel) || (location.hash || '').replace('#','') || 'tasks';
  if (document.getElementById('panel-' + id)) showPanel(id, true);
});

// ── Phase 4: Mandatory staff onboarding modal ───────────────────────────────
async function checkStaffOnboarding() {
  try {
    const [meR, onR] = await Promise.all([
      fetch('/nidaan/ops/api/me', {headers:{'Authorization':'Bearer '+_token}}),
      fetch('/nidaan/ops/api/official-numbers', {headers:{'Authorization':'Bearer '+_token}}),
    ]);
    if (!meR.ok) return;
    const me = await meR.json();
    const on = onR.ok ? await onR.json() : {instances:[]};
    // ONE-TIME comms onboarding. Ops notifications now run on Telegram (official
    // Bot API — no ban risk, nothing to re-pair), so this popup points people there.
    // It is acknowledged ONCE per staffer, server-side, and never shown again.
    if (me.comms_onboarded_at) return;
    showStaffOnboardModal(me.phone || '', !!me.telegram_chat_id);
  } catch(e){}
}
// One-time comms onboarding. Shown ONCE per staffer (acknowledged server-side),
// pointing them at Telegram — the channel ops notifications now run on.
function showStaffOnboardModal(currentPhone, alreadyLinked) {
  let bg = document.getElementById('staffOnboardBg');
  if (bg) bg.remove();
  bg = document.createElement('div');
  bg.id = 'staffOnboardBg';
  bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem';
  bg.innerHTML = `
    <div style="background:var(--nd-bg-base);border:1px solid var(--nd-border-strong);border-radius:14px;max-width:520px;width:100%;padding:1.75rem;max-height:92vh;overflow-y:auto">
      <h2 style="font-size:1.25rem;font-weight:700;margin-bottom:.35rem;color:var(--nd-cyan-text)">✈️ Set up your notifications — one time</h2>
      <p style="font-size:.9rem;color:var(--nd-text-secondary);margin-bottom:1rem">
        NidaanPartner ops notifications (task assigned, mentions, approvals) now run on
        <b>Telegram</b> — it's official, instant and reliable, with nothing to re-pair.
      </p>
      ${alreadyLinked
        ? `<div style="background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);border-radius:10px;padding:.8rem 1rem;margin-bottom:1rem;font-size:.88rem;color:var(--nd-success-text)">✅ Your Telegram is already connected — you're all set.</div>`
        : `<div style="background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.3);border-radius:10px;padding:.85rem 1rem;margin-bottom:1rem">
             <div style="font-size:.86rem;color:var(--nd-text-primary);margin-bottom:.5rem">Connect it in two taps:</div>
             <ol style="font-size:.85rem;line-height:1.8;color:var(--nd-text-secondary);margin:0 0 .7rem 1.05rem">
               <li>Open <b>Telegram Bot</b> in the left menu</li>
               <li>Tap <b>Connect my Telegram</b> → press <b>Start</b></li>
             </ol>
             <button onclick="document.getElementById('staffOnboardBg').remove();showPanel('telegram')"
                     style="width:100%;background:#38bdf8;color:#04121f;padding:.6rem;border:none;border-radius:8px;font-weight:800;font-size:.88rem;cursor:pointer">
               ✈️ Take me there
             </button>
           </div>`}
      <label style="display:block;font-size:.82rem;color:var(--nd-text-secondary);margin-bottom:.35rem">Your mobile number <span style="color:var(--nd-warning-text)">*</span> (for records &amp; urgent contact)</label>
      <input id="staffOnboardPhone" type="tel" placeholder="98xxxxxxxx" value="${currentPhone||''}"
             style="width:100%;padding:.65rem .85rem;background:var(--nd-bg-surface-2);border:1px solid var(--nd-border-strong);border-radius:8px;color:var(--nd-text-primary);font-size:.95rem;margin-bottom:.85rem">
      <button onclick="confirmStaffOnboard()" style="width:100%;background:#22c55e;color:#0a1628;padding:.85rem;border:none;border-radius:8px;font-weight:700;font-size:.95rem;cursor:pointer">
        ✓ Got it — don't show this again
      </button>
      <div style="font-size:.72rem;color:var(--nd-text-faint);text-align:center;margin-top:.5rem">You can always manage this from <b>Telegram Bot</b> in the menu.</div>
    </div>`;
  document.body.appendChild(bg);
}
function copyOpsNum(num) {
  navigator.clipboard.writeText(num).then(() => {
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;top:1.25rem;left:50%;transform:translateX(-50%);z-index:99999;background:#065f46;border:1px solid #10b981;border-radius:8px;padding:.5rem 1rem;color:#d1fae5;font-weight:600;font-size:.85rem';
    t.textContent = '✓ Copied ' + num;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 1500);
  });
}
async function confirmStaffOnboard() {
  const phone = document.getElementById('staffOnboardPhone').value.trim();
  const digits = phone.replace(/\D/g,'').slice(-10);
  if (digits.length !== 10) { alert('Please enter a valid 10-digit Indian mobile number.'); return; }
  try {
    const r = await fetch('/nidaan/ops/api/me/saved-numbers', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer '+_token},
      body: JSON.stringify({ phone })
    });
    if (!r.ok) { alert('Could not save. Try again.'); return; }
    // Permanent, server-side acknowledgement — this popup never appears again for
    // this staffer (on any device).
    try {
      await fetch('/nidaan/ops/api/me/comms-onboarded', { method:'POST', headers: hdrs() });
    } catch(e){}
    const bg = document.getElementById('staffOnboardBg');
    if (bg) bg.remove();
  } catch(e){ alert('Network error. Try again.'); }
}

// ── My Profile (view-only details; edit photo + language only) ───────────────
let _myProfile = null;
function _miniAvatar(url, name){
  return `<span style="display:inline-flex;width:16px;height:16px;border-radius:50%;background:#334155;color:#fff;font-size:.55rem;font-weight:700;align-items:center;justify-content:center;overflow:hidden;vertical-align:-3px;flex-shrink:0">${url?`<img src="${esc(url)}" style="width:100%;height:100%;object-fit:cover" alt="">`:esc(_avatarInitials(name))}</span>`;
}
function _avatarInitials(name){
  return (name||'?').trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase() || '?';
}
function _avatarInner(url, name){
  return url ? `<img src="${esc(url)}" style="width:100%;height:100%;object-fit:cover" alt="">` : esc(_avatarInitials(name));
}
async function _loadMyProfile(force){
  if (_myProfile && !force) return _myProfile;
  try { const r = await fetch('/nidaan/ops/api/me/profile', { headers: hdrs() }); if (r.ok) _myProfile = await r.json(); } catch(e){}
  return _myProfile;
}
function _paintTopAvatar(){
  const el = document.getElementById('profileAvatar');
  if (!el) return;
  const p = _myProfile || {};
  el.innerHTML = _avatarInner(p.profile_pic_url, p.name || _staffName);
}
async function openProfile(){
  const p = await _loadMyProfile(true);
  if (!p) { ndUI.toast('Could not load profile','error'); return; }
  const roleLabel = {super_admin:'Super Admin', sub_super_admin:'Admin', team_member:'Team Member'}[p.role] || p.role;
  const row = (label, val, ok) => `
    <div style="display:flex;justify-content:space-between;gap:.75rem;padding:.5rem 0;border-bottom:1px solid var(--nd-border)">
      <span style="color:var(--nd-text-muted);font-size:.82rem">${label}</span>
      <span style="font-size:.85rem;text-align:right;min-width:0;word-break:break-word">${esc(val||'—')}</span>
    </div>`;
  let bg = document.getElementById('profileBg'); if (bg) bg.remove();
  bg = document.createElement('div'); bg.id='profileBg';
  bg.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);z-index:400;display:flex;align-items:center;justify-content:center;padding:1rem';
  bg.onclick=(e)=>{ if(e.target===bg) bg.remove(); };
  bg.innerHTML = `
    <div style="background:var(--nd-bg-base);border:1px solid var(--nd-border-strong);border-radius:16px;max-width:440px;width:100%;max-height:92vh;overflow-y:auto;padding:1.5rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <h2 style="font-size:1.15rem;font-weight:800">👤 My Profile</h2>

async function uploadProfilePic(){
  const inp = document.getElementById('profilePicInput');
  const f = inp && inp.files && inp.files[0];
  if (!f) return;
  if (f.size > 5*1024*1024) { ndUI.toast('Image must be under 5 MB','error'); return; }
  const fd = new FormData(); fd.append('file', f);
  const r = await fetch('/nidaan/ops/api/me/profile-pic', { method:'POST', headers: hdrs(), body: fd });
  const d = await r.json().catch(()=>({}));
  if (r.ok) {
    ndUI.toast('Photo updated ✓','success');
    if (_myProfile) _myProfile.profile_pic_url = d.profile_pic_url;
    const big = document.getElementById('profileBigAvatar'); if (big) big.innerHTML = _avatarInner(d.profile_pic_url, _myProfile&&_myProfile.name);
    _paintTopAvatar();
    _assigneesCache = null;   // refresh so cards/@mention pick up the new photo
  } else ndUI.toast(_extractErr(d,'Upload failed'),'error');
}
async function setMyLanguage(lang){
  const r = await fetch('/nidaan/ops/api/me/language', { method:'POST', headers:{...hdrs(),'Content-Type':'application/json'}, body: JSON.stringify({lang}) });
  if (r.ok) { ndUI.toast(lang==='hi'?'भाषा हिंदी':'Language: English','success'); if(_myProfile) _myProfile.telegram_lang=lang; openProfile(); }
  else ndUI.toast('Failed','error');
}

async function submitAnnounce(){
  const title=(document.getElementById('annTitle').value||'').trim();
  const message=(document.getElementById('annMsg').value||'').trim();
  const roles=Array.from(document.querySelectorAll('.annRole:checked')).map(c=>c.value);
  if (title.length<2||message.length<2){ ndUI.toast('Add a title and details','error'); return; }
  if (!roles.length){ ndUI.toast('Pick at least one role','error'); return; }
  const allRoles = roles.length===3;
  const r = await fetch('/nidaan/ops/api/announce', { method:'POST', headers:{...hdrs(),'Content-Type':'application/json'},
    body: JSON.stringify({title, message, roles: allRoles?[]:roles}) });
  const d = await r.json().catch(()=>({}));
  if (r.ok){ ndUI.toast('Update sent to '+(d.notified||0)+' staff ✓','success'); document.getElementById('announceBg')?.remove(); }
  else ndUI.toast(_extractErr(d,'Failed'),'error');
}

  items.forEach(item => {

function showPanel(id, fromHistory) {
  _currentPanel = id;
  // Record a history entry so browser Back/Forward moves between panels
  // (instead of dropping out of the portal). Skip when we're responding to a
  // popstate or the initial boot render.
  if (!fromHistory) {
    try { history.pushState({panel: id}, '', '#' + id); } catch(e){}
  }
  closeMobileNav();  // close sidebar on mobile when navigating
  document.querySelectorAll('.panel').forEach(p=>p.style.display='none');
  const el = document.getElementById('panel-'+id);
  if (el) el.style.display = '';
  document.querySelectorAll('.nav-item').forEach(n=>{
    n.classList.toggle('active', n.dataset.panel===id);
  });
  const loaders = {
    overview: loadOverview,
    tasks: loadTasks,
    support: loadSupport,
    claims: loadClaims,
    l2claims: () => loadOutcomeClaims('l2claims', 'can_fight', '⚖️ Level-2 (L2) Claims', 'Reviewed GO — ready for legal action'),
    archived: () => loadOutcomeClaims('archived', 'no_scope', '🗄️ Archived Claims', 'Reviewed — no scope to challenge'),
    accounts: loadAccounts,
    branches: loadBranches,
    mybiz: loadMyBusiness,
    staff: loadStaff,
    settings: loadWorkflowSettings,
    numbers: loadOfficialNumbers,
    telegram: loadTelegramPanel,
    guide: loadGuidePanel,
    analytics: loadAnalytics,
    revenue: loadRevenue,
    plans: loadPlansConfig,
    content: loadContentConfig,
    health: loadHealth,
    leavehistory: loadLeaveHistory,
  };
  if (loaders[id]) loaders[id]();
}

const LEAVE_PILL = {

function _leaveWhen(l){
  const t = (l.start_time||l.end_time) ? ` <span style="color:var(--nd-text-muted)">⏰ ${esc(l.start_time||'')}${l.end_time?('–'+esc(l.end_time)):''}</span>` : '';
  if ((l.leave_type||'full_day')==='half_day'){

    return `${esc(l.start_date)} · <span style="color:var(--nd-warning-text)">½ day (${per})</span>${t}`;
  }
  return ((l.start_date===l.end_date) ? esc(l.start_date) : `${esc(l.start_date)} → ${esc(l.end_date)}`) + t;
}

let _lhState = { from:'', to:'', staff_id:'', status:'', kind:'', rows:[], totals:[] };
function _lhISO(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function _lhSetRange(preset){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth(), dt=now.getDate(), day=now.getDay();
  let from, to;
  if(preset==='thisweek'){ const mon=new Date(now); mon.setDate(dt-(day===0?6:day-1)); from=_lhISO(mon); const sun=new Date(mon); sun.setDate(mon.getDate()+6); to=_lhISO(sun); }
  else if(preset==='thismonth'){ from=_lhISO(new Date(y,m,1)); to=_lhISO(new Date(y,m+1,0)); }
  else if(preset==='lastmonth'){ from=_lhISO(new Date(y,m-1,1)); to=_lhISO(new Date(y,m,0)); }
  else if(preset==='last3'){ from=_lhISO(new Date(y,m-2,1)); to=_lhISO(new Date(y,m+1,0)); }
  else if(preset==='thisyear'){ from=_lhISO(new Date(y,0,1)); to=_lhISO(new Date(y,11,31)); }
  _lhState.from=from; _lhState.to=to;
  const fi=document.getElementById('lhFrom'), ti=document.getElementById('lhTo');
  if(fi)fi.value=from; if(ti)ti.value=to;
  const st=document.getElementById('lhStaff'); if(st)_lhState.staff_id=st.value;
  const kd=document.getElementById('lhKind'); if(kd)_lhState.kind=kd.value;
  const ss=document.getElementById('lhStatus'); if(ss)_lhState.status=ss.value;
  _lhFetch();
}

  _lhState.staff_id=document.getElementById('lhStaff').value;

async function _lhFetch(){

function _lhDownloadCSV(){
  const rows=_lhState.rows||[];
  if(!rows.length){ ndUI.toast('Nothing to export for this filter','error'); return; }
  const hdr=['Staff','Role','Type','Full/Half','Half period','Start date','End date','Days','Status','Reason','Applied on','Approved by','Decided on','Decision note'];
  const q=(v)=>{ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const lines=[hdr.join(',')];
  rows.forEach(r=>lines.push([
    r.staff_name, (r.staff_role||'').replace(/_/g,' '), (r.request_kind==='wfh'?'WFH':'Leave'),
    (r.leave_type==='half_day'?'Half':'Full'), r.half_period||'', r.start_date, r.end_date, r.days,
    r.status, r.reason||'', r.created_at?String(r.created_at).slice(0,16):'', r.decided_by_name||'',
    r.decided_at?String(r.decided_at).slice(0,16):'', r.decision_note||''
  ].map(q).join(',')));
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='leave-history_'+(_lhState.from||'all')+'_to_'+(_lhState.to||'all')+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function submitLeave(){
  const leave_type = document.querySelector('input[name=lvType]:checked')?.value || 'full_day';
  const start_date = document.getElementById('lvStart').value;
  let end_date = document.getElementById('lvEnd').value;
  const half_period = leave_type==='half_day' ? document.getElementById('lvHalf').value : '';
  if (leave_type==='half_day') end_date = start_date;
  const reason = (document.getElementById('lvReason').value||'').trim();
  const handover_notes = (document.getElementById('lvHandover').value||'').trim();
  const cover_staff_id = document.getElementById('lvCover').value ? parseInt(document.getElementById('lvCover').value) : null;
  if (!start_date || !end_date) { ndUI.toast('Pick a date','error'); return; }
  if (end_date < start_date) { ndUI.toast('End date is before start date','error'); return; }
  const kind = (window._lvKind === 'wfh') ? 'wfh' : 'leave';
  const body = {start_date, end_date, reason, leave_type, half_period, handover_notes,
    request_kind: kind,
    start_time: (document.getElementById('lvStartTime').value||''),
    end_time: (document.getElementById('lvEndTime').value||'')};
  if (cover_staff_id) body.cover_staff_id = cover_staff_id;
  const r = await fetch('/nidaan/ops/api/leave', {
    method:'POST', headers:{...hdrs(),'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if (r.ok) {
    ndUI.toast((kind==='wfh'?'WFH request sent':'Leave request sent')+' — admins notified','success');
    document.getElementById('leaveModalBg')?.remove();
    if (_currentPanel === 'tasks') loadLeaveSection();
  } else { const d=await r.json().catch(()=>({})); ndUI.toast(_extractErr(d,'Request failed'),'error'); }
}

async function leaveDecide(leaveId, decision){
  const note = decision==='rejected' ? (prompt('Reason for rejection (optional):')||'') : '';
  const r = await fetch('/nidaan/ops/api/leave/'+leaveId+'/decision', {
    method:'POST', headers:{...hdrs(),'Content-Type':'application/json'},
    body: JSON.stringify({decision, note})
  });
  if (r.ok) { ndUI.toast(decision==='approved'?'Approved ✓':'Rejected','success'); loadLeaveSection(); }
  else { const d=await r.json().catch(()=>({})); ndUI.toast(_extractErr(d,'Action failed'),'error'); }
}

async function leaveCancel(leaveId){
  if (!confirm('Withdraw this leave request?')) return;
  const r = await fetch('/nidaan/ops/api/leave/'+leaveId+'/cancel', { method:'POST', headers: hdrs() });
  if (r.ok) { ndUI.toast('Withdrawn','success'); loadLeaveSection(); }
  else ndUI.toast('Failed','error');
}

  const t = d.totals || {};

  const kpi = (label, val, sub) => `

    ? `<div style="display:flex;gap:2px;align-items:flex-end;height:36px;margin-top:.2rem">

      <span>${esc(a.name||'—')}</span>
      <span>${a.closed} closed${a.won?` <span style="color:var(--nd-success-text)">(${a.won}W)</span>`:''}</span>
    </div>`).join('') || '<div style="font-size:.78rem;color:var(--nd-text-faint)">No closures in window</div>';

  el.innerHTML = `
    <div class="nd-card" style="padding:1rem">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.85rem">

async function qtSearchClaims(q){
  const box = document.getElementById('qtClaimResults');
  if (!box) return;
  // If a claim is already picked, ignore re-fires.
  if (document.getElementById('qtClaimId').value) return;
  q = (q||'').trim();
  const r = await fetch('/nidaan/ops/api/claim-search?q=' + encodeURIComponent(q), { headers: hdrs() });
  if (!r.ok) { box.style.display='none'; return; }
  const d = await r.json();
  if (!d.claims || !d.claims.length) {
    box.innerHTML = '<div style="padding:.55rem;color:var(--nd-text-faint);font-size:.82rem">No matches</div>';
    box.style.display = 'block';
    return;
  }
  // Build rows with data attributes — NO inline onclick. We attach handlers
  // post-render via addEventListener("mousedown") with preventDefault so:
  //  1. there's no race with the input's onblur (mousedown fires first), AND
  //  2. any quote/escape edge case in names can't break event binding.
  const heading = q ? '' :
    '<div style="padding:.4rem .65rem;font-size:.7rem;color:var(--nd-text-faint);background:var(--nd-bg-surface);text-transform:uppercase;letter-spacing:.04em">recent open claims</div>';
  box.innerHTML = heading + d.claims.map(c => {
    const acct = c.account_name || c.firm_name || '';
    return `
      <div class="qt-claim-row"
           data-cid="${c.claim_id}"
           data-cname="${esc(c.insured_name || '')}"
           style="padding:.55rem .7rem;border-bottom:1px solid var(--nd-border);cursor:pointer;font-size:.83rem">
        <div style="display:flex;justify-content:space-between;gap:.5rem;align-items:baseline">
          <b style="color:var(--nd-cyan-text)">#${fmtClaimNum(c.claim_id)}</b>
          <span style="font-size:.7rem;color:var(--nd-text-faint)">${esc(c.status||'').replace(/_/g,' ')}</span>
        </div>
        <div style="font-size:.82rem;margin-top:.15rem">${esc(c.insured_name||'—')}${c.insurer_name?` <span style="color:var(--nd-text-faint);font-size:.74rem">· ${esc(c.insurer_name)}</span>`:''}</div>
        ${acct ? `<div style="font-size:.72rem;color:var(--nd-text-muted);margin-top:.1rem">🏢 ${esc(acct)}</div>`:''}
      </div>`;
  }).join('');
  box.querySelectorAll('.qt-claim-row').forEach(row => {
    const cid = parseInt(row.dataset.cid, 10);
    const cname = row.dataset.cname || '';
    const pick = (e) => {
      if (e) e.preventDefault();  // keep the input from blurring on mousedown
      qtPickClaim(cid, cname);
    };
    row.addEventListener('mousedown', pick);
    row.addEventListener('touchstart', pick, {passive:false});
    row.addEventListener('mouseenter', () => row.style.background = 'rgba(34,211,238,.08)');
    row.addEventListener('mouseleave', () => row.style.background = 'transparent');
  });
  box.style.display = 'block';
}

function qtPickClaim(claimId, name){
  const hidden = document.getElementById('qtClaimId');
  const results = document.getElementById('qtClaimResults');
  const input   = document.getElementById('qtClaimSearch');
  const chip    = document.getElementById('qtClaimChip');
  const chipLabel = document.getElementById('qtClaimChipLabel');
  const label = `🔗 Linked: #${fmtClaimNum(claimId)} — ${name}`;
  if (hidden)  hidden.value = String(claimId);
  if (results) results.style.display = 'none';
  // Prefer the chip swap when available.
  if (chip && chipLabel && input) {
    chipLabel.textContent = label;
    chip.style.display = 'flex';
    input.value = '';
    input.style.display = 'none';
  } else if (input) {
    // Fallback: stuff the visible selection into the input itself with a
    // strong green outline so the user can't miss it.
    input.value = label;
    input.style.borderColor = '#22c55e';
    input.style.background = 'rgba(34,197,94,.14)';
    input.style.color = '#86efac';
    input.style.fontWeight = '700';
  }
  const oldLabel = document.getElementById('qtClaimPicked');
  if (oldLabel) oldLabel.innerHTML = '';
}

function qtUnpickClaim(){
  document.getElementById('qtClaimId').value = '';
  const input = document.getElementById('qtClaimSearch');
  const chip = document.getElementById('qtClaimChip');
  if (chip) chip.style.display = 'none';
  input.value = '';
  input.style.display = '';   // restore default
  input.focus();
}

// Focus handler that skips searching when a claim is already picked
// (the input contains the picked label, searching that string would be junk).
function qtOnFocusSearch(input){
  const picked = document.getElementById('qtClaimId').value;
  if (picked) return;  // keep displayed selection, don't show dropdown
  qtSearchClaims(input.value || '');
}

async function submitQuickTask(){
  const title = (document.getElementById('qtTitle')?.value || '').trim();
  if (!title || title.length < 2) { ndUI.toast('Title is required','error'); return; }
  const assigneeVal = document.getElementById('qtAssignee').value;
  const priority = (document.querySelector('input[name=qtPriority]:checked') || {}).value || 'normal';
  const claimVal = document.getElementById('qtClaimId').value;
  const dueDate = document.getElementById('qtDueDate').value || null;
  const comment = (document.getElementById('qtComment')?.value || '').trim();
  const category = document.getElementById('qtCategory')?.value || '';
  const requiresApproval = !!(document.getElementById('qtRequiresApproval') || {}).checked;
  const approverVal = (document.getElementById('qtApprover') || {}).value || '';
  const involveIds = Object.keys(window._qtInvolveIds||{}).map(Number).filter(Boolean);
  const fileInput = document.getElementById('qtCreateFile');
  const pickedFiles = (fileInput && fileInput.files) ? Array.from(fileInput.files) : [];
  const taskType = window._qtRequestMode ? 'request' : 'assignment';
  const body = { title, priority, requires_approval: requiresApproval, task_type: taskType };
  if (assigneeVal) body.assigned_to_staff_id = parseInt(assigneeVal);
  if (claimVal) body.claim_id = parseInt(claimVal);
  if (dueDate) body.due_date = dueDate;
  if (category) body.category_code = category;
  // Complainant details are mandatory for categories flagged as needing them.
  const _cw = document.getElementById('qtComplainantWrap');
  if (_cw && _cw.style.display === 'block') {
    const cn = (document.getElementById('qtComplainantName').value||'').trim();
    const cp = (document.getElementById('qtComplainantPhone').value||'').trim();
    if (!cn || !cp) { ndUI.toast('Complainant name and mobile number are required for this category','error'); return; }
    if (cp.replace(/\D/g,'').length < 10) { ndUI.toast('Enter a valid complainant mobile number','error'); return; }
    body.complainant_name = cn;
    body.complainant_phone = cp;
  }
  if (requiresApproval && approverVal) body.approver_staff_id = parseInt(approverVal);
  if (involveIds.length) body.mention_ids = involveIds;
  // When files are attached, the comment rides along with them on the first note
  // (multipart) after create; otherwise send it inline in the create body.
  if (comment && !pickedFiles.length) body.initial_comment = comment;
  const r = await fetch('/nidaan/ops/api/quick-tasks', {
    method:'POST', headers:{...hdrs(),'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  if (r.ok) {
    const dd = await r.json().catch(()=>({}));
    const newQid = dd.quick_task_id;
    // Upload the attachment(s) (with the comment) as the first note.
    if (pickedFiles.length && newQid) {
      try {
        const fd = new FormData();
        fd.append('note', comment || '');
        pickedFiles.forEach(f => fd.append('files', f));
        await fetch('/nidaan/ops/api/quick-tasks/'+newQid+'/notes', { method:'POST', headers: hdrs(), body: fd });
      } catch(e){ ndUI.toast('Task created, but the file upload failed — re-attach from the task.','error'); }
    }
    ndUI.toast(dd.task_type==='request' ? 'Request sent to admins ✓' : 'Quick task created ✓','success');
    document.getElementById('quickTaskModalBg').remove();
    if (_currentPanel === 'tasks') loadTasks();
    else if (_currentPanel === 'overview') loadOverview();
  } else {
    const e = await r.json().catch(()=>({detail:'Error'}));
    ndUI.toast(_extractErr(e, 'Create failed'),'error');
  }
}

// Reveal the mandatory complainant fields when the chosen category demands them.
function _qtCategoryChanged(){
  const sel = document.getElementById('qtCategory');
  const wrap = document.getElementById('qtComplainantWrap');
  if (!sel || !wrap) return;
  const opt = sel.options[sel.selectedIndex];
  wrap.style.display = (opt && opt.dataset.rc === '1') ? 'block' : 'none';
}

// ── "Involve others" tagging on the create form (chips, not a flaky multi-select) ──
let _qtInvolveMatches = [];
function _qtInvolveInput(el){
  const box = document.getElementById('qtInvolveBox');
  if (!box) return;
  const q = (el.value||'').trim().toLowerCase();
  if (!q) { box.style.display='none'; return; }
  _qtInvolveMatches = (_assigneesCache||[])
    .filter(s => s.staff_id !== _staffId && !(window._qtInvolveIds||{})[s.staff_id] && (s.name||'').toLowerCase().includes(q))
    .slice(0, 6);
  if (!_qtInvolveMatches.length) { box.style.display='none'; return; }
  box.innerHTML = _qtInvolveMatches.map((s,i)=>
    `<div onmousedown="event.preventDefault();_qtInvolvePick(${i})" style="padding:.45rem .6rem;cursor:pointer;font-size:.85rem;display:flex;align-items:center;gap:.45rem;border-bottom:1px solid var(--nd-border)" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="this.style.background='transparent'">${_miniAvatar(s.avatar_url, s.name)} ${esc(s.name)}</div>`).join('');
  box.style.display='block';
}
function _qtInvolvePick(i){
  const s = _qtInvolveMatches[i]; if (!s) return;
  window._qtInvolveIds = window._qtInvolveIds || {};
  window._qtInvolveIds[s.staff_id] = s.name;
  const inp = document.getElementById('qtInvolveInput'); if (inp) inp.value='';
  document.getElementById('qtInvolveBox').style.display='none';
  _renderInvolveChips();
}
function _qtInvolveRemove(id){ if(window._qtInvolveIds) delete window._qtInvolveIds[id]; _renderInvolveChips(); }
function _renderInvolveChips(){
  const box = document.getElementById('qtInvolveChips'); if (!box) return;
  const ids = Object.keys(window._qtInvolveIds||{});

}

function _qtCreateFilePicked(){
  const f = document.getElementById('qtCreateFile');

// ── Widget: My Quick Tasks ───────────────────────────────────────────────────
// Personalised task view — replaces the single "My Open Quick Tasks" list with the
// three slices every staffer actually needs: what's on MY plate, what I handed to
// others, and what I've been pulled into.
async function loadMyQuickTasksWidget(){
  const el = document.getElementById('overviewMyQuickTasks');
  if (!el) return;
  el.innerHTML = '<div class="nd-card" style="padding:1rem;color:var(--nd-text-faint);font-size:.85rem">Loading your tasks…</div>';
  const get = async (scope) => {
    try {
      const r = await fetch('/nidaan/ops/api/quick-tasks?scope='+scope+'&limit=50', { headers: hdrs() });
      if (!r.ok) return [];
      return (await r.json()).quick_tasks || [];
    } catch(e){ return []; }
  };
  const [mine, byMe, involved] = await Promise.all([
    get('assigned_to_me'), get('created_by_me'), get('involved')
  ]);
  try { await _loadTaskCategoriesOnce(); } catch(e){}

  const section = (id, icon, title, subtitle, items, emptyMsg, color) => {
    const open = items.filter(t => t.status!=='done' && t.status!=='cancelled');
    return `
      <div class="nd-card" id="qtsec-${id}" style="padding:1rem;margin-bottom:.85rem">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem">
          <div>
            <span style="font-weight:700;font-size:.98rem">${icon} ${title}</span>
            <span style="font-size:.74rem;color:var(--nd-text-faint);margin-left:.4rem">${subtitle}</span>
          </div>
          <span style="font-size:.75rem;font-weight:800;color:${color};background:${color}1f;border:1px solid ${color}44;padding:.1rem .5rem;border-radius:999px">${open.length} open</span>
        </div>
        ${open.length ? open.map(t=>_qtRow(t,true)).join('')
          : `<div style="padding:.9rem;text-align:center;color:var(--nd-text-faint);font-size:.84rem">${emptyMsg}</div>`}
      </div>`;
  };

  // Compact "My Focus" band — at-a-glance, what needs YOU, no scrolling. Computed from the
  // already-fetched lists (no extra API calls).
  const _today = new Date().toISOString().slice(0,10);
  const _dd = t => (t.due_date ? String(t.due_date).slice(0,10) : '');
  const _openMine = mine.filter(t => t.status!=='done' && t.status!=='cancelled');
  const _overdue = _openMine.filter(t => _dd(t) && _dd(t) < _today).length;
  const _dueToday = _openMine.filter(t => _dd(t) === _today).length;
  const _involvedOpen = involved.filter(t => t.status!=='done' && t.status!=='cancelled').length;
  // ── Deterministic "smart" summary — always computed from the already-fetched tasks (reliable,
  // instant, never lost). Any future AI phrasing must be ADDITIVE on top of this, not replace it. ──
  const _prio = {urgent:3, high:2, normal:1, low:0};
  const _rank = t => { const dd=_dd(t); let s=0; if(dd && dd<_today) s+=1000; else if(dd===_today) s+=500; s+=(_prio[(t.priority||'normal').toLowerCase()]||1)*10; return s; };
  const _topTask = _openMine.slice().sort((a,b)=> _rank(b)-_rank(a) || String(a.due_date||'9999').localeCompare(String(b.due_date||'9999')))[0];
  const _sumParts = [];
  if (_overdue) _sumParts.push(`<b style="color:var(--nd-danger-text)">${_overdue} overdue</b>`);
  if (_dueToday) _sumParts.push(`<b style="color:var(--nd-warning-text)">${_dueToday} due today</b>`);
  const _summary = _openMine.length
    ? (_sumParts.length ? `${_sumParts.join(' · ')} — ${_openMine.length} on you`
                        : `${_openMine.length} task${_openMine.length>1?'s':''} on you · nothing overdue ✓`)
    : 'Nothing on your plate right now ✓';
  const _startBtn = _topTask
    ? `<button onclick="openQuickTaskDrawer(${_topTask.quick_task_id})" title="Open your most urgent task" style="background:rgba(34,211,238,.18);border:1px solid rgba(34,211,238,.35);color:var(--nd-cyan-text);padding:.35rem .7rem;border-radius:8px;font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap">▶ Start #${_topTask.quick_task_id}${(_dd(_topTask)&&_dd(_topTask)<_today)?' · overdue':(_dd(_topTask)===_today?' · today':'')}</button>`
    : '';
  const fcard = (label, val, color, onclick) => `
    <div ${onclick?`onclick="${onclick}" title="Tap to see these"`:''} style="background:${color}14;border:1px solid ${color}3a;border-radius:10px;padding:.55rem .4rem;text-align:center;${onclick?'cursor:pointer':''}">
      <div style="font-size:1.5rem;font-weight:800;color:${color};line-height:1">${val}</div>
      <div style="font-size:.66rem;color:var(--nd-text-secondary);margin-top:.2rem">${label}</div>
    </div>`;
  const focusBand = `
    <div class="nd-card" style="padding:.85rem 1rem;margin-bottom:.85rem;border-color:rgba(34,211,238,.28)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem">
        <div style="font-weight:800;font-size:1rem">🎯 My Focus</div>
        ${_startBtn}
      </div>
      <div style="font-size:.85rem;color:var(--nd-text-primary);margin-bottom:.6rem">${_summary}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:.5rem">
        ${fcard('Pending on me', _openMine.length, '#22d3ee', "myFocus('active')")}
        ${fcard('Overdue', _overdue, '#f87171', _overdue?"myFocus('overdue')":'')}
        ${fcard('Due today', _dueToday, '#fbbf24', _dueToday?"myFocus('active')":'')}
        ${fcard('Involved', _involvedOpen, '#a78bfa', _involvedOpen?"myFocusScroll('qtsec-s3')":'')}
      </div>
      <div style="font-size:.66rem;color:var(--nd-text-faint);margin-top:.4rem">tap a number to filter</div>
    </div>`;

  el.innerHTML = focusBand +
    section('s1','📥','Pending with me','assigned to you', mine,'Nothing on your plate ✓','#22d3ee') +
    section('s2','📤','Assigned by me','you created / handed over', byMe,'You haven\'t assigned anything yet','#a78bfa') +
    section('s3','🏷️','I\'m involved','tagged into by teammates', involved,'You haven\'t been tagged into any task','#fbbf24');
}

// Legacy alias — the team widget is superseded by the full Task Registry.
async function loadTeamQuickTasksWidget(){ /* replaced by loadTaskRegistry */ }

// ════════════════════════════════════════════════════════════════════════════
//  TASK REGISTRY — the complete, filterable record of EVERY task, regardless
//  of status (open / in progress / done / cancelled), with admin delete and an
//  audit view of soft-deleted rows. This is the durable history surface.
// ════════════════════════════════════════════════════════════════════════════
// Defaults to ACTIVE work — completed/cancelled tasks live in the Archived view so
// the working board stays short instead of growing forever.
let _registryState = {status:'active', type:'', category:'', assignee:'', q:'', sort:'smart', includeDeleted:false};
let _registrySearchTimer = null;

async function loadTaskRegistry(){
  const box = document.getElementById('tasksRegistry');
  if (!box) return;
  const isAdmin = (_role==='super_admin' || _role==='sub_super_admin');

  // preserve search focus/caret across re-render
  const hadFocus = document.activeElement && document.activeElement.id==='regSearch';
  const caret = hadFocus ? document.activeElement.selectionStart : null;

  const p = new URLSearchParams();
  p.set('with_counts','true'); p.set('limit','200');
  const _st = _registryState.status;
  if (_st==='active') { p.set('include_done','false'); }
  else if (_st==='overdue') { p.set('include_done','true'); p.set('overdue','true'); }
  else if (_st==='pending_approval') { p.set('include_done','true'); p.set('pending_approval','true'); }
  else { p.set('include_done','true');
         if (_st && _st!=='all') p.set('status', _st); }
  if (_registryState.type) p.set('task_type', _registryState.type);
  if (_registryState.category) p.set('category', _registryState.category);
  if (_registryState.assignee) p.set('assignee', _registryState.assignee);
  if (_registryState.sort && _registryState.sort !== 'smart') p.set('sort', _registryState.sort);
  if (_registryState.q) p.set('q', _registryState.q);
  if (_registryState.includeDeleted && isAdmin) p.set('include_deleted','true');

  let assignees = [];
  if (isAdmin) { try { assignees = await _loadAssigneesOnce(); } catch(e){} }
  let categories = [];
  try { categories = await _loadTaskCategoriesOnce(); } catch(e){}

  const r = await fetch('/nidaan/ops/api/quick-tasks?'+p.toString(), { headers: hdrs() });
  if (!r.ok) { box.innerHTML = `<div class="nd-card" style="padding:1rem;color:var(--nd-danger-text)">Failed to load registry (${r.status})</div>`; return; }
  const d = await r.json();
  const items = d.quick_tasks || [];
  const counts = d.counts || {};
  const REG_CAP = 8;   // keep the board short — show the top few (smart-sorted), rest behind "Show all"

  const chip = (key,label) => {
    const active = _registryState.status===key;
    const n = key==='all'?counts.all : key==='active'?counts.active : counts[key];
    return `<button onclick="setRegistryStatus('${key}')" style="background:${active?'#22d3ee':'rgba(255,255,255,.05)'};color:${active?'#0a1628':'rgba(255,255,255,.75)'};border:1px solid ${active?'#22d3ee':'rgba(255,255,255,.12)'};font-weight:${active?'700':'500'};padding:.3rem .6rem;border-radius:999px;font-size:.78rem;cursor:pointer">${label}${(n!=null)?` ${n}`:''}</button>`;
  };
  const selStyle = 'background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#fff;padding:.32rem .5rem;border-radius:6px;font-size:.8rem';

  box.innerHTML = `
    <div class="nd-card" style="padding:1rem">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem">
        <div style="font-weight:700;font-size:1rem">${_registryState.status==='archived'?'🗄️ Archived Tasks':'📋 All Tasks'}
          <span style="color:var(--nd-text-faint);font-weight:500;font-size:.82rem">— ${_registryState.status==='archived'
            ? (isAdmin?'completed &amp; cancelled (everyone)':'your completed &amp; cancelled tasks')
            : (isAdmin?'complete record':'tasks you\'re involved in')}</span></div>
        <input id="regSearch" value="${esc(_registryState.q)}" placeholder="🔍 search title or #id…"
               oninput="onRegistrySearch(this.value)"
               style="background:var(--nd-bg-surface);border:1px solid var(--nd-border-strong);color:var(--nd-text-primary);padding:.35rem .6rem;border-radius:6px;font-size:.82rem;min-width:150px">
      </div>
      <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem">
        ${chip('active','Active')}${chip('open','Open')}${chip('in_progress','In progress')}${chip('overdue','⏰ Overdue')}${chip('pending_approval','⏳ Pending approval')}${chip('archived','🗄️ Archived')}${chip('all','All')}
      </div>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.85rem;align-items:center">
        <select onchange="setRegistryType(this.value)" style="${selStyle}">
          <option value="" ${!_registryState.type?'selected':''}>All types</option>
          <option value="assignment" ${_registryState.type==='assignment'?'selected':''}>Assignments</option>
          <option value="request" ${_registryState.type==='request'?'selected':''}>Requests</option>
        </select>
        ${categories.length ? `<select onchange="setRegistryCategory(this.value)" style="${selStyle}">
          <option value="" ${!_registryState.category?'selected':''}>All categories</option>
          ${categories.map(c=>`<option value="${esc(c.code)}" ${_registryState.category===c.code?'selected':''}>${esc(c.label)} (${esc(c.code)})</option>`).join('')}
        </select>` : ''}
        <select onchange="setRegistrySort(this.value)" style="${selStyle}" title="Sort tasks">
          ${[['smart','⭐ Smart (active first)'],['updated','🕒 Recently updated'],['created_desc','🆕 Newest created'],['created_asc','📜 Oldest created'],['id_desc','#️⃣ Task # (high→low)'],['id_asc','#️⃣ Task # (low→high)'],['due','📅 Due date'],['priority','🔺 Priority']]
            .map(([v,l])=>`<option value="${v}" ${_registryState.sort===v?'selected':''}>${l}</option>`).join('')}
        </select>
        ${isAdmin ? `<select onchange="setRegistryAssignee(this.value)" style="${selStyle}">
          <option value="">All assignees</option>
          <option value="me" ${_registryState.assignee==='me'?'selected':''}>Me</option>
          ${assignees.map(a=>`<option value="${a.staff_id}" ${_registryState.assignee===String(a.staff_id)?'selected':''}>${esc(a.name)}</option>`).join('')}
        </select>` : ''}
        ${isAdmin ? `<label style="font-size:.78rem;color:var(--nd-text-secondary);display:flex;align-items:center;gap:.3rem;cursor:pointer">
          <input type="checkbox" ${_registryState.includeDeleted?'checked':''} onchange="setRegistryDeleted(this.checked)" style="accent-color:var(--nd-danger-text)"> show deleted</label>` : ''}
      </div>
      <div style="border-top:1px solid var(--nd-border)">
        ${items.length ? (items.slice(0, REG_CAP).map(qt=>_qtRegistryRow(qt,isAdmin)).join('') +
            (items.length > REG_CAP
              ? `<div id="regRest" style="display:none">${items.slice(REG_CAP).map(qt=>_qtRegistryRow(qt,isAdmin)).join('')}</div>`
                + `<button id="regMoreBtn" onclick="toggleRegistryMore(${items.length})" style="width:100%;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);color:var(--nd-cyan-text);padding:.5rem;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;margin-top:.5rem">Show all ${items.length} tasks ▾</button>`
              : '')) :
          '<div style="padding:1.5rem;text-align:center;color:var(--nd-text-faint);font-size:.85rem">No tasks match these filters.</div>'}
      </div>
      <div style="font-size:.72rem;color:var(--nd-text-faint);margin-top:.6rem">Showing ${Math.min(items.length, REG_CAP)} of ${items.length}${items.length>=200?'+ — refine filters to narrow':''}</div>
    </div>`;

  if (hadFocus) { const s=document.getElementById('regSearch'); if(s){ s.focus(); try{ const c=(caret==null?s.value.length:caret); s.setSelectionRange(c,c); }catch(e){} } }
}

function toggleRegistryMore(total){
  const r = document.getElementById('regRest'), b = document.getElementById('regMoreBtn');
  if (!r || !b) return;
  const show = (r.style.display === 'none');
  r.style.display = show ? '' : 'none';
  b.textContent = show ? 'Show less ▲' : ('Show all ' + total + ' tasks ▾');
}
function _qtRegistryRow(qt, isAdmin){
  const prio = QT_PRIORITY_PILLS[qt.priority] || QT_PRIORITY_PILLS.normal;
  const st = QT_STATUS_PILLS[qt.status] || QT_STATUS_PILLS.open;
  const deleted = !!qt.deleted_at;
  const finished = (qt.status==='done' || qt.status==='cancelled');
  const typePill = qt.task_type==='request' ? `<span style="font-size:.68rem;background:#a78bfa22;color:#a78bfa;border:1px solid #a78bfa44;padding:.03rem .3rem;border-radius:4px">🙋 Request</span>` : '';
  let apprPill = '';
  if (qt.requires_approval){ const m={pending:['#fbbf24','⏳'],approved:['#22c55e','✅'],rejected:['#f87171','🚫']}[qt.approval_status||'pending']; if(m) apprPill=`<span style="font-size:.68rem;background:${m[0]}22;color:${m[0]};border:1px solid ${m[0]}44;padding:.03rem .3rem;border-radius:4px">${m[1]}</span>`; }
  return `
    <div onclick="openQuickTaskDrawer(${qt.quick_task_id})"
         style="padding:.6rem .25rem;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;display:flex;gap:.6rem;align-items:flex-start;${deleted?'opacity:.45':''}${qt.assignee_on_leave>0?'background:rgba(251,146,60,.06);':''}">
      <div style="width:3px;align-self:stretch;background:${qt.assignee_on_leave>0?'#fb923c':prio.color};border-radius:2px;flex-shrink:0;min-height:34px"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:.88rem;font-weight:600;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap">${_taskDot(qt)}<span style="background:rgba(34,211,238,.16);color:var(--nd-cyan-text);font-family:monospace;font-weight:800;font-size:.9rem;padding:.1rem .45rem;border-radius:6px;flex-shrink:0">#${qt.quick_task_id}</span>${qt.category_code?_taskCatBadge(qt.category_code):''}<span style="${finished?'text-decoration:line-through;color:var(--nd-text-faint)':''}">${esc(qt.title||'')}</span></div>
        <div style="font-size:.74rem;color:var(--nd-text-muted);margin-top:.15rem;display:flex;gap:.45rem;flex-wrap:wrap;align-items:center">
          <span style="color:${st.color}">● ${st.label}</span>
          ${typePill}${apprPill}
          ${qt.assignee_name?`<span title="Assigned to" style="display:inline-flex;align-items:center;gap:.25rem">${_miniAvatar(qt.assignee_avatar, qt.assignee_name)} ${esc(qt.assignee_name)}</span>`:'<span style="color:var(--nd-text-faint)">unassigned</span>'}
          ${qt.assignee_on_leave>0?`<span style="color:#fb923c;font-weight:700;background:rgba(251,146,60,.14);padding:.03rem .35rem;border-radius:4px" title="Assignee is on leave — consider reassigning">🌴 on leave</span>`:''}
          ${qt.creator_name?`<span style="color:var(--nd-text-faint)" title="Created by">✍️ ${esc(qt.creator_name)}</span>`:''}
          ${qt.due_date?`<span>📅 ${esc(qt.due_date)}</span>`:''}
          ${qt.claim_id?`<span>🔗 #${fmtClaimNum(qt.claim_id)}</span>`:''}
          <span style="color:var(--nd-text-faint)">${qt.created_at?ndUI.timeAgo(qt.created_at):''}</span>
          ${deleted?'<span style="color:var(--nd-danger-text)">· deleted</span>':''}
        </div>
      </div>
      ${(isAdmin && !deleted) ? `<button onclick="event.stopPropagation();qtDeleteRow(${qt.quick_task_id})" title="Delete task"
          style="background:transparent;border:none;color:rgba(248,113,113,.7);cursor:pointer;font-size:.95rem;flex-shrink:0;padding:.1rem .3rem">🗑</button>` : ''}
    </div>`;
}

function setRegistryStatus(s){ _registryState.status=s; loadTaskRegistry(); }
function setRegistryType(t){ _registryState.type=t; loadTaskRegistry(); }
function setRegistryCategory(c){ _registryState.category=c; loadTaskRegistry(); }
function setRegistrySort(s){ _registryState.sort=s; loadTaskRegistry(); }
function setRegistryAssignee(a){ _registryState.assignee=a; loadTaskRegistry(); }
function setRegistryDeleted(v){ _registryState.includeDeleted=v; loadTaskRegistry(); }
function onRegistrySearch(v){ _registryState.q=v; clearTimeout(_registrySearchTimer); _registrySearchTimer=setTimeout(()=>loadTaskRegistry(), 350); }
// Top-of-page task search (near the New Task button) — drives the same registry filter.
function tasksTopSearch(v){ _registryState.q=v; _applyTaskSearchMode(v); clearTimeout(_registrySearchTimer); _registrySearchTimer=setTimeout(()=>loadTaskRegistry(), 300); }
// While a search is active, collapse the dashboard sections (My Focus, counts, leave,
// widgets) so the matching tasks — the registry results — sit right under the search box.
// No more scrolling past everything to find what you searched. Restored when cleared.
function _applyTaskSearchMode(q){
  const searching = !!(q && q.trim());
  const map = {tasksQuickTop:'', tasksDash:'', tasksLeave:'grid', tasksWidgets:'grid'};
  for (const id in map){
    const el = document.getElementById(id);
    if (el) el.style.display = searching ? 'none' : map[id];
  }
  const reg = document.getElementById('tasksRegistry');
  if (reg) reg.style.marginTop = searching ? '.5rem' : '';
}
async function qtDeleteRow(qid){
  if(!confirm('Delete this task? It is removed from active lists; its history is preserved.')) return;
  const r = await fetch('/nidaan/ops/api/quick-tasks/'+qid, {method:'DELETE', headers:hdrs()});
  if(r.ok){ ndUI.toast('Task deleted','success'); loadTaskRegistry(); _refreshQuickTaskWidgets(); }
  else { const d=await r.json().catch(()=>({})); ndUI.toast(_extractErr(d,'Delete failed'),'error'); }
}

// Green blink = your task with new activity since you last opened it;
// gray = your task, caught up; nothing = not your task.
function _taskDot(qt){
  if (qt.has_new) return `<span class="unseen-dot" title="New activity — not seen yet"></span>`;
  if (qt.mine)    return `<span class="seen-dot" title="Seen — no new activity"></span>`;
  return '';
}
