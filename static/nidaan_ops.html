  const claim = qt.claim_id ? ` · 🔗 #${fmtClaimNum(qt.claim_id)} ${esc(qt.insured_name||'')}` : '';
  return `
    <div onclick="openQuickTaskDrawer(${qt.quick_task_id})"
         style="padding:.55rem .75rem;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;border-left:3px solid ${prio.color}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem">
        <div style="flex:1;min-width:0">
          <div style="font-size:.86rem;font-weight:600;display:flex;align-items:center;gap:.35rem;flex-wrap:wrap">${_taskDot(qt)}<span>${prio.icon}</span><span style="background:rgba(34,211,238,.16);color:var(--nd-cyan-text);font-family:monospace;font-weight:800;font-size:.88rem;padding:.08rem .4rem;border-radius:6px">#${qt.quick_task_id}</span>${qt.category_code?_taskCatBadge(qt.category_code):''}<span>${esc(qt.title||'')}</span></div>
          <div style="font-size:.74rem;color:var(--nd-text-muted);margin-top:.15rem">
            <span style="color:${status.color}">${status.label}</span>${showAssignee&&qt.assignee_name?' · 👤 '+esc(qt.assignee_name):''}${qt.creator_name?' · ✍️ '+esc(qt.creator_name):''}${due}${claim}
          </div>
        </div>
      </div>
    </div>`;
}

// ── Drawer: Quick Task detail with status flow + threaded comments ───────────
let _qtDrawerCurrentId = null;

async function openQuickTaskDrawer(qid){
  _qtDrawerCurrentId = qid;
  const r = await fetch('/nidaan/ops/api/quick-tasks/'+qid, { headers: hdrs() });
  if (!r.ok) { ndUI.toast('Failed to load quick task','error'); return; }
  const d = await r.json();
  const qt = d.quick_task;
  const notes = d.notes || [];
  const participants = d.participants || [];
  const meMuted = !!d.me_muted;
  window._qtMentions = {};   // fresh @mention picks for this drawer
  const prio = QT_PRIORITY_PILLS[qt.priority] || QT_PRIORITY_PILLS.normal;
  const status = QT_STATUS_PILLS[qt.status] || QT_STATUS_PILLS.open;
  const isAssignee = qt.assigned_to_staff_id === _staffId;
  const isCreator = qt.created_by_staff_id === _staffId;
  const isAdmin = (_role==='super_admin' || _role==='sub_super_admin');
  const iAmParticipant = (d.participants||[]).some(p => p.staff_id === _staffId);
  const canTransition = isAssignee || isAdmin;
  // Anyone involved — assignee, creator, admin, or an @mentioned collaborator — can comment.
  const canComment = isAssignee || isCreator || isAdmin || iAmParticipant;

  // Load the staff roster up front — admins use it to reassign, and EVERYONE uses
  // it for @mention autocomplete in the comment box.
  let assignees = [];
  try { assignees = await _loadAssigneesOnce(); } catch(e){}
  try { await _loadTaskCategoriesOnce(); } catch(e){}   // for the category pill/badge
  const _cat = qt.category_code ? _taskCat(qt.category_code) : null;

  // Approval state
  const reqAppr = !!qt.requires_approval;
  const apprStatus = qt.approval_status || 'none';
  const APPR_PILL = {
    pending:  {c:'#fbbf24', t:'⏳ Approval pending'},
    approved: {c:'#22c55e', t:'✅ Approved'},
    rejected: {c:'#f87171', t:'🚫 Rejected'},
  };
  const ap = APPR_PILL[apprStatus];

  document.getElementById('drawerTitle').textContent = '📌 Quick Task #' + qt.quick_task_id;
  const body = document.getElementById('drawerBody');
  const statusActions = canTransition ? `
    <div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem">
      ${qt.status==='open' ? `<button class="btn-sm" style="background:#22d3ee;color:#0a1628;font-weight:700" onclick="qtSetStatus(${qt.quick_task_id},'in_progress')">▶ Start</button>` : ''}
      ${qt.status!=='done' && qt.status!=='cancelled' ? `<button class="btn-sm" style="background:#22c55e;color:#0a1628;font-weight:700" onclick="qtSetStatus(${qt.quick_task_id},'done')">✓ Mark done</button>` : ''}
      ${qt.status==='done' || qt.status==='cancelled' ? `<button class="btn-sm btn-ghost" onclick="qtSetStatus(${qt.quick_task_id},'open')">↺ Reopen</button>` : ''}
      ${qt.status!=='cancelled' && qt.status!=='done' && isAdmin ? `<button class="btn-sm btn-ghost" style="color:var(--nd-danger-text)" onclick="qtSetStatus(${qt.quick_task_id},'cancelled')">✕ Cancel</button>` : ''}
    </div>` : '';

  // Approval actions — only admins (super_admin / sub_super_admin) can decide.
  const canApprove = reqAppr && apprStatus === 'pending' && isAdmin;
  let approvalActions = '';
  if (canApprove) {
    approvalActions = `
    <div style="display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem;padding:.65rem;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:8px">
      <span style="font-size:.82rem;color:var(--nd-warning-text);font-weight:600;flex:1">⏳ This task needs your approval${isCreator?'':' (as super admin)'}</span>
      <button class="btn-sm" style="background:#22c55e;color:#0a1628;font-weight:700" onclick="qtApprove(${qt.quick_task_id},'approved')">✓ Approve</button>
      <button class="btn-sm" style="background:#f87171;color:#0a1628;font-weight:700" onclick="qtApprove(${qt.quick_task_id},'rejected')">✕ Reject</button>
    </div>`;
  } else if (reqAppr && apprStatus === 'pending') {
    // Everyone else (incl. the assignee) sees a read-only waiting notice.
    approvalActions = `
    <div style="margin-bottom:1rem;padding:.6rem .65rem;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.22);border-radius:8px;font-size:.82rem;color:var(--nd-warning-text)">
      ⏳ Awaiting approval from <strong>${esc(qt.creator_name||'the creator')}</strong>
    </div>`;
  }

  // Manage block: reassign is open to ALL staff (audited); edit/merge stay admin.
  const manageActions = `
    <div style="display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem;padding:.6rem;background:var(--nd-bg-surface);border:1px solid var(--nd-border);border-radius:8px">
      <span style="font-size:.78rem;color:var(--nd-text-muted)">Reassign:</span>
      <select id="qtReassignSel" style="background:var(--nd-bg-surface-2);border:1px solid var(--nd-border-strong);color:var(--nd-text-primary);padding:.35rem .5rem;border-radius:6px;font-size:.82rem">
        ${assignees.map(a=>`<option value="${a.staff_id}" ${a.staff_id===qt.assigned_to_staff_id?'selected':''}>${esc(a.name)} · ${esc((a.role||'').replace(/_/g,' '))}</option>`).join('')}
      </select>
      <button class="btn-sm" style="background:#a78bfa;color:#0a1628;font-weight:700" onclick="qtReassign(${qt.quick_task_id})">⇄ Reassign</button>
      ${(isCreator || _role==='super_admin') ? `<button class="btn-sm btn-ghost" style="color:var(--nd-cyan-text)" onclick="qtOpenEdit(${qt.quick_task_id})">✏️ Edit</button>` : ''}
      <button class="btn-sm btn-ghost" onclick="qtShowHistory(${qt.quick_task_id})">📜 History</button>
      ${isAdmin ? `<button class="btn-sm btn-ghost" style="color:var(--nd-purple-text)" onclick="openMergeModal(${qt.quick_task_id})">⧉ Merge</button>` : ''}
      ${isAdmin ? `<button class="btn-sm btn-ghost" style="color:var(--nd-danger-text);margin-left:auto" onclick="qtDelete(${qt.quick_task_id})">🗑 Delete</button>` : ''}
    </div>
    <div id="qtEditBox" style="display:none;margin-bottom:1rem"></div>
    <div id="qtHistoryBox" style="display:none;margin-bottom:1rem"></div>`;

  body.innerHTML = `
    <div style="padding:1rem 1.25rem 2rem">
      ${qt.merged_into ? `<div style="background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.35);border-radius:8px;padding:.6rem .7rem;margin-bottom:.8rem;font-size:.82rem;color:var(--nd-purple-text)">⧉ This task was merged into <a style="color:var(--nd-purple-text);cursor:pointer;font-weight:700" onclick="openQuickTaskDrawer(${qt.merged_into})">#${qt.merged_into}</a></div>` : ''}
      <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem">
        <span class="task-pill" style="background:${prio.color}22;color:${prio.color};border:1px solid ${prio.color}44">${prio.icon} ${prio.label}</span>
        <span class="task-pill" style="background:${status.color}22;color:${status.color};border:1px solid ${status.color}44">${status.label}</span>
        ${qt.task_type==='request' ? `<span class="task-pill" style="background:#a78bfa22;color:#a78bfa;border:1px solid #a78bfa44">🙋 Request</span>` : ''}
        ${reqAppr && ap ? `<span class="task-pill" style="background:${ap.c}22;color:${ap.c};border:1px solid ${ap.c}44">${ap.t}</span>` : ''}
        ${_cat ? `<span class="task-pill" style="background:${_cat.color}22;color:${_cat.color};border:1px solid ${_cat.color}55">🏷️ ${esc(_cat.label)} (${esc(_cat.code)})</span>` : ''}
      </div>
      <div style="font-size:1.1rem;font-weight:700;margin-bottom:.6rem">${esc(qt.title||'')}</div>
      ${qt.description ? `<div style="font-size:.86rem;color:var(--nd-text-secondary);white-space:pre-wrap;margin-bottom:1rem">${esc(qt.description)}</div>` : ''}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-bottom:1rem;font-size:.83rem">
        <div><span style="color:var(--nd-text-muted)">Assignee</span><br>${esc(qt.assignee_name||'Unassigned')}</div>
        <div><span style="color:var(--nd-text-muted)">Created by</span><br>${esc(qt.creator_name||'—')}</div>
        ${qt.claim_id ? `<div><span style="color:var(--nd-text-muted)">Linked claim</span><br><a style="color:var(--nd-cyan-text);cursor:pointer" onclick="closeDrawer();openClaimDrawer(${qt.claim_id})">#${fmtClaimNum(qt.claim_id)} ${esc(qt.insured_name||'')}</a></div>` : ''}
        ${qt.due_date ? `<div><span style="color:var(--nd-text-muted)">Due</span><br>${esc(qt.due_date)}</div>` : ''}
        <div><span style="color:var(--nd-text-muted)">Created</span><br>${ndUI.timeAgo(qt.created_at)}</div>
        ${qt.completed_at ? `<div><span style="color:var(--nd-text-muted)">Completed</span><br>${ndUI.timeAgo(qt.completed_at)}</div>` : ''}
        ${qt.complainant_name ? `<div><span style="color:var(--nd-text-muted)">Complainant</span><br>${esc(qt.complainant_name)}</div>` : ''}
        ${qt.complainant_phone ? `<div><span style="color:var(--nd-text-muted)">Complainant mobile</span><br><a href="tel:${esc(qt.complainant_phone)}" style="color:var(--nd-cyan-text)">${esc(qt.complainant_phone)}</a></div>` : ''}
      </div>

      <div style="display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem">
        <span style="font-size:.72rem;color:var(--nd-text-muted);text-transform:uppercase;letter-spacing:.04em">👥 Involved</span>
        ${participants.map(p=>{
          const ri={creator:'✍️',assignee:'👤',owner:'👤',mentioned:'🏷️',watcher:'👁️'}[p.relation]||'•';
          return `<span title="${esc(p.relation)}" style="font-size:.74rem;background:var(--nd-bg-surface-2);border:1px solid var(--nd-border-strong);padding:.12rem .5rem .12rem .18rem;border-radius:999px;display:inline-flex;align-items:center;gap:.3rem">${_miniAvatar(p.avatar_url, p.name)} ${esc(p.name||('#'+p.staff_id))} <span style="font-size:.62rem;opacity:.7">${ri}</span>${p.muted?' 🔕':''}</span>`;
        }).join('')}
        <button class="btn-sm btn-ghost" style="margin-left:auto;font-size:.76rem" onclick="qtToggleMute(${qt.quick_task_id}, ${meMuted?0:1})">${meMuted?'🔔 Unmute':'🔕 Mute'}</button>
      </div>

      ${approvalActions}
      ${statusActions}
      ${manageActions}

      <div style="margin-bottom:.5rem">
        <div style="font-size:.78rem;color:var(--nd-text-muted);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.05em">🧵 Discussion (${notes.length})</div>
        <div style="background:var(--nd-bg-surface);border:1px solid var(--nd-border);border-radius:8px;padding:.75rem;max-height:300px;overflow-y:auto">
          ${_renderQTThread(notes, qt.quick_task_id, canComment)}
        </div>
        ${canComment ? `
          <div style="position:relative;margin-top:.5rem;display:flex;gap:.5rem;align-items:center">
            <div id="qtMentionBox" style="display:none;position:absolute;bottom:calc(100% + 4px);left:0;right:0;max-height:200px;overflow-y:auto;background:var(--nd-bg-base-2);border:1px solid var(--nd-border-strong);border-radius:8px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.5)"></div>
            <input id="qtNoteInput" placeholder="Add a comment…  (type @ to tag someone)" autocomplete="off"
                   oninput="_qtMentionInput(this)"
                   onkeydown="if(event.key==='Enter'&&document.getElementById('qtMentionBox').style.display==='none')qtAddNote(${qt.quick_task_id})"
                   style="flex:1;background:var(--nd-bg-surface);border:1px solid var(--nd-border);color:var(--nd-text-primary);padding:.55rem .75rem;border-radius:8px;font-size:.88rem">
            <input type="file" id="qtNoteFile" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,.heif,.doc,.docx,.xls,.xlsx,.txt,.csv" style="display:none" onchange="_qtFilePicked()">
            <button class="btn-sm" title="Attach file(s)" style="background:var(--nd-bg-surface-2);border:1px solid var(--nd-border-strong);color:var(--nd-text-primary)" onclick="document.getElementById('qtNoteFile').click()">📎</button>
            <button class="btn-sm" style="background:#22d3ee;color:#0a1628;font-weight:700" onclick="qtAddNote(${qt.quick_task_id})">Send</button>
          </div>
          <div style="font-size:.7rem;color:var(--nd-text-faint);margin-top:.25rem">💡 Tag a teammate with @ to pull them onto this task. 📎 Up to 10 files · 10 MB each · PDF, images (JPG/PNG/HEIC), DOC/XLS, TXT/CSV. You can remove your own attachment within 1 hour.</div>
          <div id="qtNoteFileName" style="display:none;font-size:.76rem;color:var(--nd-cyan-text);margin-top:.3rem"></div>` : ''}
      </div>
    </div>`;
  document.getElementById('drawerBg').classList.add('open');
}

function _renderQTThread(notes, qid, canComment){
  if (!notes.length) return '<div style="color:var(--nd-text-faint);font-size:.85rem">No comments yet.</div>';
  const roleColors = {super_admin:'#a78bfa', sub_super_admin:'#22d3ee', team_member:'#86efac'};
  const roleLabel = {super_admin:'SA', sub_super_admin:'ADMIN', team_member:'ASSOC'};
  const isAdmin = (_role==='super_admin' || _role==='sub_super_admin');
  const byParent = {};
  const roots = [];
  notes.forEach(n => {
    if (n.parent_note_id) (byParent[n.parent_note_id] = byParent[n.parent_note_id] || []).push(n);
    else roots.push(n);
  });
  const renderNote = (n, isReply) => {
    const c = roleColors[n.staff_role] || '#94a3b8';
    const l = roleLabel[n.staff_role] || 'STAFF';
    // Seen-receipt — ✓ sent, ✓✓ Seen (by whom, on hover). Replaces approval.
    const readers = n.reads || [];
    const tick = readers.length
      ? `<span title="Seen by ${esc(readers.map(r=>r.name+' ('+ndUI.timeAgo(r.at)+')').join(', '))}" style="color:var(--nd-success-text);font-weight:700">✓✓ Seen</span>`
      : `<span title="Sent — not seen yet" style="color:var(--nd-text-faint);font-weight:700">✓ Sent</span>`;
    return `
      <div style="${isReply?'margin-left:1.25rem;border-left:2px solid '+c+'33;padding-left:.6rem':''};margin-bottom:.6rem">
        <div style="font-size:.74rem;color:var(--nd-text-muted)">
          <span style="color:${c};font-weight:700">[${l}]</span>
          <b style="color:var(--nd-text-primary)">${esc(n.staff_name||'Staff')}</b> · ${ndUI.timeAgo(n.created_at)} · ${tick} ${_srcBadge(n.source)}
        </div>
        <div style="font-size:.88rem;margin-top:.15rem;white-space:pre-wrap">${esc(n.note)}</div>
        ${n.note_translation ? `<div style="font-size:.8rem;margin-top:.25rem;color:var(--nd-info-text);background:rgba(59,130,246,.08);border-left:2px solid rgba(59,130,246,.45);padding:.2rem .55rem;border-radius:0 5px 5px 0">🌐 English (auto): ${esc(n.note_translation)}</div>` : ''}
        ${(n.attachments && n.attachments.length)
          ? `<div style="margin-top:.25rem;display:flex;flex-wrap:wrap;gap:.3rem">${n.attachments.map(a=>`<span style="display:inline-flex;align-items:center;gap:.3rem;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);border-radius:6px;padding:.15rem .45rem"><a href="${esc(a.url)}" target="_blank" style="color:var(--nd-info-text);text-decoration:none;font-size:.82rem">📎 ${esc(a.name||'attachment')}</a>${a.deletable && a.id ? `<button onclick="qtDeleteAttachment(${qid},${a.id})" title="Remove attachment" style="background:none;border:none;color:var(--nd-danger-text);cursor:pointer;font-size:.95rem;line-height:1;padding:0">×</button>` : ''}</span>`).join('')}</div>`
          : (n.attachment_url ? `<div style="margin-top:.25rem"><a href="${esc(n.attachment_url)}" target="_blank" style="color:var(--nd-info-text);text-decoration:none;font-size:.82rem;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);border-radius:6px;padding:.15rem .45rem;display:inline-block">📎 ${esc(n.attachment_original_name||'attachment')}</a></div>` : '')}
        ${(!isReply && canComment) ? `
          <button onclick="qtToggleReply(${n.note_id})"
                  style="font-size:.72rem;background:transparent;border:none;color:rgba(34,211,238,.85);cursor:pointer;padding:.15rem 0">↩ Reply</button>
          <div id="qtReplyBox_${n.note_id}" style="display:none;margin-top:.3rem">
            <input id="qtReplyInput_${n.note_id}" placeholder="Reply…"
                   onkeydown="if(event.key==='Enter')qtAddNote(${qid},${n.note_id})"
                   style="width:calc(100% - 60px);background:var(--nd-bg-surface);border:1px solid var(--nd-border-strong);color:var(--nd-text-primary);padding:.4rem .55rem;border-radius:6px;font-size:.82rem">
            <button onclick="qtAddNote(${qid},${n.note_id})"
                    style="margin-left:.3rem;background:rgba(34,211,238,.18);border:1px solid rgba(34,211,238,.3);color:var(--nd-cyan-text);padding:.4rem .65rem;border-radius:6px;font-size:.78rem;cursor:pointer">Send</button>
          </div>` : ''}
        ${(byParent[n.note_id]||[]).map(child => renderNote(child, true)).join('')}
      </div>`;
  };
  return roots.map(n => renderNote(n, false)).join('');
}

function qtToggleReply(nid){
  const box = document.getElementById('qtReplyBox_'+nid);
  if (!box) return;
  const show = box.style.display === 'none';
  box.style.display = show ? 'block' : 'none';
  if (show) setTimeout(() => document.getElementById('qtReplyInput_'+nid)?.focus(), 30);
}

async function qtApproveNote(qid, noteId, approve){
  const r = await fetch(`/nidaan/ops/api/quick-tasks/${qid}/notes/${noteId}/approval`, {
    method:'POST', headers:{...hdrs(),'Content-Type':'application/json'},
    body: JSON.stringify({approve})
  });
  if (r.ok) { ndUI.toast(approve?'Comment approved ✓':'Approval removed','success'); openQuickTaskDrawer(qid); }
  else { const d=await r.json().catch(()=>({})); ndUI.toast(_extractErr(d,'Failed'),'error'); }
}

// Refresh the quick-task widgets when they're on-screen (Tasks panel, or
// Overview on older sessions). Called after any task mutation.
function _refreshQuickTaskWidgets(){
  if (_currentPanel === 'tasks') {
    loadMyQuickTasksWidget();
    if (typeof loadTaskRegistry === 'function') loadTaskRegistry();
  } else if (_currentPanel === 'overview') {
    loadMyQuickTasksWidget();
  }
}

async function qtSetStatus(qid, status){
  const r = await fetch('/nidaan/ops/api/quick-tasks/'+qid, {
    method:'PATCH', headers:{...hdrs(),'Content-Type':'application/json'},
    body: JSON.stringify({status})
  });
  if (r.ok) {
    ndUI.toast('Status updated','success');
    openQuickTaskDrawer(qid);  // refresh
    _refreshQuickTaskWidgets();
  } else ndUI.toast('Failed to update','error');
}

async function qtReassign(qid){
  const sel = document.getElementById('qtReassignSel');
  if (!sel) return;
  const newId = parseInt(sel.value, 10);
  if (!newId) { ndUI.toast('Pick an assignee','error'); return; }
  const r = await fetch('/nidaan/ops/api/quick-tasks/'+qid, {
    method:'PATCH', headers:{...hdrs(),'Content-Type':'application/json'},
    body: JSON.stringify({assigned_to_staff_id:newId})
  });
  if (r.ok) {
    ndUI.toast('Reassigned ✓ — assignee notified','success');
    openQuickTaskDrawer(qid);
    _refreshQuickTaskWidgets();
  } else { const d=await r.json().catch(()=>({})); ndUI.toast(_extractErr(d,'Reassign failed'),'error'); }
}

async function qtApprove(qid, decision){
  const note = decision==='rejected'
    ? (prompt('Reason for rejection (optional):') || '')
    : '';
  const r = await fetch('/nidaan/ops/api/quick-tasks/'+qid+'/approval', {
    method:'POST', headers:{...hdrs(),'Content-Type':'application/json'},
    body: JSON.stringify({decision, note})
  });
  if (r.ok) {
    ndUI.toast(decision==='approved'?'Approved ✓':'Rejected','success');
    openQuickTaskDrawer(qid);
    _refreshQuickTaskWidgets();
  } else { const d=await r.json().catch(()=>({})); ndUI.toast(_extractErr(d,'Action failed'),'error'); }
}

async function qtDelete(qid){
  if (!confirm('Delete this task? It will be removed from active lists (history is kept).')) return;
  const r = await fetch('/nidaan/ops/api/quick-tasks/'+qid, { method:'DELETE', headers: hdrs() });
  if (r.ok) {
    ndUI.toast('Task deleted','success');
    closeDrawer();
    _refreshQuickTaskWidgets();
  } else { const d=await r.json().catch(()=>({})); ndUI.toast(_extractErr(d,'Delete failed'),'error'); }
}

// ── Task merge (dedupe) ──────────────────────────────────────────────────────
let _mergeState = {baseId:null, baseTitle:'', otherId:null, otherTitle:'', retain:'base'};
async function openMergeModal(baseId){
  let base = {};
  try { base = (await (await fetch('/nidaan/ops/api/quick-tasks/'+baseId,{headers:hdrs()})).json()).quick_task || {}; } catch(e){}
  _mergeState = {baseId, baseTitle:base.title||'', otherId:null, otherTitle:'', retain:'base'};
  openModal('⧉ Merge Tasks', `
    <div style="font-size:.84rem;color:var(--nd-text-secondary);margin-bottom:.75rem">Merge a duplicate into <strong>#${baseId}</strong>. Comments move to the retained task; the other is archived with a link back, and both timelines record the merge.</div>
    <label style="display:block;font-size:.74rem;color:var(--nd-text-muted);margin-bottom:.2rem">Find the duplicate task</label>
    <input id="mergeSearch" placeholder="Search title or #id…" oninput="mergeSearchTasks(this.value)" style="width:100%;background:var(--nd-bg-surface);border:1px solid var(--nd-border-strong);color:var(--nd-text-primary);padding:.5rem .7rem;border-radius:6px;font-size:.86rem;margin-bottom:.5rem">
    <div id="mergeResults" style="max-height:190px;overflow-y:auto;margin-bottom:.5rem"></div>
    <div id="mergeConfirm"></div>`,
    [{label:'Cancel', cls:'btn-ghost', fn:closeModal}]);
  mergeSearchTasks('');
}
async function mergeSearchTasks(q){
  const box = document.getElementById('mergeResults'); if(!box) return;
  const r = await fetch('/nidaan/ops/api/quick-tasks?include_done=true&limit=30'+(q?('&q='+encodeURIComponent(q)):''), { headers: hdrs() });
  const items = (r.ok ? (await r.json()).quick_tasks : []).filter(t=>t.quick_task_id!==_mergeState.baseId);
  box.innerHTML = items.length ? items.map(t=>`
    <div onclick="mergePick(${t.quick_task_id},'${esc((t.title||'').replace(/'/g,''))}')" style="padding:.45rem .5rem;border-bottom:1px solid var(--nd-border);cursor:pointer;font-size:.84rem">
      <span style="color:var(--nd-cyan-text);font-family:monospace;font-weight:700">#${t.quick_task_id}</span> ${esc(t.title||'')} <span style="color:var(--nd-text-faint);font-size:.74rem">· ${esc(t.status)}</span>

async function doMerge(){
  const {baseId, otherId, retain} = _mergeState;
  if(!otherId){ ndUI.toast('Pick a task to merge','error'); return; }
  const keep = retain==='base' ? baseId : otherId;
  const drop = retain==='base' ? otherId : baseId;
  if(!confirm(`Keep #${keep} and merge #${drop} into it?\n#${drop} will be archived (its comments move to #${keep}).`)) return;
  const r = await fetch('/nidaan/ops/api/quick-tasks/'+keep+'/merge', {
    method:'POST', headers:{...hdrs(),'Content-Type':'application/json'},
    body: JSON.stringify({duplicate_id: drop})

  if(r.ok){ ndUI.toast('Tasks merged ✓','success'); closeModal(); _refreshQuickTaskWidgets(); openQuickTaskDrawer(keep); }
  else { const d=await r.json().catch(()=>({})); ndUI.toast(_extractErr(d,'Merge failed'),'error'); }

// ── @mention autocomplete in the task comment box ────────────────────────────
let _qtMentionMatches = [];
function _qtMentionInput(el){
  const box = document.getElementById('qtMentionBox');
  if (!box) return;
  const caret = el.selectionStart || el.value.length;
  const upto = el.value.slice(0, caret);
  const at = upto.lastIndexOf('@');
  if (at < 0) { box.style.display='none'; return; }
  const query = upto.slice(at + 1);
  if (query.length > 24) { box.style.display='none'; return; }   // moved past a mention
  const q = query.trim().toLowerCase();
  _qtMentionMatches = (_assigneesCache || [])
      .filter(s => (s.name||'').toLowerCase().includes(q))
      .filter(s => s.staff_id !== _staffId)
      .slice(0, 6);
  if (!_qtMentionMatches.length) { box.style.display='none'; return; }
  box.dataset.at = at;
  box.innerHTML = _qtMentionMatches.map((s,i)=>
    `<div onmousedown="event.preventDefault();_qtPickMention(${i})" style="padding:.5rem .7rem;cursor:pointer;font-size:.85rem;border-bottom:1px solid var(--nd-border);display:flex;align-items:center;gap:.45rem" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="this.style.background='transparent'">${_miniAvatar(s.avatar_url, s.name)} ${esc(s.name)}</div>`).join('');
  box.style.display='block';
}
function _qtPickMention(idx){
  const el = document.getElementById('qtNoteInput');
  const box = document.getElementById('qtMentionBox');
  const s = _qtMentionMatches[idx];
  if (!el || !box || !s) return;
  const at = parseInt(box.dataset.at || '-1');
  const caret = el.selectionStart || el.value.length;
  if (at >= 0) el.value = el.value.slice(0, at) + '@' + s.name + ' ' + el.value.slice(caret);
  window._qtMentions = window._qtMentions || {};
  window._qtMentions[s.staff_id] = s.name;
  box.style.display='none';
  el.focus();
}

async function qtAddNote(qid, parentNoteId){
  const inputId = parentNoteId ? ('qtReplyInput_'+parentNoteId) : 'qtNoteInput';
  const input = document.getElementById(inputId);
  const note = (input?.value || '').trim();
  // Attachments only on the top-level comment box (not replies).
  const fileInput = parentNoteId ? null : document.getElementById('qtNoteFile');
  const picked = (fileInput && fileInput.files) ? Array.from(fileInput.files) : [];
  if (!note && !picked.length) return;
  const fd = new FormData();
  fd.append('note', note);
  if (parentNoteId) fd.append('parent_note_id', parentNoteId);
  picked.forEach(f => fd.append('files', f));
  // Include @mentions still present in the text (top-level box only).
  if (!parentNoteId && window._qtMentions){
    const ids = Object.keys(window._qtMentions).filter(id => note.includes('@' + window._qtMentions[id]));
    if (ids.length) fd.append('mentions', ids.join(','));
  }
  const r = await fetch('/nidaan/ops/api/quick-tasks/'+qid+'/notes', {
    method:'POST', headers: hdrs(),   // multipart — let the browser set Content-Type
    body: fd,
  });
  if (r.ok) { input.value=''; if (fileInput) fileInput.value=''; openQuickTaskDrawer(qid); }
  else ndUI.toast('Failed to add comment','error');
}

// ── Widget: Claims by Status (associate or compact view) ─────────────────────
function _widgetClaimsByStatus(rows) {

    in_negotiation:'#a78bfa', resolved_won:'#22c55e', resolved_lost:'#f87171',

async function renderActiveClaimsWidget(statusFilter, search) {
  window._ovStatusFilter = statusFilter; window._ovSearch = search;  // remember for filter toggles

  if (!body) return;
  body.innerHTML = '<div style="padding:1rem;text-align:center;color:var(--nd-text-faint);font-size:.85rem">Loading…</div>';
  const params = new URLSearchParams();
  if (statusFilter) params.set('status', statusFilter);
  if (search) params.set('search', search);
  if (_opsPayFilter) params.set('payment_status', _opsPayFilter);
  params.set('limit', '30');
  const r = await API('/claims?' + params);
  if (!r.ok) { body.innerHTML = '<div style="padding:1rem;color:var(--nd-danger-text);font-size:.85rem">Failed to load</div>'; return; }
  const d = await r.json();
  const claims = d.claims || [];
  const pl = d.pipeline || {};
  // Pipeline summary bar — paid/active work vs the unpaid-lead funnel.
  const chip = (ps, label, n, on) => `<button onclick="setOpsPayFilter('${ps}')" style="cursor:pointer;border:1px solid ${on?'#22d3ee':'rgba(255,255,255,.12)'};background:${on?'rgba(34,211,238,.12)':'transparent'};color:#e2e8f0;border-radius:999px;padding:.25rem .7rem;font-size:.72rem;font-weight:700">${label} <span style="opacity:.7">${n||0}</span></button>`;

      ${chip('', 'All', (pl.unpaid_lead||0)+(pl.paid||0)+(pl.subscription||0), _opsPayFilter==='')}
      ${chip('unpaid_lead', '🟠 Leads', pl.unpaid_lead, _opsPayFilter==='unpaid_lead')}
      ${chip('paid', '🟢 Paid', pl.paid, _opsPayFilter==='paid')}
      ${chip('subscription', '🔵 Sub', pl.subscription, _opsPayFilter==='subscription')}
    </div>` : '';
  if (!claims.length) {
    body.innerHTML = bar + '<div style="padding:1rem;text-align:center;color:var(--nd-text-faint);font-size:.85rem">No claims match these filters.</div>';
    return;
  }
  const rows = claims.map(c => `
    <tr onclick="openClaimDrawer(${c.claim_id})" style="cursor:pointer">
      <td style="white-space:nowrap">${c.unseen_notes>0?'<span class="unseen-dot" title="New activity — not seen yet"></span> ':''}<strong>#${fmtClaimNum(c.claim_id)}</strong></td>

      <td>${esc(c.claim_type||'—')}</td>

      <td>₹${fmt(c.disputed_amount||0)}</td>

      <td style="font-size:.75rem;color:var(--nd-text-muted)">${esc(c.owner_name||'—')}</td>
      <td style="font-size:.75rem;color:var(--nd-text-muted)">${esc(c.assigned_staff_name||'—')}</td>
      <td style="font-size:.72rem;color:var(--nd-text-faint)">${fmtDate(c.created_at)}</td>
    </tr>`).join('');
  body.innerHTML = bar + `
    <div class="table-wrap" style="max-height:480px;overflow-y:auto">
      <table>
        <thead>
          <tr><th>#</th><th>Insured</th><th>Type</th><th>Insurer</th><th>Disputed</th><th>Pay</th><th>Status</th><th>Owner</th><th>Assigned</th><th>Created</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div style="text-align:right;font-size:.75rem;color:var(--nd-text-faint);margin-top:.4rem">
      Showing ${claims.length}${d.count > claims.length ? ' of '+d.count : ''}

// ── Drill-in from Task Pipeline widget: filter claims that have tasks in this status
async function drillIntoTaskStatus(statusSlug, label) {
  // Open Claims panel with a custom inline filter banner
  showPanel('claims');
  // Fetch tasks in that status and group by claim
  const r = await fetch('/nidaan/ops/api/tasks/kanban', { headers: hdrs() });
  if (!r.ok) { ndUI.toast('Failed to load tasks','error'); return; }
  const groups = await r.json();
  // Flatten across all stages, pick matching status
  const all = Object.values(groups).flat();
  const matching = all.filter(t => t.status_slug === statusSlug);
  const claimIds = [...new Set(matching.map(t => t.claim_id))];
  const wrap = document.getElementById('claimTableWrap');
  if (!wrap) return;
  // Filter the rendered table to these claims (data-driven re-render).
  const r2 = await API('/claims?limit=500');

  const claims = ((await r2.json()).claims || []).filter(c => claimIds.includes(c.claim_id));
  const rows = claims.map(c=>`
    <tr onclick="openClaimDrawer(${c.claim_id})" style="cursor:pointer">
      <td><strong>#${fmtClaimNum(c.claim_id)}</strong></td>
      <td>${esc(c.insured_name)}</td>
      <td>${esc(c.claim_type||'—')}</td>
      <td>${esc(c.insurer_name||'—')}</td>
      <td>₹${fmt(c.disputed_amount||0)}</td>

      <td>${esc(c.owner_name||'—')}</td>
      <td>${esc(c.assigned_staff_name||'—')}</td>
      <td style="font-size:.72rem;color:var(--nd-text-faint)">${fmtDate(c.created_at)}</td>
    </tr>`).join('');
  wrap.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);border-radius:8px;padding:.55rem 1rem;margin-bottom:.85rem">

}

  if (_claimBranchOpts) return _claimBranchOpts;

    _claimBranchOpts = (d.branches||[]).map(b=>b.branch_code).filter(Boolean).sort(); } }

let _outcomeCache = {};
async function loadOutcomeClaims(key, outcome, title, sub){
  const el = document.getElementById('panel-'+key);
  el.innerHTML = `<div class="section-hdr"><div><div class="section-title">${title}</div><div class="section-sub">${sub}</div></div></div>

  if(!r || !r.ok){ document.getElementById('oc_'+key+'_wrap').innerHTML='<div class="empty"><p>Failed to load</p></div>'; return; }

  _renderOutcome(key);

function _renderOutcome(key){
  const wrap = document.getElementById('oc_'+key+'_wrap'); if(!wrap) return;
  const q = (((document.getElementById('oc_'+key+'_s')||{}).value)||'').toLowerCase();

  if(!rows.length){ wrap.innerHTML='<div class="empty"><div class="ei">📭</div><p>No claims here yet</p></div>'; return; }

        + `<td>${c.origin==='branch'?('🏢 Branch '+esc(c.branch_code||'')):esc(c.owner_name||'—')}</td>
        <td style="font-size:.72rem;color:var(--nd-text-faint)">${fmtDate(c.review_delivered_at||c.last_status_at||c.created_at)}</td>
      </tr>`).join('') + '</tbody></table></div>';
}

async function impersonateBranch(code){
  if (!confirm('Enter branch '+code+"'s dashboard as that branch?\nThis is logged/audited — you'll see exactly what the branch sees.")) return;
  const r = await API('/branches/'+encodeURIComponent(code)+'/impersonate', {method:'POST'});
  if (!r.ok){ const d=await r.json().catch(()=>({})); alert(d.detail||'Could not enter branch dashboard.'); return; }
  const d = await r.json();
  try{ localStorage.setItem('nidaan_branch_token', d.branch_token); }catch(e){}
  window.open('/nidaan/branch', '_blank');   // opens the branch portal as that branch (same-origin token)
}
async function setBranchShare(code, current){
  const v = prompt('Profit-share % for branch '+code+'\n(0–100 — % of subscription revenue from accounts attributed to this branch):', current||0);
  if (v===null) return;
  const pct = parseFloat(v);
  if (isNaN(pct) || pct<0 || pct>100){ alert('Enter a number between 0 and 100.'); return; }
  const r = await API('/branches/'+encodeURIComponent(code), {method:'PATCH', body: JSON.stringify({share_pct: pct})});
  if (!r.ok){ const d=await r.json().catch(()=>({})); alert(d.detail||'Failed to update share %.'); return; }
  loadBranches();
}
async function createBranch() {
  const code = (document.getElementById('brCode').value||'').trim().toUpperCase();
  const city = (document.getElementById('brCity').value||'').trim();
  const name = (document.getElementById('brName').value||'').trim();
  const contact_email = (document.getElementById('brEmail').value||'').trim();
  if (!code || !city) { alert('Branch code and city are required.'); return; }
  const r = await API('/branches', {method:'POST', body: JSON.stringify({branch_code:code, city, name, contact_email})});
  const d = await r.json().catch(()=>({}));
  if (!r.ok) { alert(d.detail || 'Could not create branch.'); return; }
  loadBranches();
}
async function toggleBranch(code, status) {
  const r = await API('/branches/'+encodeURIComponent(code), {method:'PATCH', body: JSON.stringify({status})});
  if (!r.ok) { const d=await r.json().catch(()=>({})); alert(d.detail||'Failed to update branch.'); return; }
  loadBranches();
}
async function editBranchEmail(code, current) {
  const email = prompt('Login & alert email for branch '+code+'\n(this is the email the branch uses to log in — blank to clear):', current||'');
  if (email===null) return;
  const r = await API('/branches/'+encodeURIComponent(code), {method:'PATCH', body: JSON.stringify({contact_email: email.trim()})});
  if (!r.ok) { const d=await r.json().catch(()=>({})); alert(d.detail||'Failed to update email.'); return; }
  loadBranches();
}
// Copy ready-to-send login instructions for a branch (URL + their login email + steps).
function branchLoginInfo(code, email){
  const url = location.origin + '/nidaan/branch';
  const text =
`Your Nidaan Partner branch dashboard login (${code}):

1. Open: ${url}
2. Enter your branch email: ${email}
3. Tap "Send login code" — a 6-digit code arrives in your email.
4. Enter the code to sign in. No password needed.

You'll see your referrals, subscribers, earnings, and can raise claims.`;
  const done = ()=> ndUI.toast('Login instructions copied — paste to the branch (WhatsApp/email).','success');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>alert(text));
  else alert(text);
}

async function mbRaiseClaim(){

function mbCopy(text, btn){
  const done = ()=>{ if(btn){ const o=btn.innerHTML; btn.innerHTML = _mbHi()?'✓ कॉपी हुआ':'✓ Copied'; setTimeout(()=>btn.innerHTML=o,1500);} };
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>{ mbCopyFallback(text); done(); }); }
  else { mbCopyFallback(text); done(); }
}
function mbCopyFallback(text){ try{ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }catch(e){} }

// Re-check recent Razorpay payments and unlock any claim/L2 captured-but-not-reflected.
async function reconcilePayments(){
  ndUI.toast('Checking recent Razorpay payments…','info');
  const r = await API('/payments/reconcile?dry_run=true&hours=168', {method:'POST'});
  if(!r.ok){ const d=await r.json().catch(()=>({})); ndUI.toast(d.detail||'Reconcile failed','error'); return; }
  const d = await r.json();
  const fixable = (d.claim_unlock||[]).length + (d.l2_unlock||[]).length;
  if(!fixable){
    alert('✓ All settled.\n\nScanned '+d.scanned+' recent Razorpay orders — every captured payment is already reflected. Nothing to fix.');
    return;
  }
  const lines = []
    .concat((d.claim_unlock||[]).map(x=>'• Claim #'+String(x.claim_id).padStart(3,'0')+' — captured but showing "'+(x.was||'unpaid')+'"'))
    .concat((d.l2_unlock||[]).map(x=>'• L2 claim #'+String(x.claim_id).padStart(3,'0')+' ('+x.branch+') — captured but not queued'));
  if(!confirm('Found '+fixable+' payment(s) captured on Razorpay but not reflected here:\n\n'+lines.join('\n')+'\n\nApply the fixes now (mark them paid / queue for legal)?')) return;
  const r2 = await API('/payments/reconcile?dry_run=false&hours=168', {method:'POST'});
  if(!r2.ok){ const d2=await r2.json().catch(()=>({})); ndUI.toast(d2.detail||'Apply failed','error'); return; }
  const d2 = await r2.json();
  ndUI.toast('✓ Reconciled '+((d2.claim_unlock||[]).length+(d2.l2_unlock||[]).length)+' payment(s)','success');
  loadClaims();
}

        <button class="btn btn-success" onclick="addFollowup(${c.claim_id})">Schedule</button>
      </div>
    </div>
    <!-- Tasks & reminders for this claim (consolidated: workflow tasks + quick-task reminders) -->

      <h4 style="display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap">

        ${(_role==='super_admin'||_role==='sub_super_admin')?
          `<span style="display:flex;gap:.4rem">
             <button class="btn-sm btn-ghost" onclick="openCreateTaskModalForClaim(${c.claim_id})">+ Task</button>
             <button class="btn-sm btn-ghost" onclick="openQuickTaskModal(${c.claim_id})">+ Reminder</button>
           </span>`:''}
      </h4>
      <div id="claimTasksArea_${c.claim_id}" style="margin-bottom:.6rem">Loading…</div>
      <div id="claimRemindersArea_${c.claim_id}">Loading…</div>
    </div>
    <!-- Actions -->
    ${canStatus?`<div class="drawer-section">
      <h4>Update Status</h4>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center">
        <select id="newStatusSel_${c.claim_id}" class="form-input" style="flex:1;min-width:140px">${statusOptions}</select>
        <textarea id="statusNote_${c.claim_id}" class="note-input" style="min-height:48px;flex:2;min-width:160px" placeholder="Optional note (sent to advisor)"></textarea>
        <button class="btn btn-primary" onclick="updateStatus(${c.claim_id})">Update</button>
      </div>
      <div class="msg" id="statusMsg_${c.claim_id}"></div>
    </div>`:''}
    ${canStatus?`<div class="drawer-section" style="border:1px solid rgba(34,211,238,.25);border-radius:10px;padding:.85rem">
      <h4>📋 Deliver Legal Assessment</h4>
      <div style="font-size:.78rem;color:var(--nd-text-muted);margin-bottom:.5rem">Sets status to <b>Review Delivered</b> and notifies the customer (dashboard + WhatsApp + email).</div>
      <div style="display:flex;flex-direction:column;gap:.5rem">
        <select id="rvOutcomeSel_${c.claim_id}" class="form-input" onchange="rvLoadTemplates(${c.claim_id})">

    </div>`:''}
    <!-- Status Timeline -->
    <div class="drawer-section">
      <h4>Status History</h4>
      <div class="tl">${tlHtml}</div>
    </div>`;

  // Load staff into the multi-select assign box (current assignees pre-checked)
  if (canAssign) {
    const sr = await API('/staff');
    if (sr.ok) {
      const sd = await sr.json();
      const box = document.getElementById('assignBox_'+c.claim_id);
      const assigned = new Set((c.assignees||[]).map(a=>a.staff_id));
      if (!assigned.size && c.assigned_to_staff_id) assigned.add(c.assigned_to_staff_id);
      if (box) box.innerHTML = (sd.staff||[]).filter(s=>!s.deleted_at).map(s=>
        `<label style="display:flex;align-items:center;gap:.45rem;font-size:.85rem;cursor:pointer;padding:.15rem 0"><input type="checkbox" class="assignChk_${c.claim_id}" value="${s.staff_id}" ${assigned.has(s.staff_id)?'checked':''}> ${esc(s.name)} <span style="font-size:.7rem;color:var(--nd-text-faint)">(${(s.role||'').replace(/_/g,' ')})</span></label>`).join('')
        || '<span style="color:var(--nd-text-faint);font-size:.8rem">No staff found</span>';
    }
  }

  // Load tasks for this claim (Phase 5 — Tasks under Claims)
  loadClaimTasks(c.claim_id);
  // Load Quick Task reminders linked to this claim
  loadClaimReminders(c.claim_id);
  // Load subscriber ⇄ ops message thread
  opsLoadMessages(c.claim_id);
  // Load "involved" watchers + my mute state
  loadClaimWatchers(c.claim_id);
  // Claim notes: load @mention candidates + mark notes read (drives seen-receipts)
  loadClaimMentions(c.claim_id);
  claimNotesMarkRead(c.claim_id);

  // Load documents
  try {
    const dr = await API('/claims/' + c.claim_id + '/documents');
    const docEl = document.getElementById('opsClaimDocs_' + c.claim_id);
    if (docEl) {
      if (dr.ok) {
        const dd = await dr.json();

          docEl.innerHTML = dd.docs.map(d =>
            `<div style="margin-bottom:.4rem;display:flex;align-items:center;gap:.4rem">📄 <a href="${d.url}" target="_blank" style="color:var(--nd-info-text);text-decoration:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.original_name)}</a>
             <span style="opacity:.4;font-size:.78rem;white-space:nowrap">(${(d.file_size/1024).toFixed(0)} KB · ${d.uploaded_at ? d.uploaded_at.split('T')[0] : ''})</span>${d.doc_id?`<button onclick="opsDeleteClaimDoc(${c.claim_id},${d.doc_id},this)" title="Delete this document" style="background:none;border:none;color:var(--nd-danger-text);cursor:pointer;font-size:.9rem;padding:0 .2rem">🗑</button>`:''}</div>`
          ).join('');
        } else {
          docEl.textContent = 'No documents uploaded by advisor yet.';
        }
      } else {
        docEl.textContent = 'Could not load documents.';
      }
    }
  } catch(_) {}
}

async function updateStatus(claimId) {
  const sel = document.getElementById('newStatusSel_'+claimId);
  const note = document.getElementById('statusNote_'+claimId).value.trim();
  const msgEl = document.getElementById('statusMsg_'+claimId);
  const r = await API('/claims/'+claimId+'/status', {
    method:'PATCH', body: JSON.stringify({new_status: sel.value, note})
  });
  const d = await r.json().catch(()=>({}));
  if (r.ok) {
    msgEl.className='msg ok'; msgEl.textContent='Status updated ✓';
    setTimeout(()=>openClaimDrawer(claimId),1000);
  } else {
    msgEl.className='msg err'; msgEl.textContent=_extractErr(d,'Failed');
  }
}

async function rvLoadTemplates(claimId){
  const oc = document.getElementById('rvOutcomeSel_'+claimId).value;
  const sel = document.getElementById('rvTemplateSel_'+claimId);
  if(!oc){ sel.style.display='none'; sel.innerHTML=''; return; }
  const r = await API('/review-templates?outcome='+oc);
  if(!r.ok){ sel.style.display='none'; return; }
  const tpls = (await r.json()).templates || [];
  window._rvTpls = window._rvTpls || {}; window._rvTpls[claimId] = tpls;
  sel.innerHTML = '<option value="">📋 Insert a template… (optional)</option>' + tpls.map((t,i)=>`<option value="${i}">${esc(t.title)}</option>`).join('');
  sel.style.display = tpls.length ? '' : 'none';
}
function rvApplyTemplate(claimId){
  const sel = document.getElementById('rvTemplateSel_'+claimId);
  if(sel.value==='') return;
  const t = (window._rvTpls && window._rvTpls[claimId]) ? window._rvTpls[claimId][parseInt(sel.value)] : null;
  if(t){ const fa = document.getElementById('rvFindings_'+claimId); fa.value = t.body; fa.focus(); }
}
async function deliverReview(claimId) {
  const outcome = document.getElementById('rvOutcomeSel_'+claimId).value;
  const findings = (document.getElementById('rvFindings_'+claimId).value || '').trim();
  const msgEl = document.getElementById('rvMsg_'+claimId);
  if (!outcome) { msgEl.className='msg err'; msgEl.textContent='Select an outcome.'; return; }
  if (!findings) { msgEl.className='msg err'; msgEl.textContent='Enter the assessment to share with the customer.'; return; }
  if (!confirm('Deliver this review to the customer? They will be notified on dashboard + WhatsApp + email.')) return;
  const r = await API('/claims/'+claimId+'/deliver-review', { method:'POST', body: JSON.stringify({outcome, findings}) });
  const d = await r.json().catch(()=>({}));
  if (r.ok) { msgEl.className='msg ok'; msgEl.textContent='Review delivered ✓ Customer notified.'; setTimeout(()=>openClaimDrawer(claimId),1100); }
  else { msgEl.className='msg err'; msgEl.textContent=_extractErr(d,'Failed to deliver'); }
}

async function assignClaim(claimId) {
  const staff_ids = Array.from(document.querySelectorAll('.assignChk_'+claimId+':checked')).map(b=>parseInt(b.value));
  const msgEl = document.getElementById('assignMsg_'+claimId);
  if (!staff_ids.length) { msgEl.className='msg err'; msgEl.textContent='Select at least one staff member'; return; }
  msgEl.className='msg'; msgEl.textContent='Assigning…';
  const r = await API('/claims/'+claimId+'/assign', {
    method:'POST', body: JSON.stringify({staff_ids})
  });
  const d = await r.json().catch(()=>({}));
  if (r.ok) {
    msgEl.className='msg ok'; msgEl.textContent='Assigned to '+staff_ids.length+' staff ✓';
    setTimeout(()=>openClaimDrawer(claimId),1000);
  } else {
    msgEl.className='msg err'; msgEl.textContent=_extractErr(d,'Failed');
  }
}

async function toggleClaimMute(claimId){
  const btn = document.getElementById('claimMuteBtn_'+claimId);

  try {

    if(r.ok){ ndUI.toast(willMute ? "Muted — no pings for this claim" : "Unmuted", 'success'); loadClaimWatchers(claimId); }

let _opsMsgSending = {};
async function opsSendMessage(claimId){
  if(_opsMsgSending[claimId]) return;   // ignore rapid double-taps — send exactly once
  const inp = document.getElementById('opsMsgInput_'+claimId); if(!inp) return;
  const fileEl = document.getElementById('opsMsgFile_'+claimId);
  const content = (inp.value||'').trim();
  const file = fileEl && fileEl.files && fileEl.files[0];
  if(!content && !file) return;
  _opsMsgSending[claimId] = true;
  inp.disabled=true;
  const fd = new FormData();
  fd.append('content', content);
  if(file) fd.append('file', file);
  try {
    const r = await fetch('/nidaan/ops/api/claims/'+claimId+'/messages', {method:'POST', headers: hdrs(), body: fd});
    if(r.ok){ inp.value=''; if(fileEl) fileEl.value=''; opsMsgFilePicked(claimId); await opsLoadMessages(claimId); }
    else { const d=await r.json().catch(()=>({})); ndUI.toast(_extractErr(d,'Failed to send'),'error'); }
  } catch(e){}
  finally { _opsMsgSending[claimId]=false; inp.disabled=false; inp.focus(); }
}

// ── Claim notes: threaded discussion (replies, @mentions, attachments, receipts) ──
let _claimMentionSel = {};   // claimId -> Set(staff_id) currently selected to @mention

function _renderClaimNotesThread(notes, claimId){
  if (!notes || !notes.length) return '<div style="font-size:.8rem;color:var(--nd-text-faint)">No notes yet</div>';
  const roleColors = {super_admin:'#a78bfa', sub_super_admin:'#22d3ee', team_member:'#86efac'};
  const roleLabel  = {super_admin:'SA', sub_super_admin:'ADMIN', team_member:'ASSOC'};
  const byParent = {}, roots = [];
  notes.forEach(n => { if (n.parent_note_id) (byParent[n.parent_note_id]=byParent[n.parent_note_id]||[]).push(n); else roots.push(n); });
  const renderNote = (n, isReply) => {
    const col = roleColors[n.staff_role] || '#94a3b8';
    const lab = roleLabel[n.staff_role] || 'STAFF';
    const readers = n.reads || [];
    const tick = readers.length
      ? `<span title="Seen by ${esc(readers.map(r=>r.name+' ('+ndUI.timeAgo(r.at)+')').join(', '))}" style="color:var(--nd-success-text);font-weight:700">✓✓ Seen</span>`
      : `<span title="Sent — not seen yet" style="color:var(--nd-text-faint);font-weight:700">✓ Sent</span>`;
    const mentions = (n.mentions||[]).length
      ? `<div style="margin-top:.15rem;font-size:.72rem;color:var(--nd-warning-text)">🏷️ ${n.mentions.map(m=>esc(m.name||('#'+m.staff_id))).join(', ')}</div>` : '';
    const atts = (n.attachments && n.attachments.length)
      ? `<div style="margin-top:.25rem;display:flex;flex-wrap:wrap;gap:.3rem">${n.attachments.map(a=>`<span style="display:inline-flex;align-items:center;gap:.3rem;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);border-radius:6px;padding:.15rem .45rem"><a href="${esc(a.url||'#')}" target="_blank" style="color:var(--nd-info-text);text-decoration:none;font-size:.82rem">📎 ${esc(a.original_name||'attachment')}</a>${a.deletable && a.attachment_id ? `<button onclick="claimDeleteAttachment(${claimId},${a.attachment_id})" title="Remove attachment" style="background:none;border:none;color:var(--nd-danger-text);cursor:pointer;font-size:.95rem;line-height:1;padding:0">×</button>` : ''}</span>`).join('')}</div>`
      : '';
    return `
      <div style="${isReply?'margin-left:1.25rem;border-left:2px solid '+col+'33;padding-left:.6rem':''};margin-bottom:.6rem">
        <div style="font-size:.74rem;color:var(--nd-text-muted);display:flex;gap:.35rem;align-items:center;flex-wrap:wrap">
          <span style="color:${col};font-weight:700">[${lab}]</span>
          <b style="color:var(--nd-text-primary)">${esc(n.staff_name||'Staff')}</b> · ${ndUI.timeAgo(n.created_at)} · ${tick}
          ${n.deletable ? `<button onclick="claimDeleteNote(${claimId},${n.note_id})" title="Delete note" style="background:none;border:none;color:rgba(248,113,113,.7);cursor:pointer;font-size:.78rem;margin-left:auto">🗑</button>` : ''}
        </div>
        <div style="font-size:.88rem;margin-top:.15rem;white-space:pre-wrap">${esc(n.note)}</div>
        ${mentions}${atts}
        ${!isReply ? `
          <button onclick="claimToggleReply(${n.note_id})" style="font-size:.72rem;background:transparent;border:none;color:rgba(34,211,238,.85);cursor:pointer;padding:.15rem 0">↩ Reply</button>
          <div id="claimReplyBox_${n.note_id}" style="display:none;margin-top:.3rem">
            <input id="claimReplyInput_${n.note_id}" placeholder="Reply…" onkeydown="if(event.key==='Enter')addNote(${claimId},${n.note_id})" style="width:calc(100% - 58px);background:var(--nd-bg-surface);border:1px solid var(--nd-border-strong);color:var(--nd-text-primary);padding:.4rem .55rem;border-radius:6px;font-size:.82rem">
            <button onclick="addNote(${claimId},${n.note_id})" style="margin-left:.3rem;background:rgba(34,211,238,.18);border:1px solid rgba(34,211,238,.3);color:var(--nd-cyan-text);padding:.4rem .65rem;border-radius:6px;font-size:.78rem;cursor:pointer">Send</button>
          </div>` : ''}
        ${(byParent[n.note_id]||[]).map(child => renderNote(child, true)).join('')}
      </div>`;
  };
  return roots.map(n => renderNote(n, false)).join('');
}

async function loadClaimMentions(claimId){
  const box = document.getElementById('claimMentionBox_'+claimId);
  if (!box) return;
  _claimMentionSel[claimId] = _claimMentionSel[claimId] || new Set();
  try {
    const r = await API('/claims/'+claimId+'/mention-candidates');
    if (!r.ok){ box.innerHTML=''; return; }
    const cands = (await r.json()).candidates || [];
    if (!cands.length){ box.innerHTML='<span style="opacity:.5">No teammates to tag</span>'; return; }
    box.innerHTML = '<span style="opacity:.55;align-self:center">Tag:</span>' + cands.slice(0,40).map(c=>{
      const on = _claimMentionSel[claimId].has(c.staff_id);
      return `<button type="button" id="claimMent_${claimId}_${c.staff_id}" onclick="claimToggleMention(${claimId},${c.staff_id})" style="background:${on?'rgba(251,191,36,.2)':'rgba(255,255,255,.05)'};border:1px solid ${on?'#fbbf24':'rgba(255,255,255,.14)'};color:${on?'#fde68a':'rgba(255,255,255,.6)'};border-radius:14px;padding:.15rem .5rem;font-size:.75rem;cursor:pointer">${c.is_assignee?'★ ':''}${esc(c.name)}</button>`;
    }).join('');

}
function claimToggleMention(claimId, staffId){
  _claimMentionSel[claimId] = _claimMentionSel[claimId] || new Set();
  const on = !_claimMentionSel[claimId].has(staffId);
  if (on) _claimMentionSel[claimId].add(staffId); else _claimMentionSel[claimId].delete(staffId);
  const el = document.getElementById('claimMent_'+claimId+'_'+staffId);
  if (el){ el.style.background = on?'rgba(251,191,36,.2)':'rgba(255,255,255,.05)'; el.style.borderColor = on?'#fbbf24':'rgba(255,255,255,.14)'; el.style.color = on?'#fde68a':'rgba(255,255,255,.6)'; }

async function addNote(claimId, parentNoteId){
  const inputEl = parentNoteId ? document.getElementById('claimReplyInput_'+parentNoteId)
                                : document.getElementById('noteInput_'+claimId);
  const text = ((inputEl && inputEl.value) || '').trim();
  const fileInput = parentNoteId ? null : document.getElementById('claimNoteFiles_'+claimId);
  const files = (fileInput && fileInput.files) ? Array.from(fileInput.files) : [];
  const mentions = parentNoteId ? [] : Array.from(_claimMentionSel[claimId] || []);
  if (!text && !files.length) return;
  const body = { note: text || '📎 attachment' };
  if (parentNoteId) body.parent_note_id = parentNoteId;
  if (mentions.length) body.mentions = mentions;
  const r = await API('/claims/'+claimId+'/notes', {method:'POST', body:JSON.stringify(body)});
  if (!r.ok){ const d=await r.json().catch(()=>({})); alert(d.detail||'Could not add note'); return; }
  const nid = (await r.json()).note_id;
  if (files.length && nid){
    const fd = new FormData();
    files.forEach(f => fd.append('files', f));
    // multipart — use fetch + hdrs() so the browser sets the Content-Type boundary
    try { await fetch('/nidaan/ops/api/claims/'+claimId+'/notes/'+nid+'/attachments', {method:'POST', headers: hdrs(), body: fd}); } catch(e){}
  }
  if (inputEl) inputEl.value='';
  if (!parentNoteId){

}

// Segment filter (subscribers / ₹499 / leads) + search, combined.
const _ACC_SEGS = [['all','All'],['subscriber','Subscribers'],['per_claim','₹499 one-time'],['lead','Leads']];
function renderAccSegBar(){
  const all = window._allAccounts||[];
  const cnt = t => t==='all' ? all.length : all.filter(a=>a.account_type===t).length;
  const bar = document.getElementById('accSegBar'); if(!bar) return;
  bar.innerHTML = _ACC_SEGS.map(([k,label])=>
    `<button class="btn ${(window._accSeg||'all')===k?'btn-primary':'btn-ghost'}" style="font-size:.8rem;padding:.35rem .8rem" onclick="segAccounts('${k}')">${label} (${cnt(k)})</button>`
  ).join('');
}
function segAccounts(seg){ window._accSeg = seg; renderAccSegBar(); applyAccFilters(); }
function filterAccounts(q){ window._accQuery = q; applyAccFilters(); }
function applyAccFilters(){
  const q = (window._accQuery||'').toLowerCase();
  const seg = window._accSeg||'all';
  const list = (window._allAccounts||[]).filter(a=>
    (seg==='all' || a.account_type===seg) &&
    (!q || (a.owner_name||'').toLowerCase().includes(q) ||
      (a.email||'').toLowerCase().includes(q) ||
      (a.firm_name||'').toLowerCase().includes(q) ||
      (a.branch_code||'').toLowerCase().includes(q))
  );
  renderAccounts(list);
}
// Usage/entitlement cell per account type.
function accUsageCell(a){
  if(a.account_type==='subscriber'){
    if(a.claims_cap==null) return '<span style="font-size:.72rem;color:var(--nd-success-text)">∞ unlimited</span>';
    const used=a.claims_used||0, cap=a.claims_cap, pct=cap?Math.min(100,Math.round(used/cap*100)):0;
    const col = used>=cap?'#f87171':(used>=cap*0.7?'#fbbf24':'#22d3ee');
    return `<div style="min-width:92px"><div style="font-size:.72rem;color:var(--nd-text-secondary);margin-bottom:2px">${used}/${cap} claims</div><div style="height:5px;background:var(--nd-bg-surface-3);border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${col}"></div></div></div>`;
  }
  if(a.account_type==='per_claim') return `<span style="font-size:.72rem;color:var(--nd-purple-text)">${a.per_claim_balance||0} left · ${a.per_claim_total||0} bought</span>`;
  return '<span style="color:var(--nd-text-faint)">—</span>';
}
function accTypeBadge(a){
  if(a.account_type==='subscriber'){
    const cap = a.disputed_cap!=null ? ` · ≤₹${Math.round(a.disputed_cap/100000)}L` : '';
    return `<span class="pill-status s-${a.plan}" title="Disputed cap${cap}">${a.plan}${cap}</span>`;
  }
  if(a.account_type==='per_claim') return '<span class="pill-status" style="background:rgba(168,85,247,.18);color:var(--nd-purple-text)">₹499</span>';
  return '<span class="pill-status" style="background:rgba(148,163,184,.18);color:var(--nd-text-secondary)">Lead</span>';
}

// ── Account delete (single + bulk) with a 2-step type-to-confirm guard ─────────
let _accSel = new Set();
function toggleAccSel(id, on){ if(on)_accSel.add(id); else _accSel.delete(id); updateAccBulkBar(); }
function updateAccBulkBar(){
  const bar=document.getElementById('accBulkBar'); if(!bar)return;
  if(_accSel.size){ bar.style.display='flex'; const c=document.getElementById('accSelCount'); if(c)c.textContent=_accSel.size; }
  else bar.style.display='none';
}
function deleteSelectedAccounts(){ if(_accSel.size) confirmDeleteAccounts([..._accSel]); }
function confirmDeleteAccounts(ids){
  const accts=(window._allAccounts||[]).filter(a=>ids.includes(a.account_id) && (a.status||'')!=='deleted');
  if(!accts.length)return;
  const single=accts.length===1;
  const confirmWord=single?((accts[0].owner_name||'').trim()||'DELETE'):'DELETE';
  // Stash on globals so the inline handlers don't have to embed (and break on)
  // names containing quotes/spaces.
  window._delConfirmWord = confirmWord;
  window._delIds = accts.map(a=>a.account_id);
  const listHtml=accts.map(a=>`<li style="margin:.2rem 0">#${a.account_id} — <b>${esc(a.owner_name)}</b> &lt;${esc(a.email)}&gt;</li>`).join('');
  const ov=document.createElement('div');
  ov.id='delModalOv';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10000;display:flex;align-items:center;justify-content:center;padding:1rem';
  ov.innerHTML=`
    <div style="background:var(--nd-bg-base-2);border:1px solid rgba(239,68,68,.45);border-radius:14px;max-width:480px;width:100%;padding:1.5rem">
      <div style="font-size:1.15rem;font-weight:800;color:var(--nd-danger-text);margin-bottom:.5rem">⚠️ Delete ${accts.length} account${accts.length>1?'s':''}?</div>
      <div style="font-size:.85rem;color:var(--nd-text-secondary);margin-bottom:.7rem">This permanently removes their <b>claims, documents and personal data</b> (an anonymised billing record is kept as required by law). <b style="color:var(--nd-danger-text)">This cannot be undone.</b></div>
      <ul style="font-size:.82rem;color:var(--nd-text-primary);max-height:150px;overflow:auto;background:var(--nd-bg-surface);border-radius:8px;padding:.6rem .6rem .6rem 1.6rem;margin:0 0 1rem">${listHtml}</ul>
      <div id="delStep1" style="display:flex;gap:.6rem;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="closeDelModal()">Cancel</button>
        <button class="btn" style="background:#b91c1c;color:#fff" onclick="delStep2()">Continue →</button>
      </div>
      <div id="delStep2" style="display:none">
        <div style="font-size:.82rem;color:var(--nd-text-secondary);margin:.2rem 0 .4rem">Type <b style="color:var(--nd-danger-text)">${esc(confirmWord)}</b> to confirm:</div>
        <input id="delConfirmInput" autocomplete="off" placeholder="${esc(confirmWord)}" style="width:100%;margin-bottom:.85rem" oninput="delCheckConfirm(this)">
        <div style="display:flex;gap:.6rem;justify-content:flex-end">
          <button class="btn btn-ghost" onclick="closeDelModal()">Cancel</button>
          <button id="delFinalBtn" class="btn" style="background:#dc2626;color:#fff" disabled onclick="doDeleteAccounts()">Delete permanently</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);
}
function delStep2(){ document.getElementById('delStep1').style.display='none'; document.getElementById('delStep2').style.display=''; setTimeout(()=>document.getElementById('delConfirmInput').focus(),50); }
function delCheckConfirm(input){ const b=document.getElementById('delFinalBtn'); if(b) b.disabled = (input.value.trim() !== window._delConfirmWord); }
function closeDelModal(){ const o=document.getElementById('delModalOv'); if(o)o.remove(); }
async function doDeleteAccounts(){
  const ids = window._delIds || [];
  if(!ids.length) return;
  const btn=document.getElementById('delFinalBtn'); if(btn){btn.disabled=true;btn.textContent='Deleting…';}
  try {
    if(ids.length===1){
      const r=await API('/accounts/'+ids[0],{method:'DELETE'});
      if(!r.ok){const d=await r.json().catch(()=>({}));alert(d.detail||'Delete failed');}
    } else {
      const r=await API('/accounts/bulk-delete',{method:'POST',body:JSON.stringify({account_ids:ids})});
      if(!r.ok){const d=await r.json().catch(()=>({}));alert(d.detail||'Bulk delete failed');}
    }
  } finally { closeDelModal(); _accSel.clear(); loadAccounts(); }
}

async function doImpersonate(accountId) {
  if (!confirm('Generate a login token for account #'+accountId+'?\n\nThis will be logged. Use only for troubleshooting.')) return;
  const r = await API('/accounts/'+accountId+'/impersonate', {method:'POST'});
  if (!r.ok) { const d=await r.json().catch(()=>({})); alert('Failed: '+_extractErr(d,'Unknown error')); return; }
  const d = await r.json();
  // Store token and open dashboard in new tab
  localStorage.setItem('nidaan_token', d.advisor_token);
  localStorage.setItem('nidaan_plan', d.plan||'free');
  window.open('/nidaan/dashboard', '_blank');
}

async function doImpersonateStaff(staffId) {
  const s = (window._allStaff||[]).find(x=>x.staff_id===staffId);
  if (localStorage.getItem('nidaan_admin_token')) {
    alert('You are already viewing as another staff member. Return to your account first.');
    return;
  }
  if (!confirm('View the portal as '+(s?s.name:'#'+staffId)+'?\n\nThis is logged. You can return to your own account anytime from the banner at the top.')) return;
  const r = await API('/staff/'+staffId+'/impersonate', {method:'POST'});
  if (!r.ok) { const d=await r.json().catch(()=>({})); alert('Failed: '+_extractErr(d,'Unknown error')); return; }
  const d = await r.json();
  // Back up MY admin token so I can return, then switch this tab to the staff view.
  const myToken = localStorage.getItem('nidaan_ops_token');
  localStorage.setItem('nidaan_admin_token', myToken);
  localStorage.setItem('nidaan_admin_name', _staffName || 'my account');
  localStorage.setItem('nidaan_ops_token', d.staff_token);
  location.href = '/admins';   // reload this tab as the staff member
}

// Persistent banner shown whenever you're viewing as another staff member.
function renderImpersonationBanner() {
  const adminTok = localStorage.getItem('nidaan_admin_token');

  if (!bar) {
    bar = document.createElement('div');

    + `<button onclick="stopImpersonating()" style="background:#fff;color:#7c3aed;border:none;`
    + `font-weight:700;padding:.3rem .8rem;border-radius:6px;cursor:pointer;font-size:.82rem">← Return to my account</button>`;
}

function stopImpersonating() {
  const admin = localStorage.getItem('nidaan_admin_token');

    localStorage.removeItem('nidaan_admin_name');

  location.href = '/admins';
}

function closeAccountDrawer() {
  const d = document.getElementById('acctDrawer');
  if (d) d.style.display = 'none';
}

function switchAcctTab(tab) {
  _acctDrawerTab = tab;
  renderAcctDrawer();
}

function renderAcctDrawer() {
  const d = _acctDrawerData;
  if (!d) return;
  const a = d.account;
  const s = d.summary;
  const sub = s.current_sub;

  // Hero summary (always visible — bird's-eye)
  const subBadge = sub
    ? `<span class="pill-status s-${sub.plan||'active'}" style="font-size:.72rem">${esc(sub.plan)} · ${esc(sub.billing_cycle||'quarterly')}</span>`
    : `<span class="pill-status s-cancelled" style="font-size:.72rem">No active sub</span>`;
  const subDetail = sub
    ? `<span style="font-size:.78rem;color:var(--nd-text-muted)">Renews ${esc((sub.current_period_end||'').split('T')[0])} · ₹${fmt(sub.amount_paid||0)}</span>`
    : (s.per_claim_balance > 0
       ? `<span style="font-size:.78rem;color:var(--nd-warning-text)">₹499 per-claim: ${s.per_claim_balance} pending</span>`
       : `<span style="font-size:.78rem;color:var(--nd-text-faint)">Free tier</span>`);

  const hero = `
    <div style="padding:1.5rem 1.75rem 1rem;border-bottom:1px solid var(--nd-border)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap">
        <div style="min-width:0;flex:1">
          <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.3rem">
            <h2 style="font-size:1.3rem;font-weight:800;margin:0">${esc(a.owner_name||'—')}</h2>
            ${subBadge}
            <span class="pill-status s-${a.status||'active'}" style="font-size:.7rem">${esc(a.status||'active')}</span>
          </div>
          <div style="font-size:.85rem;color:var(--nd-text-secondary)">
            ${esc(a.firm_name||'—')} · <a href="mailto:${esc(a.email)}" style="color:var(--nd-cyan-text);text-decoration:none">${esc(a.email)}</a> · ${esc(a.phone||'—')}
          </div>
          <div style="margin-top:.45rem">${subDetail}</div>
        </div>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap;flex-shrink:0">
          ${_role==='super_admin'?`
            <button class="btn-sm btn-ghost" onclick="openEditAccountModal(${a.account_id});closeAccountDrawer()">✏️ Edit</button>
            <button class="btn-sm btn-ghost" onclick="doImpersonate(${a.account_id})">🔑 Login as</button>`:''}
          <button class="btn-sm btn-ghost" onclick="closeAccountDrawer()">✕</button>
        </div>
      </div>

      <!-- Bird's-eye summary cards -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.55rem;margin-top:1rem">
        <div style="background:var(--nd-bg-surface);border:1px solid var(--nd-border);border-radius:8px;padding:.5rem .75rem">
          <div style="font-size:.7rem;color:var(--nd-text-muted);text-transform:uppercase">Claims</div>
          <div style="font-weight:800;font-size:1.15rem">${s.total_claims}</div>
          <div style="font-size:.72rem;color:var(--nd-text-muted)">${s.open_claims} open · ${s.won_claims}W / ${s.lost_claims}L</div>
        </div>
        <div style="background:var(--nd-bg-surface);border:1px solid var(--nd-border);border-radius:8px;padding:.5rem .75rem">
          <div style="font-size:.7rem;color:var(--nd-text-muted);text-transform:uppercase">Open Tasks</div>
          <div style="font-weight:800;font-size:1.15rem;color:${s.open_tasks?'#fbbf24':'#86efac'}">${s.open_tasks}</div>
        </div>
        <div style="background:var(--nd-bg-surface);border:1px solid var(--nd-border);border-radius:8px;padding:.5rem .75rem">
          <div style="font-size:.7rem;color:var(--nd-text-muted);text-transform:uppercase">Paid (LTV)</div>
          <div style="font-weight:800;font-size:1.15rem;color:var(--nd-success-text)">₹${fmt(s.lifetime_paid||0)}</div>
        </div>
        ${s.lifetime_refunded ? `
        <div style="background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.2);border-radius:8px;padding:.5rem .75rem">
          <div style="font-size:.7rem;color:var(--nd-text-muted);text-transform:uppercase">Refunded</div>
          <div style="font-weight:800;font-size:1.15rem;color:var(--nd-danger-text)">-₹${fmt(s.lifetime_refunded)}</div>
        </div>`:''}
      </div>
    </div>`;

  // Tabs
  const tabs = ['summary','purchases','claims','tasks','activity'];
  const labels = {summary:'📊 Summary', purchases:'💳 Purchases', claims:'📋 Claims',
                  tasks:'🗂️ Tasks', activity:'📅 Activity'};
  const tabBar = `
    <div style="display:flex;border-bottom:1px solid var(--nd-border);padding:0 1.75rem;overflow-x:auto;flex-shrink:0">
      ${tabs.map(t => `
        <div onclick="switchAcctTab('${t}')"
             style="padding:.7rem 1rem;cursor:pointer;font-size:.84rem;font-weight:600;
                    border-bottom:2px solid ${_acctDrawerTab===t?'#22d3ee':'transparent'};
                    color:${_acctDrawerTab===t?'#22d3ee':'rgba(255,255,255,.55)'};

  else if (_acctDrawerTab === 'claims') body = _acctTabClaims(d);
  else if (_acctDrawerTab === 'tasks') body = _acctTabTasks(d);
  else if (_acctDrawerTab === 'activity') body = _acctTabActivity(d);

  document.getElementById('acctDrawerBody').innerHTML = `${hero}${tabBar}<div style="padding:1.25rem 1.75rem 2rem">${body}</div>`;
}

    <tr>
      <td><strong>#${s.sub_id}</strong></td>
      <td>${esc(s.plan)}</td>
      <td>${esc(s.billing_cycle||'—')}</td>
      <td>₹${fmt(s.amount_paid||0)}</td>
      <td><span class="pill-status s-${s.status}" style="font-size:.7rem">${esc(s.status)}</span></td>
      <td style="font-size:.75rem">${esc((s.started_at||'').split('T')[0])}</td>
      <td style="font-size:.75rem">${esc((s.current_period_end||'').split('T')[0])}</td>
    </tr>`).join('');
  const purchRows = purchases.map(p => `
    <tr>
      <td><strong>#${p.purchase_id}</strong></td>
      <td>${esc((p.claim_type||'').replace(/_/g,' '))}</td>
      <td>${esc(p.insurer_name||'—')}</td>
      <td>₹${fmt(p.disputed_amount||0)}</td>
      <td>₹${fmt(p.amount_paid||0)}</td>
      <td><span class="pill-status s-${p.status}" style="font-size:.7rem">${esc(p.status)}</span></td>
      <td style="font-size:.75rem">${esc((p.created_at||'').split('T')[0])}</td>
    </tr>`).join('');
  const refundRows = refunds.map(r => `
    <tr>
      <td><strong>#${r.refund_id}</strong></td>
      <td>sub #${r.sub_id||'—'}</td>
      <td>₹${fmt(r.amount||0)}</td>
      <td><span class="pill-status s-${r.status}" style="font-size:.7rem">${esc(r.status)}</span></td>
      <td style="font-size:.75rem">${esc(r.reason||'—')}</td>
      <td style="font-size:.75rem">${esc((r.requested_at||'').split('T')[0])}</td>
    </tr>`).join('');
  return `
    <div style="font-weight:700;font-size:.95rem;margin-bottom:.5rem">Subscriptions (${subs.length})</div>
    ${subs.length ? `<div class="table-wrap"><table><thead><tr><th>#</th><th>Plan</th><th>Cycle</th><th>Amount</th><th>Status</th><th>Started</th><th>Renews</th></tr></thead><tbody>${subRows}</tbody></table></div>` :
                    '<div style="color:var(--nd-text-faint);font-size:.82rem;padding:.5rem">No subscriptions</div>'}

    <div style="font-weight:700;font-size:.95rem;margin-top:1.25rem;margin-bottom:.5rem">Per-Claim Reviews — ₹499 (${purchases.length})</div>
    ${purchases.length ? `<div class="table-wrap"><table><thead><tr><th>#</th><th>Type</th><th>Insurer</th><th>Disputed</th><th>Paid</th><th>Status</th><th>Date</th></tr></thead><tbody>${purchRows}</tbody></table></div>` :
                          '<div style="color:var(--nd-text-faint);font-size:.82rem;padding:.5rem">No per-claim reviews</div>'}

    ${refunds.length ? `
      <div style="font-weight:700;font-size:.95rem;margin-top:1.25rem;margin-bottom:.5rem">Refunds (${refunds.length})</div>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>Sub</th><th>Amount</th><th>Status</th><th>Reason</th><th>Date</th></tr></thead><tbody>${refundRows}</tbody></table></div>`:''}
  `;
}

function _acctTabClaims(d) {
  const claims = d.claims || [];
  if (!claims.length) return '<div style="padding:2rem;text-align:center;color:var(--nd-text-faint)">No claims</div>';
  const rows = claims.map(c => `
    <tr onclick="openClaimDrawer(${c.claim_id});closeAccountDrawer()" style="cursor:pointer">
      <td><strong>#${fmtClaimNum(c.claim_id)}</strong></td>
      <td>${esc(c.insured_name||'—')}</td>
      <td>${esc((c.claim_type||'').replace(/_/g,' '))}</td>
      <td>${esc(c.insurer_name||'—')}</td>
      <td>₹${fmt(c.disputed_amount||0)}</td>
      <td><span class="pill-status s-${c.status}" style="font-size:.7rem">${(c.status||'').replace(/_/g,' ')}</span></td>
      <td>${esc(c.assigned_staff_name||'—')}</td>
      <td style="text-align:center;color:${c.open_tasks?'#fbbf24':'rgba(255,255,255,.4)'};font-weight:${c.open_tasks?'700':'400'}">${c.open_tasks||0}</td>
      <td style="font-size:.75rem;color:var(--nd-text-muted)">${esc((c.created_at||'').split('T')[0])}</td>

  return `<div class="table-wrap"><table>
    <thead><tr><th>#</th><th>Insured</th><th>Type</th><th>Insurer</th><th>Disputed</th><th>Status</th><th>Assigned</th><th>Open Tasks</th><th>Created</th></tr></thead>

function _acctTabTasks(d) {
  const tasks = d.open_tasks || [];
  if (!tasks.length) return '<div style="padding:2rem;text-align:center;color:var(--nd-text-faint)">✓ No open tasks across this account\'s claims</div>';
  return tasks.map(t => `
    <div onclick="openClaimDrawer(${t.claim_id});closeAccountDrawer()"
         style="padding:.7rem 1rem;background:var(--nd-bg-surface);border:1px solid var(--nd-border);border-radius:8px;margin-bottom:.5rem;cursor:pointer">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem">
        <div style="flex:1;min-width:0">
          <div style="font-size:.88rem;font-weight:600">${esc(t.title||'Task')}</div>
          <div style="font-size:.76rem;color:var(--nd-text-muted);margin-top:.2rem">
            <a style="color:var(--nd-cyan-text)">#${fmtClaimNum(t.claim_id)}</a> · ${esc((t.status_slug||'').replace(/_/g,' '))}
            ${t.assignee_name?` · @ ${esc(t.assignee_name)}`:''}
            ${t.priority && t.priority !== 'normal'?` · <b style="color:var(--nd-warning-text)">${esc(t.priority)}</b>`:''}
          </div>
        </div>
        ${t.sla_due_at ? `<div style="font-size:.74rem;color:${ndUI.parseServerTime(t.sla_due_at)<new Date()?'#fbbf24':'rgba(255,255,255,.5)'};white-space:nowrap">due ${esc((t.sla_due_at||'').split('T')[0])}</div>`:''}
      </div>
    </div>`).join('');
}

function _acctTabActivity(d) {
  return _renderTimeline(d.timeline || [], false);
}

function _renderTimeline(items, compact) {
  if (!items.length) return '<div style="padding:1.5rem;text-align:center;color:var(--nd-text-faint);font-size:.85rem">No recent activity</div>';
  return items.map(it => {
    const icon = it.kind==='status' ? '🔄' : it.kind==='note' ? '💬' : it.kind==='payment' ? '💳' : '•';
    const title = it.kind==='status'
      ? `Status: ${esc((it.from_status||'—').replace(/_/g,' '))} → ${esc((it.to_status||'').replace(/_/g,' '))}`
      : it.kind==='note' ? 'Note added'
      : it.kind==='payment' ? `Payment · ${esc(it.detail||'')}`
      : '';
    const claimRef = it.claim_id
      ? `<a onclick="event.stopPropagation();openClaimDrawer(${it.claim_id});closeAccountDrawer()" style="color:var(--nd-cyan-text);cursor:pointer">#${fmtClaimNum(it.claim_id)} ${esc(it.insured_name||'')}</a>`
      : '';
    const detail = it.kind === 'note' && it.detail ? `<div style="font-size:.78rem;color:var(--nd-text-muted);margin-top:.2rem">${esc(it.detail).substring(0,200)}${it.detail.length>200?'…':''}</div>` : '';
    return `
      <div style="display:flex;gap:.6rem;padding:.55rem .65rem;border-bottom:1px solid var(--nd-border)">
        <div style="font-size:1rem;flex-shrink:0">${icon}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:.82rem">${title} ${claimRef ? ' · ' + claimRef : ''}</div>
          ${detail}
          <div style="font-size:.7rem;color:var(--nd-text-faint);margin-top:.15rem">
            ${esc((it.ts||'').replace('T',' ').substring(0,16))}${it.staff_name?` · ${esc(it.staff_name)}`:''}
          </div>
        </div>
      </div>`;
  }).join('');
}

async function viewClaimDocs(claimId, btn) {
  // Toggle: if docs already showing below this row, close them
  const existingRow = document.getElementById('docsRow_' + claimId);
  if (existingRow) { existingRow.remove(); btn.textContent = '📎 View'; return; }
  btn.textContent = '⏳';
  try {
    const r = await API('/claims/' + claimId + '/documents');
    const d = await r.json().catch(()=>({docs:[]}));
    const td = btn.closest('tr');
    const colCount = td.cells.length;
    const newRow = document.createElement('tr');
    newRow.id = 'docsRow_' + claimId;
    newRow.style.cssText = 'background:rgba(59,130,246,.06)';
    newRow.innerHTML = `<td colspan="${colCount}" style="padding:.75rem 1rem">
      <div style="font-size:.78rem;font-weight:700;color:var(--nd-text-muted);margin-bottom:.4rem">📎 DOCUMENTS FOR CLAIM #${fmtClaimNum(claimId)}</div>
      ${d.docs && d.docs.length > 0
        ? d.docs.map(f=>`<div style="margin:.25rem 0;display:flex;align-items:center;gap:.4rem">📄 <a href="${f.url}" target="_blank" style="color:var(--nd-info-text);text-decoration:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.original_name)}</a> <span style="opacity:.4;font-size:.75rem;white-space:nowrap">(${(f.file_size/1024).toFixed(0)} KB · ${f.uploaded_at?f.uploaded_at.slice(0,10):''})</span>${f.doc_id?`<button onclick="opsDeleteClaimDoc(${claimId},${f.doc_id},this)" title="Delete this document" style="background:none;border:none;color:var(--nd-danger-text);cursor:pointer;font-size:.9rem;padding:0 .2rem">🗑</button>`:''}</div>`).join('')
        : '<span style="color:var(--nd-text-faint);font-size:.82rem">No documents uploaded for this claim yet.</span>'
      }
    </td>`;
    td.insertAdjacentElement('afterend', newRow);
    btn.textContent = '📎 Close';
  } catch(e) {
    btn.textContent = '📎 View';
  }
}
