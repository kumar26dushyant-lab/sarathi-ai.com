function _editOverlay(title, innerHtml){
  const ov=document.createElement('div'); ov.id='editEntityOv';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:10002;display:flex;align-items:center;justify-content:center;padding:1rem;overflow-y:auto';
  ov.innerHTML='<div style="background:var(--nd-bg-base-2);border:1px solid var(--nd-border-strong);border-radius:14px;max-width:440px;width:100%;padding:1.2rem;max-height:90vh;overflow-y:auto">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem"><b style="font-size:1.05rem">'+title+'</b><button onclick="document.getElementById(\'editEntityOv\').remove()" style="background:none;border:none;color:var(--nd-text-muted);font-size:1.4rem;cursor:pointer">×</button></div>'
    +innerHtml+'</div>';
  document.body.appendChild(ov);
}
function _efInput(label, id, val, type){
  return '<label style="display:block;margin-bottom:.6rem;font-size:.8rem;color:var(--nd-text-secondary)">'+label
    +'<input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val==null?'':String(val))+'" style="width:100%;box-sizing:border-box;margin-top:.2rem;background:var(--nd-bg-surface-2);border:1px solid var(--nd-border-strong);color:var(--nd-text-primary);padding:.5rem .6rem;border-radius:8px;font-size:.9rem"></label>';
}
async function editClaimInfoModal(claimId){
  const r=await API('/claims/'+claimId); if(!r.ok){ alert('Could not load claim'); return; }
  const c=await r.json();
  const std=['health','life','motor','general']; let opts=std.slice();
  if(c.claim_type && std.indexOf(c.claim_type)<0) opts.unshift(c.claim_type);
  const typeOpts=opts.map(t=>'<option value="'+esc(t)+'"'+((c.claim_type||'')===t?' selected':'')+'>'+esc(t)+'</option>').join('');
  _editOverlay('Edit Claim #'+fmtClaimNum(claimId),
    _efInput('Insured name','ecName',c.insured_name)
    +_efInput('Phone','ecPhone',c.insured_phone)
    +_efInput('Email','ecEmail',c.insured_email)
    +'<label style="display:block;margin-bottom:.6rem;font-size:.8rem;color:var(--nd-text-secondary)">Claim type<select id="ecType" style="width:100%;box-sizing:border-box;margin-top:.2rem;background:var(--nd-bg-surface-2);border:1px solid var(--nd-border-strong);color:var(--nd-text-primary);padding:.5rem;border-radius:8px">'+typeOpts+'</select></label>'
    +_efInput('Insurer','ecInsurer',c.insurer_name)
    +_efInput('Policy no.','ecPolicy',c.policy_no)
    +_efInput('Disputed amount ₹','ecAmount',c.disputed_amount,'number')
    +'<div id="ecMsg" style="font-size:.82rem;margin:.3rem 0"></div>'
    +'<button class="btn btn-primary" style="width:100%" onclick="saveClaimInfo('+claimId+')">💾 Save changes</button>');
}
async function saveClaimInfo(claimId){
  const g=id=>document.getElementById(id); const msg=g('ecMsg');
  const body={ insured_name:(g('ecName').value||'').trim(), insured_phone:(g('ecPhone').value||'').trim(),
    insured_email:(g('ecEmail').value||'').trim(), claim_type:g('ecType').value,
    insurer_name:(g('ecInsurer').value||'').trim(), policy_no:(g('ecPolicy').value||'').trim() };
  const amt=(g('ecAmount').value||'').trim(); if(amt!=='') body.disputed_amount=parseInt(amt,10);
  if(msg){msg.style.color='#94a3b8';msg.textContent='Saving…';}
  const r=await API('/claims/'+claimId+'/info',{method:'PATCH',body:JSON.stringify(body)});
  if(r.ok){ const ov=g('editEntityOv'); if(ov)ov.remove(); openClaimDrawer(claimId); try{ndUI.toast('Claim updated','success');}catch(e){} }
  else { const d=await r.json().catch(()=>({})); if(msg){msg.style.color='#f87171';msg.textContent='✕ '+(d.detail||'Failed');} }
}
async function editAdvisorModal(claimId){
  const r=await API('/claims/'+claimId); if(!r.ok){ alert('Could not load claim'); return; }

    const descSnip  = rv.brief_description ? rv.brief_description.substring(0,80) + (rv.brief_description.length > 80 ? '…' : '') : '';

    <div class="rv-card" id="rv-card-${rv.purchase_id}" style="border:1px solid var(--nd-border-strong);border-radius:10px;padding:.85rem 1rem;margin-bottom:.7rem;background:var(--nd-bg-surface)">

            <a href="mailto:${userEmail}" style="color:var(--nd-cyan-text);text-decoration:none">${userEmail}</a> · ${userPhone}
          </div>
          <div style="font-size:.8rem;margin-top:.3rem;color:var(--nd-text-muted)">
            <b>${esc(rv.claim_type||'—').replace(/_/g,' ')}</b> · ${esc(rv.insurer_name||'—')} · ₹${fmt(rv.disputed_amount||0)} disputed
          </div>
          ${descSnip ? `<div style="font-size:.78rem;color:var(--nd-text-faint);margin-top:.2rem">${esc(descSnip)}</div>` : ''}

async function toggleRvDetails(purchaseId) {
  const detail = document.getElementById(`rv-detail-${purchaseId}`);
  if (!detail) return;
  const isOpen = detail.style.display !== 'none';
  detail.style.display = isOpen ? 'none' : '';
  if (!isOpen) {
    // Load documents
    const docsEl = document.getElementById(`rv-docs-${purchaseId}`);
    try {
      const r = await API(`/review-requests/${purchaseId}/documents`);
      if (r.ok) {
        const d = await r.json();
        const docs = d.docs || [];
        if (docs.length) {
          docsEl.innerHTML = `<span style="opacity:.45">Documents</span><br>` +
            docs.map(doc => `<div style="margin-top:.3rem"><a href="${esc(doc.url)}" target="_blank" style="color:var(--nd-cyan-text);text-decoration:none">📄 ${esc(doc.original_name)}</a> <span style="opacity:.35">(${(doc.file_size/1024).toFixed(0)} KB)</span></div>`).join('');
        } else {
          docsEl.innerHTML = `<span style="opacity:.45">Documents</span><br><span style="color:var(--nd-text-disabled)">No documents uploaded</span>`;
        }
      }
    } catch(_) {
      docsEl.innerHTML = `<span style="opacity:.45">Documents</span><br><span style="color:var(--nd-text-disabled)">Could not load</span>`;
    }
  }
}

function openUpdateReviewModal(purchaseId, currentStatus) {
  const nextStatuses = REVIEW_STATUS_ORDER.filter(s => s !== currentStatus);
  openModal('Update Review #'+purchaseId, `
    <div class="form-field"><label>New Status</label>
      <select id="rv-new-status" class="form-input" onchange="toggleFindingsField()">
        ${nextStatuses.map(s=>`<option value="${s}">${REVIEW_STATUS_LABELS[s]}</option>`).join('')}
      </select>
    </div>
    <div class="form-field" id="rv-findings-wrap" style="display:none">
      <label>Findings / Review Notes <span style="color:var(--nd-danger-text)">(required for Review Completed)</span></label>
      <textarea id="rv-findings" class="form-input" rows="4" placeholder="Enter findings shared with customer…"></textarea>
    </div>
    <div class="form-field">
      <label>Internal Note (optional)</label>
      <textarea id="rv-note" class="form-input" rows="2" placeholder="Internal note for ops team…"></textarea>
    </div>
    <div id="rv-modal-docs" style="margin-top:.6rem;padding:.6rem .75rem;background:var(--nd-bg-surface);border-radius:7px;font-size:.8rem">
      <div style="opacity:.45;margin-bottom:.3rem">Uploaded Documents</div>
      <div id="rv-modal-docs-list" style="color:var(--nd-text-faint)">Loading…</div>
    </div>
    <div class="msg" id="rv-msg"></div>`,
    [{label:'Cancel',cls:'btn-ghost',fn:closeModal},
     {label:'Update Status',cls:'btn-primary',fn:()=>submitReviewUpdate(purchaseId)}]
  );
  toggleFindingsField();
  // Load documents async into modal
  API(`/review-requests/${purchaseId}/documents`).then(async r => {
    const docsEl = document.getElementById('rv-modal-docs-list');
    if (!docsEl) return;
    if (!r.ok) { docsEl.textContent = 'Could not load'; return; }
    const d = await r.json();
    const docs = d.docs || [];
    if (!docs.length) { docsEl.textContent = 'No documents uploaded yet'; return; }
    docsEl.innerHTML = docs.map(doc =>
      `<div><a href="${esc(doc.url)}" target="_blank" style="color:var(--nd-cyan-text);text-decoration:none">📄 ${esc(doc.original_name)}</a> <span style="opacity:.35">(${(doc.file_size/1024).toFixed(0)} KB)</span></div>`
    ).join('');
  }).catch(() => {
    const docsEl = document.getElementById('rv-modal-docs-list');
    if (docsEl) docsEl.textContent = 'Could not load';
  });
}

function toggleFindingsField() {
  const sel = document.getElementById('rv-new-status');
  const wrap = document.getElementById('rv-findings-wrap');
  if (sel && wrap) wrap.style.display = sel.value === 'review_completed' ? '' : 'none';
}

async function submitReviewUpdate(purchaseId) {
  const newStatus = document.getElementById('rv-new-status').value;
  const findings  = (document.getElementById('rv-findings')?.value || '').trim();
  const note      = (document.getElementById('rv-note')?.value || '').trim();
  const msg       = document.getElementById('rv-msg');
  if (newStatus === 'review_completed' && !findings) {
    msg.className='msg err'; msg.textContent='Findings note is required for Review Completed'; return;
  }
  const body = {new_status: newStatus, note, findings_note: findings};
  const r = await API('/review-requests/'+purchaseId+'/status', {method:'PATCH', body:JSON.stringify(body)});
  if (r.ok) { msg.className='msg ok'; msg.textContent='Status updated ✓'; setTimeout(()=>{closeModal();loadReviews();},900); }
  else { const d=await r.json().catch(()=>({})); msg.className='msg err'; msg.textContent=_extractErr(d,'Update failed'); }
}

// Normalise to a clean 10-digit Indian mobile (strips +91/0), else null —
// mirrors the server so a malformed number is rejected, never truncated.
function _normMobile(raw){
  let d=(raw||'').replace(/\D/g,'');
  if(d.length===12&&d.startsWith('91')) d=d.slice(2);
  else if(d.length===11&&d.startsWith('0')) d=d.slice(1);
  return (d.length===10 && '6789'.includes(d[0])) ? d : null;
}

// ── Live input restrictions (prevent bad data at the keystroke) ──────────────
// Mobile: keep digits only, transparently drop a pasted +91/0 prefix, cap at 10.
function _liveMobile(el){
  let d=el.value.replace(/\D/g,'');
  if(d.length>10){ if(d.startsWith('91')) d=d.slice(2); else if(d.startsWith('0')) d=d.slice(1); }
  el.value=d.slice(0,10);
  // green tick once it's a valid 10-digit mobile
  const ok=(el.value.length===10 && '6789'.includes(el.value[0]));
  el.style.borderColor = el.value.length ? (ok?'rgba(34,197,94,.6)':'rgba(248,113,113,.6)') : '';
}
// Login ID: lowercase, only [a-z0-9._-], and refresh the @nidaanpartner.com preview.
function onLoginIdInput(el){
  el.value=el.value.toLowerCase().replace(/[^a-z0-9._-]/g,'');
  const p=document.getElementById('ns-emailpreview');
  if(p) p.textContent = el.value ? el.value+'@nidaanpartner.com' : '—';
}
// Email: strip whitespace; tint border by validity.
function _liveEmail(el){
  el.value=el.value.replace(/\s/g,'');
  const ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(el.value);
  el.style.borderColor = el.value.length ? (ok?'rgba(34,197,94,.6)':'rgba(248,113,113,.6)') : '';
}

async function createStaff() {
  const userpart = document.getElementById('ns-emailuser').value.trim().toLowerCase();
  const email = userpart ? userpart + '@nidaanpartner.com' : '';
  const phone = _normMobile(document.getElementById('ns-phone').value);
  const notify_email = (document.getElementById('ns-notifyemail').value||'').trim().toLowerCase();
  const msg=document.getElementById('ns-msg');
  if(!document.getElementById('ns-name').value.trim()||!userpart||!document.getElementById('ns-pwd').value){msg.className='msg err';msg.textContent='All fields required';return;}
  if(!phone){msg.className='msg err';msg.textContent='Enter a valid 10-digit Indian mobile number (for notifications)';return;}
  const body={name:document.getElementById('ns-name').value.trim(),email,password:document.getElementById('ns-pwd').value,role:document.getElementById('ns-role').value,phone,notify_email};
  if(notify_email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(notify_email)){msg.className='msg err';msg.textContent='Enter a valid notification email (or leave blank)';return;}
  if(!/^[a-z0-9._-]+$/.test(userpart)){msg.className='msg err';msg.textContent='Email username: only letters, numbers, dots, hyphens';return;}
  const r=await API('/staff',{method:'POST',body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(r.ok){msg.className='msg ok';msg.textContent='Account created ✓ — Login: '+email;setTimeout(()=>{closeModal();loadStaff();},1800);}
  else{msg.className='msg err';msg.textContent=_extractErr(d,'Failed');}
}

async function saveStaff(staffId) {
  const body={name:document.getElementById('es-name').value.trim(),role:document.getElementById('es-role').value};
  const _phRaw=(document.getElementById('es-phone').value||'').trim();
  if(_phRaw){
    const _ph=_normMobile(_phRaw);
    if(!_ph){document.getElementById('es-msg').className='msg err';document.getElementById('es-msg').textContent='Enter a valid 10-digit Indian mobile number';return;}
    body.phone=_ph;
  }
  const _ne=(document.getElementById('es-notifyemail').value||'').trim().toLowerCase();
  if(_ne && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(_ne)){document.getElementById('es-msg').className='msg err';document.getElementById('es-msg').textContent='Enter a valid notification email (or leave blank)';return;}
  body.notify_email=_ne;
  const pwd=document.getElementById('es-pwd').value;
  if(pwd){if(pwd.length<8){document.getElementById('es-msg').className='msg err';document.getElementById('es-msg').textContent='Password min 8 chars';return;}body.password=pwd;}
  const r=await API('/staff/'+staffId,{method:'PATCH',body:JSON.stringify(body)});
  if(r.ok){setTimeout(()=>{closeModal();loadStaff();},800);}
  else{const d=await r.json().catch(()=>({}));document.getElementById('es-msg').className='msg err';document.getElementById('es-msg').textContent=_extractErr(d,'Failed');}
}

  await API('/staff/'+staffId,{method:'PATCH',body:JSON.stringify({status:'inactive'})});

}

async function reactivateStaff(staffId) {

async function toggleStaffTg(staffId, currentlyAllowed){
  const enable = !currentlyAllowed;
  if(!enable && !confirm('Disable Telegram for this staffer? They will be password-only and any linked Telegram devices will be unlinked. (Use this for third-party staff.)')) return;
  const r = await API('/staff/'+staffId+'/telegram-access',{method:'PATCH',body:JSON.stringify({allowed:enable})});

async function savePlanConfig(planKey) {
  const cardEl = document.querySelector(`.pcfg-card[data-plan="${planKey}"]`);
  if (!cardEl) return;
  const msg = cardEl.querySelector('.pcfg-msg');
  const _num = sel => { const v = (cardEl.querySelector(sel).value || '').trim(); return v === '' ? -1 : parseInt(v); };  // blank = ∞ (-1)
  // Price: RUPEES. A change applies to NEW checkouts only — confirm the grandfather rule.
  const priceEl = cardEl.querySelector('.pcfg-price');
  const newPrice = parseInt((priceEl.value || '').trim(), 10);
  const origPrice = parseInt(priceEl.getAttribute('data-orig'), 10);
  if (!newPrice || newPrice < 1) { msg.style.color = '#f87171'; msg.textContent = '✕ Price must be ≥ ₹1'; return; }
  if (newPrice !== origPrice &&
      !confirm(`Change ${planKey} price from ₹${origPrice} to ₹${newPrice}?\n\n` +
               `This applies to NEW subscriptions only. Existing subscribers keep ₹${origPrice} ` +
               `until they change plans — they are not re-charged.`)) {
    msg.textContent = ''; return;
  }
  const body = {
    label: (cardEl.querySelector('.pcfg-label').value || '').trim(),
    price: newPrice,
    claims_per_month: _num('.pcfg-claims'),
    disputed_cap: _num('.pcfg-cap'),
    max_users: _num('.pcfg-users'),
    badge: (cardEl.querySelector('.pcfg-badge').value || '').trim(),
    active: cardEl.querySelector('.pcfg-active').checked,
    features: (cardEl.querySelector('.pcfg-features').value || '').split('\n').map(s => s.trim()).filter(Boolean).slice(0, 12),
  };
  msg.style.color = '#94a3b8'; msg.textContent = 'Saving…';
  const r = await API('/plans-config/' + encodeURIComponent(planKey), { method: 'PATCH', body: JSON.stringify(body) });
  if (r.ok) { msg.style.color = '#4ade80'; msg.textContent = '✓ Saved'; setTimeout(() => { msg.textContent = ''; }, 2500); }
  else { const d = await r.json().catch(() => ({})); msg.style.color = '#f87171'; msg.textContent = '✕ ' + (d.detail || 'Failed'); }
}

// Format a stored (UTC) timestamp as IST date + time (for chat timestamps).
function fmtDateTime(s){
  if(!s) return '';
  var iso = String(s).replace(' ', 'T');
  if(!/[Zz]|[+-]\d\d:?\d\d$/.test(iso)) iso += 'Z';
  var d = new Date(iso); if(isNaN(d.getTime())) return String(s).slice(0,16);
  try { return d.toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit', hour12:true, timeZone:'Asia/Kolkata'}); }
  catch(e){ return String(s).slice(0,16); }
}

async function sendSupportReply(id){
  const inp = document.getElementById('supReplyInput');
  const msg = (inp.value||'').trim();
  if (!msg) return;
  const r = await API('/support/threads/'+id+'/reply', {method:'POST', body: JSON.stringify({message:msg})});

  openSupportThread(id);  // reload the thread with the new reply

async function exportCSV(table){
  try {
    const r = await fetch('/nidaan/ops/api/export/'+table+'.csv', { headers: hdrs() });
    if (!r.ok){ const d=await r.json().catch(()=>({})); ndUI.toast(d.detail||'Export failed','error'); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'nidaan_'+table+'_'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    ndUI.toast('Exported '+table+' ✓','success');
  } catch(e){ ndUI.toast('Export error','error'); }
}

// ── Universal column sorting: click any table header to sort its rows (asc/desc). Works on
// every ops table (claims, tasks, staff, accounts, branches, support, …) via event delegation —
// no per-table wiring. Detects numbers (incl. ₹/commas), dates, else text. Mobile: tap the header.
(function(){
  try{
    var st=document.createElement('style');
    st.textContent='.table-wrap th{cursor:pointer;user-select:none;white-space:nowrap}'
      +'.table-wrap th:hover{color:#67e8f9}'
      +'.sort-ind{margin-left:.3rem;opacity:.75;font-size:.8em}';
    document.head.appendChild(st);
  }catch(e){}
  function cellVal(row, idx){ var c=row.cells[idx]; return c ? (c.innerText||c.textContent||'').trim() : ''; }
  function parseVal(t){
    if(t==='' || t==='—') return {n:null, s:''};
    var cleaned=t.replace(/[₹,\s]/g,'');
    if(/^-?\d+(\.\d+)?%?$/.test(cleaned)){ var n=parseFloat(cleaned); if(!isNaN(n)) return {n:n, s:t.toLowerCase()}; }
    var d=Date.parse(t); if(!isNaN(d) && /\d{4}|\d{1,2}[\/\-\s][A-Za-z]/.test(t)) return {n:d, s:t.toLowerCase()};
    return {n:null, s:t.toLowerCase()};
  }
  document.addEventListener('click', function(e){
    var th=e.target.closest ? e.target.closest('th') : null;
    if(!th) return;
    var table=th.closest('table'); if(!table || !table.tBodies || !table.tBodies.length) return;
    if(!th.closest('.table-wrap')) return;                 // only our data tables
    var headRow=th.parentNode; var idx=Array.prototype.indexOf.call(headRow.children, th);
    var tbody=table.tBodies[0];
    var rows=Array.prototype.filter.call(tbody.rows, function(r){ return r.cells.length>idx && !r.hasAttribute('data-noSort'); });
    if(rows.length<2) return;
    var dir = th.getAttribute('data-sort-dir')==='asc' ? 'desc' : 'asc';
    Array.prototype.forEach.call(headRow.children, function(h){ if(h!==th){ h.removeAttribute('data-sort-dir'); var i=h.querySelector('.sort-ind'); if(i) i.remove(); }});
    th.setAttribute('data-sort-dir', dir);
    rows.sort(function(a,b){
      var va=parseVal(cellVal(a,idx)), vb=parseVal(cellVal(b,idx)), r;
      if(va.n!==null && vb.n!==null) r = va.n-vb.n;
      else if(va.n!==null) r=-1; else if(vb.n!==null) r=1;
      else r = va.s<vb.s?-1:(va.s>vb.s?1:0);
      return dir==='asc'? r : -r;
    });
    rows.forEach(function(r){ tbody.appendChild(r); });
    var ind=th.querySelector('.sort-ind'); if(!ind){ ind=document.createElement('span'); ind.className='sort-ind'; th.appendChild(ind); }
    ind.textContent = dir==='asc'?'▲':'▼';
  });
})();
function esc(s){ if(!s&&s!==0)return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ if(!n&&n!==0)return '0'; return Number(n).toLocaleString('en-IN'); }
function fmtClaimNum(id){ if (id == null || id === '') return '—'; return String(id).padStart(3, '0'); }
function fmtDate(s){
  if(!s)return '—';
  try{
    const d = (window.ndUI && ndUI.parseServerTime) ? ndUI.parseServerTime(s) : new Date(s);
    if(!d) return s;
    return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  }catch{return s;}
}

// Deep links from notifications (WhatsApp/email): /nidaan/ops?qt=<id> opens the
// quick-task drawer; ?task=<id> jumps to the Tasks panel.
function _handleDeepLink(){
  try {
    const p = new URLSearchParams(location.search);
    const qt = p.get('qt');
    const task = p.get('task');
    const leave = p.get('leave');
    const account = p.get('account');
    const claim = p.get('claim');
    // CRITICAL: strip the deep-link params from the URL immediately so a reload
    // or panel navigation doesn't re-open the same task over and over
    // (the "task keeps popping up" bug). We act on the value we already captured.
    if (qt || task || leave || account || claim) {
      try { history.replaceState({panel:_currentPanel}, '', location.pathname + (location.hash||'')); } catch(e){}
    }
    if (qt && /^\d+$/.test(qt)) {
      setTimeout(()=>{ try{ openQuickTaskDrawer(parseInt(qt,10)); }catch(e){} }, 350);
    } else if (account && /^\d+$/.test(account)) {
      // From a signup / new-claim / lead alert → open the subscriber's account.
      setTimeout(()=>{ try{ openAccountDrawer(parseInt(account,10)); }catch(e){} }, 350);
    } else if (task && /^\d+$/.test(task)) {
      setTimeout(()=>{ try{ showPanel('claims'); }catch(e){} }, 350);
    } else if (claim && /^\d+$/.test(claim)) {
      setTimeout(()=>{ try{ showPanel('claims'); }catch(e){} }, 350);
    } else if (leave && /^\d+$/.test(leave)) {
      setTimeout(()=>{ try{ showPanel('tasks'); }catch(e){} }, 350);
    }
  } catch(e){}
}

function _urlB64ToUint8(base64){
  const pad = '='.repeat((4 - base64.length % 4) % 4);
  const b64 = (base64 + pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(b64); const out = new Uint8Array(raw.length);
  for (let i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
  return out;
}

async function togglePush(){
  if (!_pushSupported()){ ndUI.toast('Push not supported here','error'); return; }
  if (Notification.permission === 'denied'){ _showPushHelp(); return; }   // can't override a block — guide instead
  const existing = await _currentPushSub();
  if (existing){
    try {
      await fetch('/nidaan/ops/api/push/unsubscribe',{method:'POST',headers:{...hdrs(),'Content-Type':'application/json'},body:JSON.stringify({endpoint:existing.endpoint})});
      await existing.unsubscribe();
      ndUI.toast('Push alerts turned off','success');
    } catch(e){}
    refreshPushRow(); return;
  }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted'){ ndUI.toast('Permission not granted','error'); refreshPushRow(); return; }
    const kr = await fetch('/nidaan/ops/api/push/vapid-key',{headers:hdrs()});
    const {key} = await kr.json();
    if (!key){ ndUI.toast('Push not configured on server','error'); return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:_urlB64ToUint8(key)});
    await fetch('/nidaan/ops/api/push/subscribe',{method:'POST',headers:{...hdrs(),'Content-Type':'application/json'},body:JSON.stringify(sub)});
    ndUI.toast('🔔 Push alerts enabled on this device','success');
    // fire a confirmation push
    fetch('/nidaan/ops/api/push/test',{method:'POST',headers:hdrs()}).catch(()=>{});
  } catch(e){ ndUI.toast('Could not enable push','error'); }
  refreshPushRow();
}

async function loadTasksKanban(){
  // Panel removed in Phase 5 — kanban now reached via Overview drill-in.
  // Legacy callers (task drawer refreshes) fall back to refreshing the
  // currently-open Claim drawer's per-claim task list.
  const panel = document.getElementById('panel-tasks');
  if (!panel) {
    // Refresh in-place if a claim drawer is open and visible
    const drawerBg = document.getElementById('drawerBg');
    if (drawerBg && drawerBg.classList.contains('open')) {
      // Find any open claimTasksArea_* element and reload it
      const areas = document.querySelectorAll('[id^="claimTasksArea_"]');
      areas.forEach(a => {
        const cid = parseInt(a.id.replace('claimTasksArea_',''));
        if (cid) loadClaimTasks(cid);
      });

    return;
  }
  panel.innerHTML = '<div style="padding:1.5rem">Loading…</div>';
  const [statuses, assignees] = await Promise.all([_loadStatusesOnce(), _loadAssigneesOnce()]);

  const groups = await r.json();
  const showCreate = (_role === 'super_admin' || _role === 'sub_super_admin');
  let html = `
    <div style="padding:1.25rem 1.5rem 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem">
      <div>
        <h1 style="font-size:1.4rem;font-weight:800">🗂️ Task Pipeline</h1>

    </div>
    <div style="padding:1rem 1.5rem 2rem;overflow-x:auto;-webkit-overflow-scrolling:touch">
      <div class="kanban-grid">`;
  STAGES.forEach(stage => {

    html += `

          <span>${esc(stage.label)}</span>
          <span class="kanban-col-count">${tasks.length}</span>

let _currentTaskId = null;

// Render task notes as a 1-level threaded discussion.
// Notes with parent_note_id nest under their parent; deeper replies are
// flattened to the same level (enforced server-side too).
function _renderTaskThread(notes, taskId, canComment){
  if (!notes || !notes.length) {
    return '<div style="color:var(--nd-text-faint);font-size:.85rem">No comments yet — say something to kick things off.</div>';
  }
  const roleColors = {super_admin:'#a78bfa', sub_super_admin:'#22d3ee', team_member:'#86efac'};
  const roleLabel = {super_admin:'SA', sub_super_admin:'ADMIN', team_member:'ASSOC'};
  const byParent = {};
  const roots = [];
  notes.forEach(n => {
    if (n.parent_note_id) {
      (byParent[n.parent_note_id] = byParent[n.parent_note_id] || []).push(n);
    } else {
      roots.push(n);
    }
  });
  const renderNote = (n, isReply) => {
    const color = roleColors[n.staff_role] || '#94a3b8';
    const label = roleLabel[n.staff_role] || 'STAFF';
    return `
      <div style="${isReply?'margin-left:1.25rem;border-left:2px solid '+color+'33;padding-left:.6rem':''};margin-bottom:.6rem">
        <div style="font-size:.74rem;color:var(--nd-text-muted)">
          <span style="color:${color};font-weight:700">[${label}]</span>
          <b style="color:var(--nd-text-primary)">${esc(n.staff_name||'Staff')}</b> · ${ndUI.timeAgo(n.created_at)}
        </div>
        <div style="font-size:.88rem;margin-top:.15rem;white-space:pre-wrap">${esc(n.note)}</div>
        ${n.note_translation ? `<div style="font-size:.8rem;margin-top:.25rem;color:var(--nd-info-text);background:rgba(59,130,246,.08);border-left:2px solid rgba(59,130,246,.45);padding:.2rem .55rem;border-radius:0 5px 5px 0">🌐 English (auto): ${esc(n.note_translation)}</div>` : ''}
        ${(!isReply && canComment) ? `
          <button onclick="toggleReply(${n.note_id})"
                  style="font-size:.72rem;background:transparent;border:none;color:rgba(34,211,238,.85);cursor:pointer;padding:.15rem 0;margin-top:.15rem">↩ Reply</button>
          <div id="replyBox_${n.note_id}" style="display:none;margin-top:.3rem">
            <input id="replyInput_${n.note_id}" placeholder="Reply to ${esc((n.staff_name||'').split(' ')[0])}…"
                   onkeydown="if(event.key==='Enter')addTaskNote(${taskId},${n.note_id})"
                   style="width:calc(100% - 60px);background:var(--nd-bg-surface);border:1px solid var(--nd-border-strong);color:var(--nd-text-primary);padding:.4rem .55rem;border-radius:6px;font-size:.82rem">
            <button onclick="addTaskNote(${taskId},${n.note_id})"
                    style="margin-left:.3rem;background:rgba(34,211,238,.18);border:1px solid rgba(34,211,238,.3);color:var(--nd-cyan-text);padding:.4rem .65rem;border-radius:6px;font-size:.78rem;cursor:pointer">Send</button>
          </div>` : ''}
        ${(byParent[n.note_id]||[]).map(c => renderNote(c, true)).join('')}
      </div>`;
  };
  return roots.map(n => renderNote(n, false)).join('');
}

function toggleReply(noteId){
  const box = document.getElementById('replyBox_'+noteId);
  if (!box) return;
  const show = box.style.display === 'none';
  box.style.display = show ? 'block' : 'none';
  if (show) setTimeout(() => document.getElementById('replyInput_'+noteId)?.focus(), 30);
}

      </div>

      ${trans.length && canEdit ? `

        </div>

      ${isAdmin ? `

          <button class="nd-btn nd-btn-sm nd-btn-secondary" onclick="addTaskNote(${task.task_id})">Send</button>

async function taskTransition(taskId, toStatus, requiresNote){
  let note = '';
  if (requiresNote) {
    note = prompt('A short note is required to make this transition:');
    if (note === null) return;
    if (!note.trim()) { ndUI.toast('Note required','error'); return; }
  }
  const r = await fetch('/nidaan/ops/api/tasks/'+taskId+'/transition', {
    method:'POST', headers:{...hdrs(),'Content-Type':'application/json'},
    body: JSON.stringify({to_status:toStatus, note: note||''})
  });
  if (r.ok) { ndUI.toast('Status updated','success'); openTaskDrawer(taskId); loadTasksKanban(); }
  else { const e = await r.json().catch(()=>({detail:'Error'})); ndUI.toast(_extractErr(e,'Transition failed'),'error'); }
}

async function taskQC(taskId, approve){
  const note = prompt(approve?'QC approval note (optional):':'Reason for QC rejection:') || '';
  const r = await fetch('/nidaan/ops/api/tasks/'+taskId+'/qc-review', {
    method:'POST', headers:{...hdrs(),'Content-Type':'application/json'},
    body: JSON.stringify({approve, note})
  });
  if (r.ok) { ndUI.toast(approve?'QC approved':'QC kicked back','success'); openTaskDrawer(taskId); loadTasksKanban(); }
  else { const e=await r.json().catch(()=>({detail:'Error'})); ndUI.toast(_extractErr(e,'Failed'),'error'); }
}

async function taskApproval(taskId, approve){
  const note = prompt(approve?'Approval note (optional):':'Reason for rejection:') || '';
  const r = await fetch('/nidaan/ops/api/tasks/'+taskId+'/approve', {
    method:'POST', headers:{...hdrs(),'Content-Type':'application/json'},
    body: JSON.stringify({approve, note})
  });
  if (r.ok) { ndUI.toast(approve?'Approval recorded':'Rejection recorded','success'); openTaskDrawer(taskId); loadTasksKanban(); }

async function submitNewTask(claimId){
  const title = (document.getElementById('ntTitle_'+claimId)?.value || '').trim();
  if (!title) { ndUI.toast('Title is required','error'); return; }
  const assigneeVal = document.getElementById('ntAssignee_'+claimId).value;
  const priority = document.getElementById('ntPriority_'+claimId).value;
  const depToggle = document.getElementById('ntDepToggle_'+claimId).checked;
  const depVal = depToggle ? document.getElementById('ntDep_'+claimId).value : '';
  const comment = (document.getElementById('ntComment_'+claimId)?.value || '').trim();
  const body = {
    claim_id: claimId,
    title,
    status_slug: 'initial_review',
    priority,
  };
  if (assigneeVal) body.assigned_to_staff_id = parseInt(assigneeVal);
  if (depVal) body.depends_on_task_id = parseInt(depVal);
  if (comment) body.initial_comment = comment;
  const r = await fetch('/nidaan/ops/api/tasks', {
    method:'POST', headers:{...hdrs(),'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  if (r.ok) {
    ndUI.toast('Task created ✓','success');
    document.getElementById('newTaskForm_'+claimId)?.remove();
    loadClaimTasks(claimId);
  } else {
    const e = await r.json().catch(()=>({detail:'Error'}));
    ndUI.toast(_extractErr(e, 'Create failed'),'error');
  }
}

async function loadClaimTasks(claimId){
  const area = document.getElementById('claimTasksArea_'+claimId);
  if (!area) return;
  // Preserve any open create-form during refresh
  const openForm = document.getElementById('newTaskForm_'+claimId);
  const [statuses, assignees] = await Promise.all([_loadStatusesOnce(), _loadAssigneesOnce()]);
  const r = await fetch('/nidaan/ops/api/tasks?claim_id='+claimId, { headers: hdrs() });
  if (!r.ok) { area.innerHTML = '<div style="color:var(--nd-danger-text);font-size:.85rem">Failed to load tasks</div>'; return; }
  const d = await r.json();
  const tasks = d.tasks || [];

  if (!tasks.length) {
    area.innerHTML = (openForm ? openForm.outerHTML : '') +
      '<div style="padding:.75rem 0;font-size:.82rem;color:var(--nd-text-faint)">No tasks for this claim yet.</div>';
    return;
  }

  // Group by dependency: tasks with no `depends_on_task_id` are roots; others
  // nest under the task they're blocked by. Single-level tree.
  const byId = Object.fromEntries(tasks.map(t => [t.task_id, t]));
  const roots = tasks.filter(t => !t.depends_on_task_id || !byId[t.depends_on_task_id]);
  const children = {};
  tasks.forEach(t => {
    if (t.depends_on_task_id && byId[t.depends_on_task_id]) {
      (children[t.depends_on_task_id] = children[t.depends_on_task_id] || []).push(t);
    }
  });

  const renderTask = (t, isChild) => {
    const stColor = _statusColor(t.status_slug, statuses);
    const stLabel = _statusLabel(t.status_slug, statuses);
    const assignee = (assignees.find(a => a.staff_id === t.assigned_to_staff_id) || {}).name || 'Unassigned';
    const isComplete = (t.status_slug === 'completed' || t.status_slug === 'cancelled');
    const parent = t.depends_on_task_id ? byId[t.depends_on_task_id] : null;
    const isBlocked = parent && parent.status_slug !== 'completed' && parent.status_slug !== 'cancelled';
    const dueLabel = t.sla_due_at ? (t.sla_due_at||'').split('T')[0] : '';
    return `
      <div style="${isChild?'margin-left:1.5rem;border-left:2px solid rgba(255,255,255,.08);padding-left:.75rem':''}">
        <div onclick="openTaskDrawer(${t.task_id})"
             style="padding:.6rem .8rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-left:3px solid ${stColor};border-radius:6px;margin-bottom:.4rem;cursor:pointer;${isComplete?'opacity:.55':''}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem">
            <div style="flex:1;min-width:0">
              <div style="font-size:.86rem;font-weight:600">
                ${isChild?'↳ ':''}${esc(t.title||'Task')}
                ${isBlocked?'<span style="font-size:.7rem;color:var(--nd-warning-text);margin-left:.4rem">⏸ blocked</span>':''}
              </div>
              <div style="font-size:.74rem;color:var(--nd-text-muted);margin-top:.2rem">
                <span style="color:${stColor}">${esc(stLabel)}</span> · @ ${esc(assignee)}
                ${t.priority && t.priority!=='normal'?` · <b style="color:var(--nd-warning-text)">${esc(t.priority)}</b>`:''}
              </div>
            </div>
            ${dueLabel ? `<div style="font-size:.72rem;color:var(--nd-text-muted);white-space:nowrap">${esc(dueLabel)}</div>`:''}
          </div>
        </div>
        ${(children[t.task_id]||[]).map(c => renderTask(c, true)).join('')}
      </div>`;
  };

  area.innerHTML = (openForm ? openForm.outerHTML : '') + roots.map(t => renderTask(t, false)).join('');
}

// ── Payment Links (super-admin generator) ────────────────────────────────────
function plPurposeChange(){
  const p = (document.getElementById('plPurpose')||{}).value;
  const planWrap = document.getElementById('plPlanWrap');
  const amtWrap = document.getElementById('plAmountWrap');
  if (planWrap) planWrap.style.display = (p==='subscription') ? '' : 'none';
  if (amtWrap)  amtWrap.style.display  = (p==='subscription' || p==='custom') ? '' : 'none';
}
async function genPaymentLink(){
  const g = id => document.getElementById(id);
  const msg = g('plMsg');
  const setMsg = (t,ok)=>{ if(msg){ msg.textContent=t; msg.style.color = ok===true?'#6ee7b7':(ok===false?'#fca5a5':'rgba(255,255,255,.6)'); } };
  const purpose = g('plPurpose').value;
  const name = (g('plName').value||'').trim();
  const phone = (g('plPhone').value||'').replace(/[^0-9]/g,'');
  if(!name){ setMsg('Enter the customer name.',false); return; }
  if(phone.length!==10){ setMsg('Enter a valid 10-digit mobile.',false); return; }
  const body = { purpose, customer_name:name, customer_phone:phone,
                 customer_email:(g('plEmail').value||'').trim(),
                 expiry_days: parseInt(g('plExpiry').value)||3, amount:0, plan:'' };
  if(purpose==='subscription'){ body.plan=g('plPlan').value; body.amount=parseInt(g('plAmount').value)||0; if(body.amount<=0){ setMsg('Enter the subscription amount.',false); return; } }
  else if(purpose==='custom'){ body.amount=parseInt(g('plAmount').value)||0; if(body.amount<=0){ setMsg('Enter an amount.',false); return; } }
  setMsg('Generating…');
  try{
    const r = await fetch('/nidaan/ops/api/payment-links',{method:'POST',headers:{...hdrs(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.detail||'Could not create link');
    setMsg('Link ready ✓ (₹'+d.amount+')',true);
    ['plName','plPhone','plEmail','plAmount'].forEach(i=>{ if(g(i)) g(i).value=''; });
    _plShareOverlay(d.short_url, d.amount, name, phone);
    loadPaymentLinks();
  }catch(e){ setMsg(e.message,false); }
}
function _plShareOverlay(url, amount, name, phone){
  const wa='https://wa.me/'+(phone?('91'+phone):'')+'?text='+encodeURIComponent('Namaste'+(name?(' '+name):'')+'! Nidaan Partner — kripya ₹'+amount+' ka payment yahan karein: '+url);
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(2,12,27,.9);display:flex;align-items:center;justify-content:center;padding:1.2rem';
  ov.innerHTML='<div style="max-width:430px;width:100%;background:var(--nd-bg-base-2);border:1px solid rgba(6,182,212,.4);border-radius:14px;padding:1.4rem">'
    +'<div style="font-weight:800;color:var(--nd-text-primary);font-size:1.05rem;margin-bottom:.5rem">🔗 Payment link ready — ₹'+amount+'</div>'
    +'<div style="font-size:.82rem;color:var(--nd-text-secondary);margin-bottom:.8rem">Send this to the customer. On payment their account is created + entitlement granted automatically.</div>'
    +'<input readonly value="'+esc(url)+'" onclick="this.select()" style="width:100%;background:var(--nd-bg-surface-2);border:1px solid var(--nd-border-strong);color:var(--nd-text-primary);padding:.55rem .7rem;border-radius:8px;font-size:.8rem;margin-bottom:.7rem">'
    +'<div style="display:flex;gap:.5rem;flex-wrap:wrap">'
    +'<button id="plCopyBtn" class="nd-btn nd-btn-sm nd-btn-primary" style="flex:1">📋 Copy</button>'
    +'<a href="'+esc(wa)+'" target="_blank" rel="noopener" class="nd-btn nd-btn-sm" style="flex:1;background:#25D366;color:#053b1e;font-weight:700;text-align:center;text-decoration:none">💬 WhatsApp</a>'
    +'<button id="plCloseBtn" class="nd-btn nd-btn-sm nd-btn-ghost">Close</button>'
    +'</div></div>';
  document.body.appendChild(ov);
  document.getElementById('plCloseBtn').onclick=()=>ov.remove();
  document.getElementById('plCopyBtn').onclick=()=>{ try{navigator.clipboard.writeText(url);}catch(e){} document.getElementById('plCopyBtn').textContent='✓ Copied'; };
}
async function loadPaymentLinks(){
  const box = document.getElementById('plList'); if(!box) return;
  try{
    const r = await fetch('/nidaan/ops/api/payment-links',{headers:hdrs()});
    if(!r.ok){ box.innerHTML=''; return; }
    const links = (await r.json()).links || [];
    if(!links.length){ box.innerHTML='<div style="font-size:.8rem;color:var(--nd-text-faint)">No payment links generated yet.</div>'; return; }
    const badge = s => { const c = s==='paid'?'#065f46;color:#6ee7b7':(s==='expired'||s==='cancelled'?'#7c2d12;color:#fdba74':'#334155;color:#cbd5e1'); return '<span style="background:'+c+';padding:.1rem .5rem;border-radius:10px;font-size:.72rem;font-weight:700">'+esc(s)+'</span>'; };
    const rows = links.map(l=>`<tr>
      <td style="padding:.4rem .5rem">${esc(l.customer_name||'—')}<br><span style="font-size:.72rem;color:var(--nd-text-faint)">${esc(l.customer_phone||'')}</span></td>
      <td style="padding:.4rem .5rem">${esc(l.purpose)}${l.plan?(' · '+esc(l.plan)):''}</td>
      <td style="padding:.4rem .5rem">₹${Math.round((l.amount_paise||0)/100)}</td>
      <td style="padding:.4rem .5rem">${badge(l.status||'created')}</td>
      <td style="padding:.4rem .5rem;font-size:.72rem;color:var(--nd-text-faint)">${l.created_at?fmtDate(l.created_at):''}</td>
      <td style="padding:.4rem .5rem">${l.short_url&&l.status!=='paid'?('<button class="nd-btn nd-btn-sm nd-btn-ghost" onclick="navigator.clipboard.writeText(\''+esc(l.short_url)+'\');this.textContent=\'✓\'">📋</button>'):''}</td>
    </tr>`).join('');
    box.innerHTML='<table style="width:100%;border-collapse:collapse;font-size:.82rem"><thead><tr style="color:var(--nd-text-muted);text-align:left">'
      +'<th style="padding:.4rem .5rem">Customer</th><th style="padding:.4rem .5rem">Purpose</th><th style="padding:.4rem .5rem">Amount</th><th style="padding:.4rem .5rem">Status</th><th style="padding:.4rem .5rem">Created</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
  }catch(e){ box.innerHTML=''; }
}

  const box = document.getElementById('taskCatManager');
  if (!box) return;
  _taskCatsCache = (cats || []).filter(c=>c.active);   // keep pickers in sync
  const rows = (cats||[]).map(c=>`
    <div style="display:flex;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px solid rgba(255,255,255,.05);${c.active?'':'opacity:.5'}">
      <input type="color" value="${esc(c.color||'#64748b')}" onchange="qtCatUpdate(${c.category_id},{color:this.value})" style="width:34px;height:30px;background:transparent;border:none;cursor:pointer;flex-shrink:0" title="Colour">
      <span style="font-family:monospace;font-weight:800;font-size:.8rem;color:${esc(c.color||'#64748b')};min-width:42px">${esc(c.code)}</span>
      <input value="${esc(c.label)}" onchange="qtCatUpdate(${c.category_id},{label:this.value})"
             style="flex:1;min-width:0;background:var(--nd-bg-surface);border:1px solid var(--nd-border-strong);color:var(--nd-text-primary);padding:.35rem .55rem;border-radius:6px;font-size:.82rem">

             style="width:64px;background:var(--nd-bg-surface);border:1px solid var(--nd-border-strong);color:var(--nd-text-primary);padding:.35rem .4rem;border-radius:6px;font-size:.8rem;text-align:center">
      <label title="Require complainant name + mobile when this category is chosen" style="display:flex;align-items:center;gap:.25rem;font-size:.72rem;color:var(--nd-text-secondary);cursor:pointer;white-space:nowrap">
        <input type="checkbox" ${c.requires_complainant?'checked':''} onchange="qtCatUpdate(${c.category_id},{requires_complainant:this.checked})" style="accent-color:#3b82f6"> complainant
      </label>
      ${c.active
        ? `<button class="nd-btn nd-btn-sm nd-btn-ghost" style="color:var(--nd-danger-text)" onclick="qtCatDelete(${c.category_id},'${esc(c.label)}')">Deactivate</button>`
        : `<button class="nd-btn nd-btn-sm nd-btn-secondary" onclick="qtCatUpdate(${c.category_id},{active:true})">Reactivate</button>`}

    ${rows || '<div style="color:var(--nd-text-faint);font-size:.85rem;padding:.5rem 0">No categories yet.</div>'}
    <div style="display:flex;gap:.5rem;align-items:center;margin-top:.85rem;flex-wrap:wrap">
      <input type="color" id="newCatColor" value="#22d3ee" style="width:34px;height:30px;background:transparent;border:none;cursor:pointer" title="Colour">
      <input id="newCatCode" placeholder="CODE" maxlength="12" style="width:80px;background:var(--nd-bg-surface);border:1px solid var(--nd-border-strong);color:var(--nd-text-primary);padding:.4rem .5rem;border-radius:6px;font-size:.82rem;text-transform:uppercase">
      <input id="newCatLabel" placeholder="Label (e.g. Follow-up)" style="flex:1;min-width:120px;background:var(--nd-bg-surface);border:1px solid var(--nd-border-strong);color:var(--nd-text-primary);padding:.4rem .55rem;border-radius:6px;font-size:.82rem">
      <button class="nd-btn nd-btn-sm nd-btn-primary" onclick="qtCatAdd()">＋ Add category</button>
    </div>`;
}
async function qtCatAdd(){
  const code = (document.getElementById('newCatCode').value||'').trim().toUpperCase();
  const label = (document.getElementById('newCatLabel').value||'').trim();
  const color = document.getElementById('newCatColor').value || '#64748b';
  if (!code || !label) { ndUI.toast('Code and label are required','error'); return; }
  const r = await fetch('/nidaan/ops/api/task-categories', {
    method:'POST', headers:{...hdrs(),'Content-Type':'application/json'},
    body: JSON.stringify({code, label, color, sort_order:100})
  });
  const d = await r.json().catch(()=>({}));
  if (r.ok) { ndUI.toast('Category added ✓','success'); _taskCatsCache=null; renderTaskCatManager(d.categories||[]); }
  else ndUI.toast(_extractErr(d,'Add failed'),'error');
}
async function qtCatUpdate(id, patch){
  const r = await fetch('/nidaan/ops/api/task-categories/'+id, {
    method:'PATCH', headers:{...hdrs(),'Content-Type':'application/json'}, body: JSON.stringify(patch)
  });
  const d = await r.json().catch(()=>({}));
  if (r.ok) { ndUI.toast('Saved ✓','success'); _taskCatsCache=null; renderTaskCatManager(d.categories||[]); }
  else ndUI.toast('Update failed','error');
}
async function qtCatDelete(id, label){
  if (!confirm('Deactivate category "'+label+'"? It will disappear from pickers but stay on existing tasks.')) return;
  const r = await fetch('/nidaan/ops/api/task-categories/'+id, { method:'DELETE', headers: hdrs() });
  const d = await r.json().catch(()=>({}));
  if (r.ok) { ndUI.toast('Deactivated','success'); _taskCatsCache=null; renderTaskCatManager(d.categories||[]); }
  else ndUI.toast('Failed','error');
}

function setGuideLang(l){ guideStop(); _guideLang = l; loadGuidePanel(); }

// Browser speech has three well-known traps we have to handle explicitly:
//  1. getVoices() is EMPTY on first call (voices load async) → wait for them.
//  2. Chrome silently fails on long utterances → speak in short chunks.
//  3. Chrome halts synthesis after ~15s → keep it alive with resume().
let _guideQueue = [], _guideIdx = 0, _guideKeepAlive = null, _guideStopped = false;

function _guideVoices(){
  return new Promise(resolve => {
    const got = window.speechSynthesis.getVoices();
    if (got && got.length) return resolve(got);
    let done = false;
    const finish = () => { if(!done){ done = true; resolve(window.speechSynthesis.getVoices()||[]); } };
    window.speechSynthesis.onvoiceschanged = finish;
    setTimeout(finish, 1200);   // some browsers never fire the event
  });
}

function _guideChunks(text){
  // Split on sentence ends (Hindi danda too), then pack into ~180-char pieces.
  const parts = String(text).split(/(?<=[।.!?])\s+/);
  const out = []; let buf = '';
  for (const p of parts) {
    if ((buf + ' ' + p).trim().length > 180) { if (buf.trim()) out.push(buf.trim()); buf = p; }
    else buf += ' ' + p;
  }
  if (buf.trim()) out.push(buf.trim());
  return out.filter(Boolean);
}

async function guideSpeak(){
  if (!('speechSynthesis' in window)) {
    ndUI.toast('This browser cannot play audio','error'); return;
  }
  guideStop();
  _guideStopped = false;
  if (!_guideSpeech) return;
  const note = document.getElementById('guideAudioNote');
  const wantHi = (_guideLang === 'hi');
  const lang = wantHi ? 'hi-IN' : 'en-IN';

  if (note) note.textContent = 'Loading voice…';
  const voices = await _guideVoices();
  const voice = voices.find(v => v.lang === lang)
             || voices.find(v => (v.lang||'').replace('_','-').toLowerCase().startsWith(wantHi ? 'hi' : 'en'));

  if (wantHi && !voice) {
    // Be honest rather than playing silence.
    if (note) note.innerHTML = '<span style="color:var(--nd-warning-text)">No Hindi voice on this device — see note below.</span>';
    const help = document.getElementById('guideVoiceHelp');
    if (help) help.style.display = 'block';
    return;
  }
  if (note) note.textContent = voice ? ('Voice: ' + voice.name) : '';

  _guideQueue = _guideChunks(_guideSpeech);
  _guideIdx = 0;
  const btn = document.getElementById('guidePlayBtn');
  const speakNext = () => {
    if (_guideStopped || _guideIdx >= _guideQueue.length) { guideStop(); return; }
    const u = new SpeechSynthesisUtterance(_guideQueue[_guideIdx]);
    u.lang = lang; u.rate = 0.95;
    if (voice) u.voice = voice;
    u.onend = () => { _guideIdx++; if (!_guideStopped) speakNext(); };
    u.onerror = () => { _guideIdx++; if (!_guideStopped) speakNext(); };
    if (btn) btn.textContent = `⏸ ${_guideIdx+1}/${_guideQueue.length}`;
    window.speechSynthesis.speak(u);
  };
  // Keep Chrome from pausing mid-narration.
  _guideKeepAlive = setInterval(() => {
    try { if (window.speechSynthesis.speaking) window.speechSynthesis.resume(); } catch(e){}
  }, 8000);
  speakNext();
}

function guideStop(){
  _guideStopped = true;
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){}
  if (_guideKeepAlive) { clearInterval(_guideKeepAlive); _guideKeepAlive = null; }
  _guideQueue = []; _guideIdx = 0;
  const b = document.getElementById('guidePlayBtn');
  if (b) b.textContent = (_guideLang==='hi' ? '🔊 सुनें' : '🔊 Listen');
}

// Show what this device actually has — makes "no Hindi audio" diagnosable.
async function guideShowVoices(){
  const box = document.getElementById('guideVoiceList');
  if (!box) return;
  const v = await _guideVoices();
  const hi = v.filter(x => (x.lang||'').toLowerCase().startsWith('hi'));
  box.style.display = 'block';
  box.innerHTML = `<b>${v.length}</b> voices found on this device · <b>${hi.length}</b> Hindi.<br>` +
    (hi.length ? hi.map(x=>`✅ ${esc(x.name)} (${esc(x.lang)})`).join('<br>')
               : '<span style="color:var(--nd-warning-text)">No Hindi voice installed — that is why Hindi audio is silent.</span>');
}

// Live-refreshing QR pairing. WhatsApp rotates its QR every ~20s and invalidates
// the old code — scanning a stale one gives "Couldn't link device / try again later".
// So we poll for a fresh QR every ~18s and swap the image, exactly like web.whatsapp.com,
// and auto-detect the moment the session connects.
let _qrPollTimer = null;
function _stopQRPoll(){ if(_qrPollTimer){ clearInterval(_qrPollTimer); _qrPollTimer=null; } }

function _qrSrc(d){ return d.qr ? (d.qr.startsWith('data:') ? d.qr : 'data:image/png;base64,'+d.qr) : ''; }

function _renderQRConnected(slot){
  _stopQRPoll();
  document.getElementById('drawerBody').innerHTML = `
    <div style="text-align:center;padding:1.5rem">
      <div style="font-size:2.5rem;margin-bottom:.5rem">✅</div>
      <h3 style="margin-bottom:.5rem;color:#22c55e">Slot ${slot} connected!</h3>
      <div style="font-size:.85rem;color:var(--nd-text-secondary)">WhatsApp is now linked and ready to send.</div>
    </div>`;
  ndUI.toast('Slot '+slot+' connected!','success');
  loadOfficialNumbers();
}

function _renderQRDrawer(slot, d){
  const qrSrc = _qrSrc(d);
  let html;
  if (d.already_connected || d.state === 'open') {
    html = `
      <div style="text-align:center;padding:1.5rem">
        <div style="font-size:2.5rem;margin-bottom:.5rem">✅</div>
        <h3 style="margin-bottom:.5rem;color:#22c55e">Slot ${slot} is already connected</h3>
        <div style="font-size:.85rem;color:var(--nd-text-secondary)">
          No QR needed — this WhatsApp instance is paired and active. If you want to re-pair
          (e.g. moved SIM to a new phone), use Re-pair to log it out first.
        </div>
      </div>`;
  } else {
    html = `
      <div style="text-align:center;padding:1rem">
        <h3 style="margin-bottom:.5rem">Pair Slot ${slot}</h3>
        <div style="font-size:.85rem;color:var(--nd-text-secondary);margin-bottom:.75rem">
          Open <b>the official WhatsApp app</b> on the SIM phone → Settings → Linked devices → Link a device → Scan this code.
        </div>
        <div id="qrHolder">
        ${qrSrc ? `<img id="qrImg" src="${qrSrc}" style="width:280px;height:280px;max-width:100%;background:#fff;padding:1rem;border-radius:8px">` :
                  `<div id="qrImg" style="color:var(--nd-warning-text);padding:2rem">⏳ Generating QR — Baileys is booting…</div>`}
        </div>
        <div style="font-size:.75rem;color:var(--nd-text-muted);margin-top:.6rem;line-height:1.4">
          🔄 This QR refreshes automatically every ~20s. Scan it as soon as it appears — if you scan an
          old code WhatsApp says <i>"try again later"</i>. It links within a few seconds of a good scan.
        </div>
        ${d.pairing_code ? `<div style="margin-top:.75rem;font-family:monospace;font-size:1.2rem;color:var(--nd-cyan-text)">Pair code: ${esc(d.pairing_code)}</div>` : ''}
      </div>`;
  }
  document.getElementById('drawerTitle').textContent = `📷 Pair WhatsApp — Slot ${slot}`;
  document.getElementById('drawerBody').innerHTML = html;
  document.getElementById('drawerBg').classList.add('open');
}

function _startQRPoll(slot){
  _stopQRPoll();
  let polls = 0;
  _qrPollTimer = setInterval(async ()=>{
    // Stop if the drawer was closed, replaced by another view, or we've polled ~4 min.
    if (!document.getElementById('drawerBg').classList.contains('open')) { _stopQRPoll(); return; }
    if (!(document.getElementById('drawerTitle').textContent||'').includes('Pair WhatsApp')) { _stopQRPoll(); return; }
    if (++polls > 13) { _stopQRPoll(); return; }
    try {
      const r = await fetch(`/nidaan/ops/api/official-numbers/${slot}/qr`, { headers: hdrs() });
      if (!r.ok) return;
      const d = await r.json();
      if (d.locked) return;
      if (d.already_connected || d.state === 'open') { _renderQRConnected(slot); return; }
      const qrSrc = _qrSrc(d);
      if (!qrSrc) return;
      let img = document.getElementById('qrImg');
      const holder = document.getElementById('qrHolder');
      if (img && img.tagName === 'IMG') { img.src = qrSrc; }
      else if (holder) { holder.innerHTML = `<img id="qrImg" src="${qrSrc}" style="width:280px;height:280px;max-width:100%;background:#fff;padding:1rem;border-radius:8px">`; }
    } catch(e){}
  }, 18000);
}

async function showQR(slot, force){
  // force=1 → Re-pair: log the (possibly ghost) session out and issue a fresh QR.
  _stopQRPoll();
  const r = await fetch(`/nidaan/ops/api/official-numbers/${slot}/qr${force?'?force=1':''}`, { headers: hdrs() });
  if (!r.ok) {
    const e = await r.json().catch(()=>({detail:'Error'}));
    ndUI.toast('QR fetch failed: ' + _extractErr(e, String(r.status)),'error'); return;
  }
  const d = await r.json();
  if (d.locked) {
    ndUI.toast(d.message || ('Please wait ' + (d.wait_seconds||'a few') + 's before re-pairing'), 'info');
    // Keep the live QR refreshing if the drawer is already open.
    if (document.getElementById('drawerBg').classList.contains('open')) _startQRPoll(slot);
    return;
  }
  _renderQRDrawer(slot, d);
  if (!(d.already_connected || d.state === 'open')) _startQRPoll(slot);
}

          </div>
          <div style="font-size:.78rem;color:var(--nd-text-muted);margin-top:.2rem">${esc(rf.reason||'—')}</div>
          ${rf.last_error ? `<div style="font-size:.75rem;color:var(--nd-danger-text);margin-top:.3rem;background:rgba(248,113,113,.1);padding:.35rem .6rem;border-radius:5px"><b>Last error:</b> ${esc(rf.last_error)}</div>` : ''}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:.45rem">
          ${statusPill(rf.status)}
          <div style="font-size:.72rem;color:var(--nd-text-faint)">${rf.requested_at ? rf.requested_at.split('T')[0] : ''}</div>
          ${(rf.status==='failed' || rf.status==='pending') ? `<button class="nd-btn nd-btn-sm nd-btn-primary" onclick="retryRefund(${rf.refund_id})">🔁 Retry</button>` : ''}
          ${rf.razorpay_refund_id ? `<div style="font-size:.7rem;color:var(--nd-text-faint);font-family:monospace">${esc(rf.razorpay_refund_id)}</div>` : ''}
        </div>
      </div>
    </div>`;

  const reviewRow = (s) => `
    <div class="nd-card" style="padding:.85rem 1rem;margin-bottom:.55rem;border-left:3px solid #fbbf24">
      <div style="display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;align-items:flex-start">
        <div>
          <div style="font-weight:700">${esc(s.owner_name||'—')} · ₹${s.amount_paid}</div>
          <div style="font-size:.8rem;color:var(--nd-text-secondary);margin-top:.15rem">${esc(s.account_email||'—')} · sub_id=${s.sub_id} · ${esc(s.plan)}</div>
          <div style="font-size:.78rem;color:var(--nd-text-muted);margin-top:.2rem">
            Cancelled · 0 claims filed · in policy window
          </div>
        </div>
        <button class="nd-btn nd-btn-sm nd-btn-primary" onclick="processRefund(${s.sub_id},${s.amount_paid})">↩️ Refund ₹${s.amount_paid}</button>
      </div>
    </div>`;

  const isEmbedded = (panel.id !== 'panel-refunds');
  const wrap = isEmbedded ? '<div>' : '<div style="padding:1.25rem 1.5rem 2rem">';
  panel.innerHTML = `${wrap}
      ${isEmbedded ? '' : '<h1 style="font-size:1.4rem;font-weight:800;margin-bottom:.3rem">↩️ Refunds</h1>'}
      <div style="color:var(--nd-text-muted);font-size:.82rem;margin-bottom:1rem">
        Policy A: full refund when cancelled within <b>${policy.window_days||7} days</b> AND zero claims filed.
        Auto-triggered on cancel; failures can be retried below.
      </div>

      ${needsReview.length ? `
        <h3 style="font-size:.95rem;font-weight:700;margin-bottom:.55rem;color:var(--nd-warning-text)">⚠️ Needs Action — ${needsReview.length} eligible but unrefunded</h3>
        <div style="margin-bottom:1.25rem">${needsReview.map(reviewRow).join('')}</div>
      ` : ''}

      <h3 style="font-size:.95rem;font-weight:700;margin-bottom:.55rem">Refund history</h3>
      ${refunds.length ? refunds.map(refundRow).join('') :
        '<div style="padding:1.5rem;text-align:center;color:var(--nd-text-faint);font-size:.85rem">No refunds yet</div>'}
    </div>`;
}

async function retryRefund(refundId){
  if (!confirm('Retry this refund? Razorpay will be called again.')) return;
  const r = await fetch('/nidaan/ops/api/refunds/'+refundId+'/retry', {
    method:'POST', headers: hdrs()
  });
  if (r.ok) { ndUI.toast('Refund retried successfully','success'); loadRefunds(); return; }
  const e = await r.json().catch(()=>({detail:'Failed'}));
  const msg = _extractErr(e, '');
  if (msg.includes('does not have enough balance')) {
    alert('Razorpay merchant balance is empty. Add funds in Razorpay Dashboard → Funds → Add Money, then retry this refund.');
  } else {
    ndUI.toast('Retry failed: '+(msg.substring(0,180)||r.status),'error');
  }
  loadRefunds();
}

async function processRefund(subId, amount){
  if (!confirm(`Process refund of ₹${amount} for sub_id ${subId}?`)) return;
  const r = await fetch('/nidaan/ops/api/refunds/manual', {
    method:'POST', headers:{...hdrs(),'Content-Type':'application/json'},
    body: JSON.stringify({sub_id: subId, amount: amount, reason: 'sa_manual_from_needs_review'})
  });
  if (r.ok) { ndUI.toast('Refund processed','success'); loadRefunds(); }
  else {
    const e = await r.json().catch(()=>({detail:'Failed'}));
    ndUI.toast('Failed: '+_extractErr(e, String(r.status)),'error');
  }
}
</script>

<button id="pwaInstall">📲 <span>Install Nidaan Ops app</span><span class="x" title="Dismiss">✕</span></button>
<div id="pwaIosTip"><span class="x" onclick="document.getElementById('pwaIosTip').style.display='none';localStorage.setItem('pwaIosDismissed','1')">✕</span>
📲 <b>Install this app:</b> tap the <b>Share</b> icon below, then <b>“Add to Home Screen”.</b></div>
<script>
(function(){
  // 1) register service worker (root scope so it controls /nidaan/*)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/nidaan-sw.js', {scope: '/'}).catch(function(){});
    });
    // Auto-update: when a freshly-deployed SW takes control (not the first
    // install), show a one-tap "Update" toast — no data loss, no forced reload.
    var _hadCtrl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (!_hadCtrl || document.getElementById('swUpd')) return;
      var d = document.createElement('div');
      d.id = 'swUpd';
      d.innerHTML = '🔄 New version available <b style="text-decoration:underline;margin-left:.35rem">Update</b>';
      d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:2147483647;background:#0d9488;color:#fff;padding:.6rem 1rem;border-radius:999px;font:600 13px system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.4);cursor:pointer';
      d.onclick = function(){ location.reload(); };
      document.body.appendChild(d);
    });
  }
  // 2) install prompt (Android/Chrome/Edge)
  var deferred = null;
  var btn = document.getElementById('pwaInstall');
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e;
    if (!isStandalone && localStorage.getItem('pwaDismissed') !== '1') btn.style.display = 'inline-flex';
  });
  btn.addEventListener('click', function(ev){
    if (ev.target.classList.contains('x')) { btn.style.display='none'; localStorage.setItem('pwaDismissed','1'); return; }
    if (!deferred) { btn.style.display='none'; return; }
    deferred.prompt();
    deferred.userChoice.finally(function(){ deferred=null; btn.style.display='none'; });
  });
  window.addEventListener('appinstalled', function(){ btn.style.display='none'; });
  // 3) iOS Safari has no beforeinstallprompt — show a one-time hint
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var inSafari = isIOS && !/crios|fxios|edgios/i.test(navigator.userAgent);
  if (inSafari && !isStandalone && localStorage.getItem('pwaIosDismissed') !== '1') {
    setTimeout(function(){ var t=document.getElementById('pwaIosTip'); if(t) t.style.display='block'; }, 3500);
  }
})();
</script>
